    function mountFoe() {
        const enemy = currentEnemy;
        Art.withImage($('foe-art'), enemy.img || `${enemy.name}.png`, Art.enemyCrest(enemy, battle.dungeon.theme));
        $('foe-art').dataset.enemy = enemy.name;
    }
    function snap() {
        return { p: { hp: player.hp, mp: player.mp, maxHp: player.maxHp, maxMp: player.maxMp }, e: { hp: currentEnemy.hp, maxHp: currentEnemy.maxHp, name: currentEnemy.name } };
    }
    // The trail (b) follows the fill (i) after a short CSS delay, so a hit leaves a fading ghost.
    function setGauge(el, value, max) {
        const v = `${Math.max(0, Math.min(100, value / max * 100))}%`;
        el.style.setProperty('--v', v);
        el.style.setProperty('--g', v);
    }
    function paintNumbers(s) {
        setGauge($('me-hp'), s.p.hp, s.p.maxHp);
        setGauge($('me-mp'), s.p.mp, s.p.maxMp);
        $('me-hp-num').textContent = `${fmt(s.p.hp)} / ${fmt(s.p.maxHp)}`;
        $('me-mp-num').textContent = `${fmt(s.p.mp)} / ${fmt(s.p.maxMp)}`;
        setGauge($('foe-hp'), s.e.hp, s.e.maxHp);
        $('foe-hp-num').textContent = `${fmt(s.e.hp)} / ${fmt(s.e.maxHp)}`;
    }
    function playerChips() {
        const b = buffs.player, out = [];
        const add = (label, tone = '', turns) => out.push({ label, tone, turns });
        if (b.stun) add('행동 불가', 'warn');
        if (b.nextTurnStun) add('다음 턴 행동 불가', 'bad');
        if (b.charging) add('디바인 차지', 'gold');
        if (b.chargingMilkyway) add('밀키웨이 차지', 'gold');
        if (b.sageForm) add(FORM_NAME[b.sageForm], 'gold', b.formTurns);
        if (b.veilTurns) add(`회피 +${pct(b.veilVal || 0)}`, '', b.veilTurns);
        if (b.instinctTurns) add('인스팅트', '', b.instinctTurns);
        if (b.adrenalineTurns) add('아드레날린', '', b.adrenalineTurns);
        if (b.critBuff) add('치명 ↑', '', b.critBuffTurns);
        if (b.nextEva) add('회피 태세');
        if (b.divineTurns) add('디바인 아머', '', b.divineTurns);
        if (b.enchantTurns) add('파이어 인챈트', '', b.enchantTurns);
        if (b.sanctuaryTurns) add('생츄어리', '', b.sanctuaryTurns);
        if (b.medi) add('메디테이션', '', b.mediTurns);
        if (b.manaDress) add('마나드레스', '', b.manaDressTurns);
        if (b.milkshakeTurns) add('밀크쉐이크', '', b.milkshakeTurns);
        if (b.gardenTurns) add('퀸즈 도메인', 'gold', b.gardenTurns);
        if (b.royalBloomTurns) add('로열 블룸', 'gold', b.royalBloomTurns);
        if (b.goddessTurns) add('여신 강림', 'gold', b.goddessTurns);
        if (b.goddessBlessing) add('자애의 축복', 'gold');
        if (b.demonEyeTurns) add('마안', 'gold', b.demonEyeTurns);
        if (b.demonEyeLegendTurns) add('진: 마안', 'gold', b.demonEyeLegendTurns);
        if (b.undyingPowerTurns) add('언다잉', 'gold', b.undyingPowerTurns);
        if (b.castleStack) add(`캐슬 ${b.castleStack}`, 'gold');
        if (b.defZero || b.defZeroNext) add('방어 0', 'bad');
        if (b.revived) add('부활 사용함', 'bad');
        return out;
    }
    function enemyChips() {
        const b = buffs.enemy, e = currentEnemy, out = [];
        const add = (label, tone = '', turns) => out.push({ label, tone, turns });
        const every = (n, label) => { const left = (n - (turnCount % n)) % n; add(left ? `${label} ${left}턴 후` : `${label} 이번 턴`, left ? 'bad' : 'warn'); };
        if (e.ai === 'mashin') add(turnCount % 2 ? '물리 면역' : '마법 면역', 'warn');
        if (e.ai === 'ghost_king' && !b.counter) every(5, '반격 태세');
        if (e.ai === 'mawang') every(5, '데스 핸드');
        if (e.ai === 'mashin') every(7, '데스 핸드');
        if (e.ai === 'tree' && turnCount <= 4) add(turnCount === 4 ? '세계수의 빛 이번 턴' : `세계수의 빛 ${4 - turnCount}턴 후`, turnCount === 4 ? 'warn' : 'bad');
        if (b.counter) add('반격 태세 · 물리 반격', 'warn');
        if (b.charging) add('차지 중', 'warn');
        if (b.forecastType) add(`예고 · ${{ drain: '소울 드레인', darkness: '섀도우 트위스트', doom: '아포칼립스' }[b.forecastType]} ${Math.max(0, b.forecastTurn + 5 - turnCount)}턴 후`, 'warn');
        if (b.pharaohStance) add('저주 영창 · 공격 시 강화', 'warn');
        if (b.pharaohBuffTurns) add('고대의 저주', 'bad', b.pharaohBuffTurns);
        if (b.berserk) add('광폭화', 'warn');
        if (b.form) add(b.form === 'milk' ? '밀크 폼 · 물리' : '초코 폼 · 마법', 'bad');
        if (b.physDefBuff) add('물리 방어 ↑', 'bad');
        if (b.magDefBuff) add('마법 방어 ↑', 'bad');
        if (b.goldDragonScale) add(`비늘 +${b.goldDragonScale * 10}%`, 'bad');
        if (b.stun) add('기절');
        if (b.darkness) add(`암흑 ${b.darkness}/5`);
        if (b.defDownTurns) add('방어 ↓', '', b.defDownTurns);
        if (b.mdefDownTurns) add('마방 ↓', '', b.mdefDownTurns);
        return out;
    }
    const chipHtml = list => list.map(c => `<span class="chip ${c.tone}">${c.label}${c.turns ? ` <b>${c.turns}</b>` : ''}</span>`).join('');
    function resource() {
        const pips = (n, max) => Array.from({ length: max }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('');
        switch (player.charKey) {
            case 'queen': return `<span class="resource">장미 <b class="num">${roseStack}/15</b></span>`;
            case 'rumi': return `<span class="resource">꿈의 결정 ${pips(player.dreamCrystals || 0, 5)}</span>`;
            case 'luna': return `<span class="resource">암흑 ${pips(buffs.enemy.darkness || 0, 5)}</span>`;
            case 'jasmine': return `<span class="resource">앱솔루트 ${pips(buffs.player.absoluteStack || 0, 5)}</span>`;
            case 'zeke': return `<span class="resource">디바인 <b class="num">${buffs.player.divineStack || 0}</b></span>`;
        }
        return '';
    }
    function renderBattle() {
        if (!battle) return;
        if ($('foe-art').dataset.enemy !== currentEnemy.name) mountFoe();
        $('foe-name').innerHTML = `${isBoss(currentEnemy) ? '<span class="tag ult">BOSS</span>' : ''}${currentEnemy.name}`;
        $('foe-chips').innerHTML = chipHtml(enemyChips());
        $('me-name').innerHTML = `${player.name}<span>Lv.${player.level}</span>`;
        $('me-chips').innerHTML = resource() + chipHtml(playerChips());
        shown = snap();
        paintNumbers(shown);
        renderSkills();
        renderBar();
    }
    function renderSkills() {
        const grid = $('skill-grid');
        if (!battle || battle.over) { grid.innerHTML = ''; return; }
        if (buffs.player.stun) {
            grid.innerHTML = '<button class="pass" type="button" id="btn-pass">행동 불가 · 턴 넘기기</button>';
            $('btn-pass').onclick = () => act(null);
            return;
        }
        const keys = gameState.learnedSkills.filter(k => player.skills[k]);
        const ordered = keys.filter(k => !player.skills[k].isUlt).concat(keys.filter(k => player.skills[k].isUlt));
        grid.innerHTML = ordered.map((k, i) => {
            const s = player.skills[k], blocked = skillBlocker(k), ready = isCharged(s);
            return `<button class="sk t-${s.type}${s.isUlt ? ' ult' : ''}${ready ? ' ready' : ''}" type="button" data-skill="${k}" ${blocked ? 'disabled' : ''} aria-keyshortcuts="${i < 9 ? i + 1 : ''}">
                <span class="sk-top"><span class="ico">${Art.typeIcon(s.type)}</span><span class="sk-name">${s.name}</span><span class="sk-cost">${ready ? '발동' : skillCost(s)}</span></span>
                <span class="sk-desc">${s.desc}</span>${blocked ? `<span class="reason">${blocked}</span>` : ready ? '<span class="reason">차지 완료</span>' : ''}</button>`;
        }).join('');
        grid.querySelectorAll('[data-skill]').forEach(button => button.onclick = () => act(button.dataset.skill));
    }
    function appendLog(beat) {
        const div = document.createElement('div');
        div.className = `log-line l-${beat.type}`;
        div.innerHTML = cleanLog(beat.msg);
        $('log-lines').append(div);
        logLines.push(div);
        if (logLines.length > 160) logLines.shift().remove();
        const box = $('log');
        if (box.classList.contains('open')) box.scrollTop = box.scrollHeight;
    }
    function pop(side, text, cls = '', label = '') {
        if (reduced() && skip) return;
        const layer = $(side === 'foe' ? 'pops-foe' : 'pops-me');
        const el = document.createElement('div');
        el.className = `pop ${cls}`;
        el.innerHTML = `${label ? `<small>${label}</small>` : ''}${text}`;
        layer.append(el);
        setTimeout(() => el.remove(), 950);
    }
    function shake(id) {
        const el = $(id);
        el.classList.remove('shake');
        void el.offsetWidth;
        el.classList.add('shake');
    }
    function banner(side, kicker, title) {
        const el = $('banner');
        el.className = `banner${side === 'foe' ? ' foe-side' : ''}`;
        el.innerHTML = `<small>${kicker}</small>${title}`;
        void el.offsetWidth;
        el.classList.add('show');
        clearTimeout(banner.timer);
        banner.timer = setTimeout(() => el.classList.remove('show'), skip ? 200 : 900);
    }
    function act(key) {
        if (playing || !battle || battle.over) return;
        const before = snap();
        const skill = key ? player.skills[key] : null;
        if (!executeTurn(key)) return;
        Sound.sfx('tap');
        if (skill) banner('me', TYPE_NAME[skill.type] + (skill.isUlt ? ' · ULT' : ''), skill.name);
        playBeats(beats.slice(), before);
    }
    async function playBeats(list, before) {
        playing = true;
        skip = reduced();
        $('scr-battle').setAttribute('aria-busy', 'true');
        let prev = before;
        for (const beat of list) {
            appendLog(beat);
            if (beat.type === 'turn' || !beat.p || !beat.e) { await wait(skip ? 0 : 60); continue; }
            if (beat.e.name !== (prev ? prev.e.name : beat.e.name) || $('foe-art').dataset.enemy !== beat.e.name) {
                $('foe-name').textContent = beat.e.name;
                Art.withImage($('foe-art'), `${beat.e.name}.png`, Art.enemyCrest({ name: beat.e.name, ai: beat.e.ai }, battle.dungeon.theme));
                $('foe-art').dataset.enemy = beat.e.name;
                prev = null;
            }
            let moment = false;
            const meta = beat.meta || {};
            if (meta.miss === 'enemy') { pop('foe', 'MISS', 'miss'); Sound.sfx('miss'); moment = true; }
            if (meta.miss === 'player') { pop('me', 'MISS', 'miss'); Sound.sfx('miss'); moment = true; }
            if (prev) {
                const dE = beat.e.hp - prev.e.hp, dP = beat.p.hp - prev.p.hp;
                if (dE < 0) { pop('foe', fmt(-dE), meta.crit ? 'crit' : '', meta.crit ? 'CRITICAL' : ''); shake('foe-art'); Sound.sfx(meta.crit ? 'crit' : 'hit'); moment = true; }
                if (dE > 0) { pop('foe', `+${fmt(dE)}`, 'heal'); moment = true; }
                if (dP < 0) { pop('me', fmt(-dP)); shake('me'); Sound.sfx('hurt'); moment = true; }
                if (dP > 0) { pop('me', `+${fmt(dP)}`, 'heal'); Sound.sfx('heal'); moment = true; }
            }
            const foeSkill = String(beat.msg).replace(/<[^>]+>/g, '').match(new RegExp(`^${currentEnemy ? currentEnemy.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') : '#'}의 (.+?)!?$`));
            if (foeSkill && !/^공격/.test(foeSkill[1])) banner('foe', 'ENEMY', foeSkill[1].replace(/!$/, ''));
            paintNumbers(beat);
            prev = beat;
            await wait(skip ? 0 : moment ? 360 : 120);
        }
        playing = false;
        $('scr-battle').removeAttribute('aria-busy');
        renderBattle();
        if (battle && battle.over) setTimeout(showResult, skip ? 0 : 450);
    }
    function showResult() {
        const r = battle.result;
        const win = r.kind === 'win';
        Sound.sfx(win ? 'win' : 'lose');
        const rows = [];
        if (win) {
            rows.push(`<div class="reward">경험치<b>+${fmt(r.exp)}</b></div>`, `<div class="reward">골드<b>+${fmt(r.gold)} G</b></div>`);
            if (r.levels.length) rows.push(`<div class="reward level">레벨 업<b>Lv.${r.levels[0] - 1} → Lv.${r.levels[r.levels.length - 1]}</b></div>`);
            for (const a of r.artifacts) rows.push(`<div class="reward art">유물 획득 · <b>${a.name}</b>${RARITY[a.rarity] ? ` (${RARITY[a.rarity]})` : ''}<small>${a.desc}</small></div>`);
            if (r.unlock) rows.push(`<div class="reward art">보스 유물 해금 · <b>${r.unlock.name}</b><small>${r.unlock.desc} · 이제 유물 뽑기에 등장합니다.</small></div>`);
            if (r.cleared) rows.push('<div class="reward art"><b>창조신을 쓰러뜨렸습니다!</b><small>마을의 탐험 탭에서 다음 회차로 넘어갈 수 있습니다.</small></div>');
        } else {
            rows.push('<div class="reward">잃은 것<b>없음</b></div>', '<div class="reward">마을에 돌아가면 HP와 MP가 모두 회복됩니다.</div>');
        }
        if (r.levels.length) setTimeout(() => Sound.sfx('level'), 600);
        const { veil, close } = overlay('', `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="result-title">
            <div class="sheet-head${win ? '' : ' lose'}"><p class="result-word" id="result-title">${win ? 'VICTORY' : 'DEFEAT'}</p><p class="result-sub">${r.enemy}${win ? ' 격파' : '에게 패배'} · ${turnCount}턴</p></div>
            <div class="rewards">${rows.join('')}</div>
            <div class="sheet-actions"><button class="btn" type="button" data-go="town">마을로</button><button class="cta" type="button" data-go="again"><span class="cta-text">다시 탐험<small>${lastDungeon.name}</small></span></button></div>
        </div>`, null);
        veil.querySelectorAll('[data-go]').forEach(button => button.onclick = () => {
            close();
            returnToTown();
            if (button.dataset.go === 'again' && availableDungeons().some(d => d.id === lastDungeon.id)) enterDungeon(lastDungeon);
            else enterTown();
        });
    }

    // ---------- Settings ----------
    function openSettings() {

        const inBattle = screen === 'battle' && battle && !battle.over;

        const clears = getClearHistory().length, unlocks = getBossArtifactUnlocks().length;

            <h3 id="set-title">설정</h3>
            <div class="settings-group"><p class="kicker">Sound</p>${toggle('music', '음악')}${toggle('sfx', '효과음')}
                ${canFull ? `<button class="row-toggle" type="button" role="switch" id="set-full" aria-checked="${isFull()}">전체화면<span class="switch-ui"></span></button>` : ''}</div>
            ${inBattle ? '<div class="settings-group"><p class="kicker">Battle</p><div class="settings-actions"><button class="btn wide danger" type="button" id="set-retreat">후퇴하고 마을로</button></div></div>' : ''}
            ${inRun ? `<div class="settings-group"><p class="kicker">Journey</p><div class="settings-actions">
                <button class="btn wide" type="button" id="set-restart">${gameState.clearedCreator ? '다음 회차로' : '처음부터 다시'}</button>
                <button class="btn wide" type="button" id="set-title">타이틀로</button></div></div>` : ''}
            ${screen !== 'battle' ? '<div class="settings-group"><p class="kicker">Data</p><div class="settings-actions"><button class="btn wide danger" type="button" id="set-wipe">완전 초기화</button></div></div>' : ''}
            <p class="meta-line">${getCycleCount() + 1}회차 · 최대 Lv.${getMaxLevel()} · 전설 ${clears}/5 · 보스 유물 ${unlocks}</p>
            <div class="dialog-actions"><button class="cta" type="button" id="set-close">닫기</button></div>
        </div>`, done => done());
        veil.querySelectorAll('[data-sound]').forEach(button => button.onclick = () => {
            const value = button.getAttribute('aria-checked') !== 'true';
            Sound.set(button.dataset.sound, value);
            button.setAttribute('aria-checked', String(value));
            syncSound();
        });
        const on = (id, fn) => { const el = veil.querySelector(`#${id}`); if (el) el.onclick = fn; };
        on('set-full', () => { toggleFull(); setTimeout(() => { const el = veil.querySelector('#set-full'); if (el) el.setAttribute('aria-checked', String(isFull())); }, 300); });
        on('set-close', close);
        on('set-retreat', async () => {
            close();
            if (!await ask({ title: '후퇴할까요?', body: '이번 전투는 패배로 끝나고 마을로 돌아갑니다. 잃는 것은 없습니다.', ok: '후퇴' })) return;
            if (playing || !battle || battle.over) return;
            beats = [];
            log('전투에서 물러났습니다.', 'info');
            finishBattle('lose');
            playBeats(beats.slice(), snap());
        });
        on('set-restart', async () => {
            close();
            if (gameState.clearedCreator) return nextCycle();
            if (!await ask({ title: '처음부터 다시 할까요?', body: `캐릭터·골드·보유 유물이 초기화됩니다.\n${getCycleCount() + 1}회차와 해금한 유물은 유지됩니다.`, ok: '다시 시작' })) return;
            pickKey = player.charKey || 'luna';
            openSelect({ nextCycle: false });
        });
        on('set-title', () => { close(); saveGame(); renderTitle(); setScreen('title'); });
        on('set-wipe', async () => {
            close();
            if (!await ask({ title: '모든 기록을 지울까요?', body: '저장된 여정, 회차, 전설 기록, 보스 유물 해금이 모두 사라집니다.\n되돌릴 수 없습니다.', ok: '완전 초기화', danger: true })) return;
            wipeEverything();
            player = {};
            gameState = defaultGameState();
            battle = null;
            renderTitle();
            setScreen('title');
            toast('모든 기록을 지웠습니다.');
        });
    }

    // ---------- Wiring ----------
    function init() {
        $('btn-sound').onclick = () => {
            const on = !(Sound.get('music') || Sound.get('sfx'));
            Sound.set('music', on);
            Sound.set('sfx', on);
            syncSound();
        };
        $('btn-full').onclick = toggleFull;
        $('btn-menu').onclick = openSettings;
        $('btn-new').onclick = () => startNew(true);
        $('btn-pick').onclick = () => {
            beginNewRun(pendingRun || {});
            pendingRun = null;
            selectChar(pickKey);
            tab = 'explore';
            enterTown();
        };
        document.querySelectorAll('#tabbar [data-tab]').forEach(button => button.onclick = () => {
            tab = button.dataset.tab;
            renderTown();
            $('town-scroll').scrollTop = 0;
        });
        $('desc-toggle').onclick = () => {
            const on = !$('skills').classList.contains('show-desc');
            $('skills').classList.toggle('show-desc', on);
            $('desc-toggle').setAttribute('aria-pressed', String(on));
            $('desc-toggle').textContent = on ? '설명 숨기기' : '설명 보기';
        };
        $('log-toggle').onclick = () => {
            const box = $('log');
            const open = !box.classList.contains('open');
            box.classList.toggle('open', open);
            $('log-toggle').setAttribute('aria-expanded', String(open));
            $('log-toggle').innerHTML = icon(open ? 'close' : 'log');
            if (open) box.scrollTop = box.scrollHeight;
        };
        // 재생 중 화면을 누르면 이번 턴 연출을 건너뛴다.
        $('stage').addEventListener('click', () => { if (playing) skip = true; });
        $('me').addEventListener('click', () => { if (playing) skip = true; });
        document.addEventListener('keydown', event => {
            if (app.dataset.screen !== 'battle' || document.querySelector('.veil')) return;
            if (playing && (event.key === ' ' || event.key === 'Enter')) { skip = true; event.preventDefault(); return; }
            const n = Number(event.key);
            if (n >= 1 && n <= 9) {
                const button = document.querySelectorAll('#skill-grid [data-skill], #skill-grid .pass')[n - 1];
                if (button && !button.disabled) button.click();
            }
        });
        document.addEventListener('fullscreenchange', syncFull);
        document.addEventListener('webkitfullscreenchange', syncFull);
        syncFull();
        syncSound();
        renderTitle();
        setScreen('title');
    }
    return { init, toast };
})();

UI.init();
</script>
</body>
</html>
