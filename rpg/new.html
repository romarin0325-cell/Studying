                  log(`<b style="color:#ff5252">아포칼립스! (종말의 일격)</b>`, 'dmg');
                  return applyEnemyDamage(currentEnemy.atk * 5.0, 'phy');
             }
         }

         if(turnCount === 2 || turnCount === 9 || turnCount === 16) {
             let types = ['drain', 'darkness', 'doom'];
             let type = types[Math.floor(Math.random() * types.length)];
             let names = {'drain':'고갈의 예고', 'darkness':'어둠의 예고', 'doom':'종말의 예고'};
             let descs = {'drain':'(5턴 뒤 소울 드레인)', 'darkness':'(5턴 뒤 섀도우 트위스트)', 'doom':'(5턴 뒤 아포칼립스)'};

             buffs.enemy.forecastType = type;
             buffs.enemy.forecastTurn = turnCount;
             log(`<b style="color:#ffd700">[${names[type]}] ${descs[type]}</b>`, 'info');
             return true;
         }

         if(Math.random() < 0.3) {
             log(`${currentEnemy.name}의 사일런트!`, 'mag');
             return applyEnemyDamage(currentEnemy.matk * 2.5, 'mag');
         }
         log(`${currentEnemy.name}의 공격`, 'phy');
         return applyEnemyDamage(currentEnemy.atk, 'phy');
    }

    if(currentEnemy.ai === 'witch') {
        let isEnraged = (currentEnemy.hp < currentEnemy.maxHp * 0.25);
        let multiplier = 1.0;
        if(isEnraged) {
            multiplier = 2.0;
            log(`<b style="color:#29b6f6">마녀가 생명의 위협을 느끼고 폭주합니다! (공격력 2배)</b>`, 'dmg');
        }

        let rand = Math.random();
        if(rand < 0.1) {
            log(`<b style="color:#4fc3f7">절대영도! (모든 것을 얼려버립니다!)</b>`, 'mag');
            return applyEnemyDamage(currentEnemy.matk * 5.0 * multiplier, 'mag');
        } else if(rand < 0.4) {
            log(`아이스 빔!`, 'mag');
            return applyEnemyDamage(currentEnemy.matk * 2.0 * multiplier, 'mag');
        } else {
            log(`마녀의 냉기 공격`, 'phy');
            return applyEnemyDamage(currentEnemy.atk * multiplier, 'phy');
        }
    }

    if(currentEnemy.ai === 'goddess') {
        if(turnCount <= 2) {
            if(turnCount === 1) {
                log(`<b style="color:#ff5252">[심판의 형태] 여신이 거대한 힘을 모으고 있습니다...</b>`, 'info');
                return true;
            }
            if(turnCount === 2) {
                log(`<b style="color:#ff5252; font-size:1.1rem;">저지먼트!!</b>`, 'dmg');
                return applyEnemyDamage(currentEnemy.matk * 3.5, 'mag');
            }
        }

        if(currentEnemy.hp <= currentEnemy.maxHp * 0.5) {
            if(buffs.player.goddessBlessing) {
                delete buffs.player.goddessBlessing;
                log(`<b style="color:#e040fb">[검의 형태] "자애는 끝났다."</b>`, 'dmg');
                log(`플레이어의 축복이 해제되었습니다!`, 'info');
            }

            if(buffs.enemy.charging) {
                delete buffs.enemy.charging;
                log(`<b style="color:#ff5252">디바인 블레이드! (차지 발동)</b>`, 'dmg');
                return applyEnemyDamage(currentEnemy.atk * 4.5, 'phy');
            }

            let rand = Math.random();
            if(rand < 0.2) {
                log(`여신이 검을 높이 듭니다... (차지)`, 'info');
                buffs.enemy.charging = true;
                return true;
            } else if(rand < 0.4) {
                log(`홀리 레이!`, 'mag');
                return applyEnemyDamage(currentEnemy.matk * 2.0, 'mag');
            } else {
                log(`여신의 검격!`, 'dmg');
                return applyEnemyDamage(currentEnemy.atk * 1.0, 'phy');
            }
        }

        if(!buffs.player.goddessBlessing) {
            buffs.player.goddessBlessing = true;
            log(`<b style="color:#69f0ae">[자애의 형태] "너의 힘을 보여보아라."</b>`, 'heal');
            log(`플레이어 공격력/마법공격력 50% 증가!`, 'heal');
        }

        if(turnCount >= 7) {
            log(`<b style="color:#ffd700">더 홀리! (광역 심판)</b>`, 'holy');
            player.hp -= 550;
            log(`<span class="dmg">550</span>의 절대 피해를 입었습니다!`, 'dmg');
            return player.hp > 0;
        }

        log(`여신의 자애로운 평타`, 'info');
        return applyEnemyDamage(currentEnemy.atk * 1.0, 'phy');
    }

    if(currentEnemy.ai === 'tree' && turnCount === 4) {
        log(`세계수의 빛! 모두 완전 회복.`, 'heal');
        player.hp = player.maxHp;
        currentEnemy.hp = currentEnemy.maxHp;
        return true;
    }
    if(currentEnemy.ai === 'ghost_king' && turnCount % 5 === 0) {
        log(`고스트 킹 반격 태세!`, 'info');
        buffs.enemy.counter = true;
        buffs.enemy.counterTurn = turnCount;
        return true;
    }
    if((currentEnemy.ai === 'mawang' && turnCount % 5 === 0) || (currentEnemy.ai === 'mashin' && turnCount % 7 === 0)) {
        log(`${currentEnemy.name}의 데스 핸드!`, 'dmg');
        return applyEnemyDamage(currentEnemy.atk * 3.5, 'phy');
    }

    // Iris AI (Hidden Boss) - Refactored
    if(currentEnemy.ai === 'iris_light' || currentEnemy.ai === 'iris_curse') {
        // 1. Special Patterns
        // 22, 44, 66 -> Apocalypse
        if([22, 44, 66].includes(turnCount)) {
            log(`<b style="color:#ff5252">아포칼립스! (종말의 일격)</b>`, 'dmg');
            return applyEnemyDamage(currentEnemy.atk * 5.0, 'phy');
        }

        // 10n + 1 (11, 21, 31...) -> Soul Drain
        if((turnCount - 1) % 10 === 0 && turnCount > 1) {
             log(`<b style="color:#b39ddb">소울 드레인! (플레이어의 마나가 사라집니다)</b>`, 'mag');
             player.mp = 0;
             return true;
        }

        // 10n - 2 (8, 18, 28...) -> Shadow Twist
        if((turnCount + 2) % 10 === 0) {
            let mult = 1.5;
            let msg = "섀도우 트위스트!";
            if(buffs.enemy.tookDamageThisTurn) {
                mult = 4.5;
                msg = "섀도우 트위스트! (카운터 폭발)";
            }
            log(`<b style="color:#b39ddb">${msg}</b>`, 'mag');
            return applyEnemyDamage(currentEnemy.matk * mult, 'mag');
        }

        // 2. Form Change (5n)
        if(turnCount % 5 === 0) {
             let otherId = currentEnemy.ai === 'iris_light' ? 'iris_curse' : 'iris_light';
             let otherHp = gameState.hiddenBossReserve ? gameState.hiddenBossReserve[otherId] : 0;

             if(otherHp > 0 && !gameState.hiddenBossDead) {
                 log(`<b style="color:#ffd700">[폼 체인지] 아이리스가 모습을 바꿉니다.</b>`, 'info');
                 swapBoss();
                 return true;
             } else {
                 log(`[폼 체인지 실패] 다른 인격이 소멸하여 변신할 수 없습니다.`, 'info');
             }
        }

        // 3. Basic Logic
        let rand = Math.random();

        if(currentEnemy.ai === 'iris_light') {
            if(rand < 0.3) {
                log(`<b style="color:#fff59d">홀리 레이!</b>`, 'mag');
                return applyEnemyDamage(currentEnemy.matk * 2.0, 'mag');
            } else if(rand < 0.4) {
                log(`<b style="color:#ff5252">저지먼트!</b>`, 'mag');
                return applyEnemyDamage(currentEnemy.matk * 3.5, 'mag');
            } else {
                log(`${currentEnemy.name}의 공격`, 'phy');
                return applyEnemyDamage(currentEnemy.atk, 'phy');
            }
        } else { // iris_curse
            if(rand < 0.3) {
                let pRatio = player.maxHp ? (player.hp / player.maxHp) : 0;
                let mult = 1.5;
                let msg = "균형의 천칭";
                if(pRatio >= 0.8) {
                    mult = 5.0;
                    msg = "균형의 천칭 (심판)";
                    log("플레이어 체력이 80% 이상이어 강력한 피해를 입습니다!", 'info');
                }
                log(`<b style="color:#b39ddb">${msg}!</b>`, 'mag');
                return applyEnemyDamage(currentEnemy.matk * mult, 'mag');
            } else if(rand < 0.4) {
                 log(`<b style="color:#5d4037">데스 핸드!</b>`, 'dmg');
                 return applyEnemyDamage(currentEnemy.atk * 3.5, 'phy');
            } else {
                log(`${currentEnemy.name}의 공격`, 'phy');
                return applyEnemyDamage(currentEnemy.atk, 'phy');
            }
        }
    }

    if(Math.random() < 0.3 && currentEnemy.ai !== 'charge') {
        let val = currentEnemy.skillType === 'phy' ? currentEnemy.atk : currentEnemy.matk;
        log(`${currentEnemy.name}의 ${currentEnemy.skillName}!`, 'dmg');
        return applyEnemyDamage(val * currentEnemy.skillPower, currentEnemy.skillType);
    } else {
        log(`${currentEnemy.name}의 공격!`, 'dmg');
        return applyEnemyDamage(currentEnemy.atk, 'phy');
    }
}

function applyEnemyDamage(rawDmg, type) {
    let eva = player.baseEva + (buffs.player.eva || 0);
    if(Math.random() < eva) {
        log("적의 공격을 회피했습니다!", 'info', { miss: 'player' });
        if(player.skills['dancing']) buffs.player.dodgeCount = (buffs.player.dodgeCount || 0) + 1;
        return true;
    }

    let def = type === 'mag' ? player.mdef : player.def;

    if(buffs.player.defZero) def = 0;

    let dmg = rawDmg * (100 / (100 + def));

    if(hasArtifact('high_risk_dmg')) dmg *= 1.3;
    if(hasArtifact('high_risk_dmg_ex')) dmg *= 1.5;

    if(buffs.player.nullMag && type === 'mag') { log("매직 가드로 마법 공격을 무효화했습니다!", 'info'); dmg = 0; }
    if(buffs.player.nullPhy && type === 'phy') { log("배리어로 물리 공격을 무효화했습니다!", 'info'); dmg = 0; }
    if(buffs.player.guard_70) dmg *= 0.3;
    if(buffs.player.guard) dmg *= 0.3;
    if(buffs.player.dmgRed50) dmg *= 0.5;
    if(buffs.player.instinctTurns) dmg *= 1.2;

    if(buffs.player.sageBarrier) {
        let reduction = buffs.player.sageForm === 'star' ? 0.3 : 0.5;
        dmg *= reduction;
    }

    dmg = Math.floor(dmg);
    dmg = Math.max(1, dmg);

    if(buffs.player.divineTurns > 0 && dmg > 0) {
        buffs.player.divineStack = (buffs.player.divineStack || 0) + 1;
    }

    if(buffs.player.immortal && player.hp - dmg <= 0) {
        player.hp = 1;
        log(`언다잉 발동! 죽음을 거부했습니다!`, 'fire');
        if(player.name === '지크') {
            buffs.player.undyingPowerTurns = 2;
        }
    } else {
        if(player.hp - dmg <= 0 && !buffs.player.revived) {
             if(hasArtifact('guardian_angel_legend')) {
                buffs.player.revived = true;
                player.hp = player.maxHp;
                log("<b>[전설] 수호천사의 깃털이 빛나며 완전하게 부활했습니다! (HP 100% 회복)</b>", 'heal');
             } else if(hasArtifact('guardian_angel')) {
                buffs.player.revived = true;
                player.hp = Math.floor(player.maxHp * 0.5);
                log("<b>수호천사의 깃털이 부서지며 부활했습니다! (HP 50% 회복)</b>", 'heal');
             } else {
                player.hp -= dmg;
                log(`<span class="dmg">${dmg}</span> 피해를 입었습니다.`, 'dmg');
             }
        } else {
            player.hp -= dmg;
            log(`<span class="dmg">${dmg}</span> 피해를 입었습니다.`, 'dmg');
        }
    }

    if(buffs.player.sanctuaryTurns > 0) {
        let refDmg = Math.floor(player.matk * 1.5 * (100 / (100 + currentEnemy.mdef)));
        refDmg = Math.max(1, refDmg);
        currentEnemy.hp -= refDmg;
        log(`생츄어리 반사! 적에게 ${refDmg} 피해.`, 'dmg');
    }

    if(hasArtifact('reflect_phy') && type === 'phy') {
        let thornDmg = Math.floor(dmg * 0.1);
        if(thornDmg > 0) {
            currentEnemy.hp -= thornDmg;
            log(`유물 반사! ${thornDmg} 피해.`, 'dmg');
        }
    }

    return player.hp > 0;
}

function endTurnPhase() {
    // MP Regen Logic Moved Here (Before Buff Expiry)
    let regen = player.mpRegen;
    if(buffs.player.medi) regen += 30;
    if(buffs.player.manaDress) regen += 10;
    if(hasArtifact('mana_engine')) regen += 10;

    player.mp = Math.min(player.maxMp, player.mp + regen);

    if(player.charKey === 'queen' && roseStack > 0 && currentEnemy.hp > 0) {
        let roseDmg = Math.floor((player.atk + player.matk) * 0.1 * roseStack);
        let defVal = currentEnemy.def;
        let reduction = 100 / (100 + defVal);
        roseDmg = Math.floor(roseDmg * reduction);
        if(buffs.player.gardenTurns) roseDmg *= 2;
        roseDmg = Math.max(1, roseDmg);

        currentEnemy.hp -= roseDmg;
        log(`[패시브] 장미의 가시가 적을 찌릅니다! <span class="rose">${roseDmg}</span> 피해`, 'rose');
    }

    delete buffs.player.guard;
    delete buffs.player.guard_70;
    delete buffs.player.nullMag;
    delete buffs.player.nullPhy;
    delete buffs.player.castleDef100;
    delete buffs.player.stun;
    delete buffs.player.immortal;
    delete buffs.player.dmgRed50;
    delete buffs.player.sageBarrier;

    if(buffs.player.defZero) delete buffs.player.defZero;
    if(buffs.player.defZeroNext) { buffs.player.defZero = true; delete buffs.player.defZeroNext; }

    if(buffs.player.nextTurnStun) {
        buffs.player.stun = true;
        delete buffs.player.nextTurnStun;
    }

    if(buffs.player.instinctTurns) { buffs.player.instinctTurns--; if(buffs.player.instinctTurns<=0) { delete buffs.player.instinctVal; } }
    if(buffs.player.adrenalineTurns) buffs.player.adrenalineTurns--;
    if(buffs.player.veilTurns) { buffs.player.veilTurns--; if(buffs.player.veilTurns<=0) { delete buffs.player.veilVal; } }
    if(buffs.player.mediTurns) { buffs.player.mediTurns--; if(buffs.player.mediTurns<=0) { delete buffs.player.medi; } }
    if(buffs.player.manaDressTurns) { buffs.player.manaDressTurns--; if(buffs.player.manaDressTurns<=0) { delete buffs.player.manaDress; delete buffs.player.manaDressVal; } }

    // Pharaoh's Curse Logic: Expire if not triggered next turn
    if(buffs.enemy.pharaohStance && turnCount > buffs.enemy.pharaohStanceTurn) {
        delete buffs.enemy.pharaohStance;
        log("파라오의 저주가 빗나가며 소멸했습니다.", 'info');
    }

    if(buffs.player.divineTurns) buffs.player.divineTurns--;
    if(buffs.player.sanctuaryTurns) buffs.player.sanctuaryTurns--;
    if(buffs.player.goddessTurns) buffs.player.goddessTurns--;
    if(buffs.player.demonEyeTurns) {
        buffs.player.demonEyeTurns--;
        if(buffs.player.demonEyeTurns <= 0) log("마안의 효과가 끝났습니다.", 'info');
    }
    if(buffs.player.demonEyeLegendTurns) {
        buffs.player.demonEyeLegendTurns--;
        if(buffs.player.demonEyeLegendTurns <= 0) log("진: 마안의 효과가 끝났습니다.", 'info');
    }

    // 대현자 형태 및 버프 턴 감소
    if(buffs.player.formTurns) {
        buffs.player.formTurns--;
        if(buffs.player.formTurns <= 0) {
            delete buffs.player.sageForm;
            delete buffs.player.formTurns;
            log("형태 변환의 힘이 사라졌습니다.", 'info');
        }
    }
    if(buffs.player.milkshakeTurns) {
        buffs.player.milkshakeTurns--;
        if(buffs.player.milkshakeTurns <= 0) log("밀크쉐이크 버프가 사라집니다.", 'info');
    }
    // 턴 종료시 스탯 재계산 (형태/버프 만료 반영)
    recalcAllStats();

    if(buffs.player.critBuffTurns) { buffs.player.critBuffTurns--; if(buffs.player.critBuffTurns<=0) delete buffs.player.critBuff; }
    if(buffs.player.gardenTurns) buffs.player.gardenTurns--;
    if(buffs.player.royalBloomTurns) {
        buffs.player.royalBloomTurns--;
        if(buffs.player.royalBloomTurns <= 0) {
            roseStack = 0;
            log("Royal Bloom 효과가 끝나며 장미가 시들었습니다...", 'rose');
        }
    }

    if(buffs.player.enchantTurns) buffs.player.enchantTurns--;
    if(buffs.player.undyingPowerTurns) { buffs.player.undyingPowerTurns--; if(buffs.player.undyingPowerTurns<=0) log("언다잉 힘이 사라집니다.", 'info'); }

    if(buffs.enemy.defDownTurns) buffs.enemy.defDownTurns--;
    if(buffs.enemy.mdefDownTurns) buffs.enemy.mdefDownTurns--;
    if(buffs.enemy.tookDamageThisTurn) delete buffs.enemy.tookDamageThisTurn;

    let totalEva = 0;
    if(buffs.player.instinctTurns > 0) totalEva += (buffs.player.instinctVal || 0);
    if(buffs.player.veilTurns > 0) totalEva += (buffs.player.veilVal || 0);
    if(buffs.player.manaDressTurns > 0) totalEva += (buffs.player.manaDressVal || 0);
    buffs.player.eva = totalEva;

    if(buffs.player.nextEva) { buffs.player.eva += buffs.player.nextEva; delete buffs.player.nextEva; }

    turnCount++;
}

/* =========================================
   3. 진행 흐름 (Run flow)
   전투 계산은 위 함수들이 그대로 담당하고, 여기서는 한 턴의 순서, 승패, 보상, 마을 복귀와 저장을 정한다.
   ========================================= */
const SAVE_KEY = 'turnRpgSaveData';
const META_KEYS = ['turnRpgCycle', 'turnRpgClears', 'turnRpgBossDrops', 'turnRpgUsedEvents'];
const ARTIFACT_LEVELS = [5, 10, 15, 20, 25, 30];
const MANA_COSTS = [2000, 3000, 4000];
// Index 0 is each character's base regen; the old shop's first purchase repeated it and changed nothing.
const MANA_REGEN = { luna: [10, 13, 16, 20], zeke: [10, 13, 16, 20], jasmine: [15, 20, 25, 30], queen: [12, 14, 16, 20], rumi: [10, 15, 20, 25] };
const BOSS_AIS = ['ghost_king', 'mawang', 'tree', 'mashin', 'witch', 'goddess', 'pudding_princess', 'artificial_god', 'gold_dragon', 'pharaoh', 'time_ruler', 'iris_light', 'iris_curse'];

const DUNGEONS = [
    { id: 'cave', name: '속삭이는 동굴', tier: 1, lv: [1, 3], theme: 'cave' },
    { id: 'forest', name: '검은 안개 숲', tier: 2, lv: [4, 7], theme: 'forest' },
    { id: 'castle', name: '잊혀진 고성', tier: 3, lv: [8, 10], theme: 'castle' },
    { id: 'rift', name: '혼돈의 틈', tier: 4, lv: [11, 16], theme: 'rift' },
    { id: 'glacier', name: '영겁의 빙하', tier: 5, lv: [17, 20], theme: 'glacier' },
    { id: 'heaven', name: '천상의 계단', tier: 6, lv: [21, 25], theme: 'heaven' }
];
const EVENT_DUNGEONS = {
    dessert: { id: 'dessert', name: '디저트 킹덤', tier: 'dessert', theme: 'dessert', event: true },
    magic: { id: 'magic', name: '마도 제국', tier: 'magic', theme: 'magic', event: true },
    dragon: { id: 'dragon', name: '용의 둥지', tier: 'dragon', theme: 'dragon', event: true },
    ruins: { id: 'ruins', name: '고대 유적', tier: 'ruins', theme: 'ruins', event: true },
    time: { id: 'time', name: '시간의 도서관', tier: 'time', theme: 'time', event: true }
};
const HIDDEN_DUNGEON = { id: 'hidden', name: '빛과 저주의 회랑', tier: 'hidden', theme: 'hidden', hidden: true };

let battle = null;   // { dungeon, over, result }
let beats = [];      // 이번 턴의 기록. 각 줄은 그 순간의 HP/MP를 함께 담아 화면이 순서대로 재생한다.

const clone = value => JSON.parse(JSON.stringify(value));
const defaultGameState = () => ({ gold: 10000, learnedSkills: [], manaLevel: 0, equipWeapon: 0, equipArmor: 0, currentEventDungeon: null, clearedCreator: false });

function log(msg, type = 'info', meta = null) {
    beats.push({
        msg, type, meta,
        p: player && player.name ? { hp: player.hp, mp: player.mp, maxHp: player.maxHp, maxMp: player.maxMp } : null,
        e: currentEnemy ? { hp: currentEnemy.hp, maxHp: currentEnemy.maxHp, name: currentEnemy.name, ai: currentEnemy.ai } : null
    });
}

function isBoss(enemy) { return !!enemy && BOSS_AIS.includes(enemy.ai); }
function dungeonRoster(dungeon) {
    if (dungeon.tier === 'hidden') return ENEMIES.filter(e => e.tier === 'hidden');
    return ENEMIES.filter(e => e.tier === dungeon.tier);
}
function availableDungeons() {
    const list = DUNGEONS.slice();
    if (gameState.currentEventDungeon && EVENT_DUNGEONS[gameState.currentEventDungeon]) list.push(EVENT_DUNGEONS[gameState.currentEventDungeon]);
    if (checkHiddenUnlock()) list.push(HIDDEN_DUNGEON);
    return list;
}
function expToNext(level = player.level) {
    const baseReq = 100 * level * (1 + level * 0.1);
    return level >= 20 ? baseReq * 3 : baseReq;
}
function nextArtifactLevel() {
    return ARTIFACT_LEVELS.find(lv => lv > player.level && lv <= getMaxLevel()) || null;
}

// ---------- New run ----------
function beginNewRun({ nextCycle = false } = {}) {
    if (nextCycle) incrementCycle();
    gameState = defaultGameState();
    roseStack = 0;
    buffs = { player: {}, enemy: {} };
    player = {};
    battle = null;
    currentEnemy = null;
    setupEventDungeon();
    initArtifactsWithNGPlus();
    localStorage.removeItem(SAVE_KEY);
}

function selectChar(charKey) {
    const data = CHAR_DATA[charKey];
    if (!data) return false;
    player = clone(data);
    player.charKey = charKey;
    player.baseStats = { hp: data.hp, mp: data.mp, atk: data.atk, matk: data.matk, def: data.def, mdef: data.mdef };
    player.artifacts = [];
    player.level = 1;
    player.exp = 0;
    if (charKey === 'rumi') player.dreamCrystals = 5;

    gameState.gold = 10000;
    gameState.learnedSkills = ['basic'];
    if (charKey === 'queen') gameState.learnedSkills.push('thornwhip', 'roseseed');
    if (charKey === 'zeke') gameState.learnedSkills.push('heavy');
    if (charKey === 'rumi') gameState.learnedSkills.push('pangpang', 'starbarrier');
    gameState.manaLevel = 0;
    gameState.equipWeapon = 0;
    gameState.equipArmor = 0;
    for (const k in player.skills) {
        if (player.skills[k].price === 0 && !gameState.learnedSkills.includes(k)) gameState.learnedSkills.push(k);
    }
    recalcAllStats();
    player.hp = player.maxHp;
    player.mp = player.maxMp;
    saveGame();
    return true;
}

// ---------- Battle ----------
function startBattle(dungeon) {
    if (!player || !player.name) return false;
    const pool = dungeon.tier === 'hidden' ? [ENEMIES.find(e => e.ai === 'iris_light')] : ENEMIES.filter(e => e.tier === dungeon.tier);
    if (!pool.length) return false;
    const mobData = pool[Math.floor(Math.random() * pool.length)];
    beats = [];
    battle = { dungeon, over: false, result: null };
    currentEnemy = clone(mobData);

    // 다회차 스탯 보정 (최대 6회차/5사이클 까지만 증가)
    const cycle = getCycleCount();
    const mult = 1 + Math.min(cycle, 5) * 0.1;
    if (cycle > 0) {
        for (const stat of ['hp', 'atk', 'matk', 'def', 'mdef']) currentEnemy[stat] = Math.floor(currentEnemy[stat] * mult);
    }
    currentEnemy.maxHp = currentEnemy.hp || 1;

    // 히든 보스: 두 인격의 체력과 보정된 능력치를 따로 보관한다.
    if (mobData.tier === 'hidden') {
        const scaled = ai => {
            const base = ENEMIES.find(e => e.ai === ai);
            const s = { atk: base.atk, matk: base.matk, def: base.def, mdef: base.mdef };
            if (cycle > 0) for (const k in s) s[k] = Math.floor(s[k] * mult);
            return s;
        };
        gameState.hiddenBossReserve = {
            maxHp: currentEnemy.maxHp,
            iris_light: currentEnemy.maxHp,
            iris_curse: currentEnemy.maxHp,
            scaledStats: { light: scaled('iris_light'), curse: scaled('iris_curse') }
        };
        gameState.hiddenBossDead = false;
    }

    let startMp = player.maxMp ? Math.floor(player.maxMp / 2) : 0;
    if (hasArtifact('start_mp')) startMp += 30;
    if (hasArtifact('blue_moon')) startMp += 100;
    player.mp = Math.min(player.maxMp, startMp);
    turnCount = 1;
    buffs = { player: { castleStack: 0, dodgeCount: 0, absoluteStack: 0, divineStack: 0, moonUltStack: 0, chargingMilkyway: false, milkshakeTurns: 0 }, enemy: {} };
    roseStack = 0;

    log(`<b>${currentEnemy.name}</b>(이)가 나타났다!`, 'info');
    if (mobData.tier === 'hidden') log('빛과 저주의 회랑에 입장했습니다. (페이즈 변환 보스)', 'holy');
    if (hasArtifact('demon_eye')) {
        buffs.player.demonEyeTurns = 5;
        log('[마안] 발동! 5턴간 공격력/마법공격력 대폭 증가.', 'rose');
    }
    if (hasArtifact('demon_eye_legend')) {
        buffs.player.demonEyeLegendTurns = 5;
        log('[진: 마안] 발동! 5턴간 공격력/마법공격력 초월적 증가.', 'rose');
    }
    if (player.charKey === 'rumi') {
        player.dreamCrystals = 5;
        delete buffs.player.sageForm;
    }
    if (player.charKey === 'queen') {
        if (hasArtifact('royal_crown')) { roseStack = 5; log('로열 크라운의 효과로 장미 5송이를 가지고 시작합니다!', 'rose'); }
        if (hasArtifact('royal_crown_legend')) { roseStack = 10; log('전설의 로열 크라운 효과로 장미 10송이를 가지고 시작합니다!', 'rose'); }
    }
    recalcAllStats();
    return true;
}

function isCharged(skill) {
    return (skill.effect === 'charge_divine' && buffs.player.charging) || (skill.effect === 'charge_milkyway' && buffs.player.chargingMilkyway);
}
// Why a skill cannot be used right now ('' when it can). The battle screen disables buttons with this reason.
function skillBlocker(key) {
    const skill = player.skills[key];
    if (!skill) return '없음';
    if (!isCharged(skill) && player.mp < skill.cost) return 'MP 부족';
    if (skill.effect.startsWith('form_change_') && (player.dreamCrystals || 0) < 1) return '결정 부족';
    return '';
}

const SUPPORT_EFFECTS = ['perfect_eva', 'guard_70', 'null_mag', 'null_phy', 'evasion_50', 'eva_buff', 'crit_buff', 'passive_boost', 'sage_barrier', 'milkshake_heal', 'sage_moon_veil', 'sage_meteor', 'royal_bloom', 'reset_buff'];
const SUPPORT_THEN_ATTACK = ['perfect_eva', 'rose_2_self_stun', 'evasion_50', 'eva_buff', 'crit_buff', 'form_change_sun', 'sage_dream_ult', 'sage_moon_veil', 'sage_meteor'];

function performPlayerAction(skill) {
    // 대현자 형태 변환: 결정과 MP를 모두 확인한 뒤에만 결정을 쓴다.
    if (skill.effect.startsWith('form_change_')) player.dreamCrystals--;

    if (skill.effect === 'charge_divine' || skill.effect === 'charge_milkyway') {
        const flag = skill.effect === 'charge_divine' ? 'charging' : 'chargingMilkyway';
        if (!buffs.player[flag]) {
            player.mp -= skill.cost;
            buffs.player[flag] = true;
            buffs.player.guard = true;
            if (skill.effect === 'charge_divine') log(`${skill.name}! 힘을 모으며 방어 태세를 취합니다.`, 'holy');
            else log(`${skill.name}! 별들의 힘을 모으기 시작합니다. (차지/방어태세)`, 'star');
            return;
        }
        delete buffs.player[flag];
        delete buffs.player.guard;
    } else {
        player.mp -= skill.cost;
    }

    if (skill.effect === 'milkshake_heal') {
        const healAmount = Math.floor(player.maxHp * 0.3);
        player.hp = Math.min(player.maxHp, player.hp + healAmount);
        log(`스타파우더 밀크쉐이크! HP <span class="heal">${healAmount}</span> 회복.`, 'heal');
    }

    let playerDefending = false;
    if (skill.type === 'sup' || SUPPORT_EFFECTS.includes(skill.effect) || skill.effect.startsWith('form_change_')) {
        applyPlayerSupport(skill);
        if (skill.effect === 'stun_rose_3') {
            if (roseStack >= 3) {
                roseStack -= 3;
                buffs.enemy.stun = true;
                log('장미 3개를 소모하여 적을 압도합니다!', 'rose');
            } else {
                log('장미 스택이 부족하여 발동 실패!', 'info');
            }
        }
        playerDefending = true;
    }

    if (buffs.enemy.counter && turnCount > buffs.enemy.counterTurn + 1) delete buffs.enemy.counter;

    if (!playerDefending || SUPPORT_THEN_ATTACK.includes(skill.effect)) {
        if (skill.effect === 'sage_dream_ult' || !skill.effect.startsWith('form_change_')) playerAttack(skill);
    }
}

// 적이 쓰러졌을 때의 부활·교대. 반사·가시·장미 피해로 쓰러져도 같은 규칙을 따른다.
function reviveOrSwapEnemy() {
    if (currentEnemy.ai === 'witch' && !currentEnemy.hasRevived) {
        currentEnemy.hp = 3000;
        currentEnemy.hasRevived = true;
        log('혹한의 마녀가 얼음 속에서 되살아납니다! (HP 3000 회복)', 'star');
        return;
    }
    if (currentEnemy.ai === 'gold_dragon' && !currentEnemy.hasRevived) {
        currentEnemy.hp = 3000;
        currentEnemy.hasRevived = true;
        log('골드 드래곤이 황금의 힘으로 부활합니다! (HP 3000 회복)', 'holy');
        return;
    }
    if (currentEnemy.tier === 'hidden' && !gameState.hiddenBossDead) {
        const otherId = currentEnemy.ai === 'iris_light' ? 'iris_curse' : 'iris_light';
        if (gameState.hiddenBossReserve[otherId] > 0) {
            gameState.hiddenBossDead = true;
            currentEnemy.hp = 0;
            log(`${currentEnemy.name}이(가) 쓰러졌습니다... 하지만 아직 끝나지 않았습니다!`, 'dmg');
            const nextBoss = ENEMIES.find(e => e.ai === otherId);
            const savedHp = gameState.hiddenBossReserve[otherId];
            currentEnemy = clone(nextBoss);
            currentEnemy.hp = savedHp;
            currentEnemy.maxHp = gameState.hiddenBossReserve.maxHp;
            const s = gameState.hiddenBossReserve.scaledStats[otherId === 'iris_light' ? 'light' : 'curse'];
            currentEnemy.atk = s.atk * 2; currentEnemy.matk = s.matk * 2;
            currentEnemy.def = s.def; currentEnemy.mdef = s.mdef;
            buffs.enemy.berserk = true;
            log(`${currentEnemy.name}이(가) 난입하여 광폭화합니다!`, 'dmg');
        }
    }
}

// 적의 공격 밖(반동·반격·절대 피해)으로 쓰러질 때도 언다잉과 수호천사가 같은 순서로 작동한다.
function savePlayerFromDeath() {
    if (buffs.player.immortal) {
        player.hp = 1;
        log('언다잉 발동! 죽음을 거부했습니다!', 'fire');
        if (player.charKey === 'zeke') buffs.player.undyingPowerTurns = 2;
        return;
    }
    if (buffs.player.revived) return;
    if (hasArtifact('guardian_angel_legend')) {
        buffs.player.revived = true;
        player.hp = player.maxHp;
        log('[전설] 수호천사의 깃털이 빛나며 완전하게 부활했습니다! (HP 100% 회복)', 'heal');
    } else if (hasArtifact('guardian_angel')) {
        buffs.player.revived = true;
        player.hp = Math.floor(player.maxHp * 0.5);
        log('수호천사의 깃털이 부서지며 부활했습니다! (HP 50% 회복)', 'heal');
    }
}

// Returns true when the battle is over. The side that just acted lands its hit first.
function settle(attacker) {
    const enemyDown = () => {
        if (currentEnemy.hp <= 0) reviveOrSwapEnemy();
        if (currentEnemy.hp <= 0) { finishBattle('win'); return true; }
        return false;
    };
    const playerDown = () => {
        if (player.hp <= 0) savePlayerFromDeath();
        if (player.hp <= 0) { finishBattle('lose'); return true; }
        return false;
    };
    return attacker === 'enemy' ? (playerDown() || enemyDown()) : (enemyDown() || playerDown());
}

function executeTurn(skillKey) {
    if (!battle || battle.over) return false;
    const stunned = !!buffs.player.stun;
    const skill = stunned ? null : player.skills[skillKey];
    if (!stunned && (!skill || !gameState.learnedSkills.includes(skillKey) || skillBlocker(skillKey))) return false;

    beats = [];
    log(`TURN ${turnCount}`, 'turn');
    if (stunned) log('행동 불가 상태입니다!', 'dmg');
    else performPlayerAction(skill);
    if (settle('player')) return true;

    if (buffs.enemy.stun) {
        log(`${currentEnemy.name}은(는) 기절하여 움직일 수 없습니다!`, 'info');
        delete buffs.enemy.stun;
    } else {
        enemyTurn();
    }
    if (settle('enemy')) return true;

    endTurnPhase();
    settle('player');
    return true;
}

function finishBattle(kind) {
    battle.over = true;
    const enemy = currentEnemy;
    const result = { kind, enemy: enemy.name, boss: isBoss(enemy), exp: 0, gold: 0, levels: [], artifacts: [], unlock: null, cleared: false };
    if (kind === 'win') {
        log('전투 승리!', 'win');
        const pocket = player.artifacts.find(a => a.effect === 'gold_up');
        result.exp = enemy.exp;
        result.gold = Math.floor(enemy.gold * (1 + (pocket ? pocket.val : 0)));
        player.exp += result.exp;
        gameState.gold += result.gold;

        let drop = null;
        if (enemy.name === '마신' && Math.random() < 0.1) drop = BOSS_DROP_ARTIFACTS.mashin;
        else if (enemy.name === '혹한의 마녀' && Math.random() < 0.1) drop = BOSS_DROP_ARTIFACTS.witch;
        else if (enemy.name === '창조신 아스테아' && getCycleCount() >= 4) drop = BOSS_DROP_ARTIFACTS.goddess;
        else if (enemy.name === '푸딩 프린세스') drop = BOSS_DROP_ARTIFACTS.pudding;
        else if (enemy.name === '인조 마신') drop = BOSS_DROP_ARTIFACTS.artificial;
        else if (enemy.name === '골드 드래곤') drop = BOSS_DROP_ARTIFACTS.gold_dragon;
        else if (enemy.name === '고대신 파라오') drop = BOSS_DROP_ARTIFACTS.pharaoh;
        else if (enemy.name === '시간의 지배자') drop = BOSS_DROP_ARTIFACTS.time_ruler;
        // The hidden boss's reward was defined in the data but never dropped.
        else if (enemy.tier === 'hidden') drop = BOSS_DROP_ARTIFACTS.hidden;
        if (drop && !getBossArtifactUnlocks().includes(drop.id)) {
            unlockBossArtifact(drop.id);
            initArtifactsWithNGPlus();
            result.unlock = drop;
        }
        if (enemy.name === '창조신 아스테아') {
            saveClear(player.charKey);
            gameState.clearedCreator = true;
            result.cleared = true;
        }
        const grown = gainLevels();
        result.levels = grown.levels;
        result.artifacts = grown.artifacts;
    } else {
        log('전투 패배...', 'lose');
    }
    battle.result = result;
}

// 남는 경험치는 다음 레벨로 이어지고, 한 번에 여러 레벨이 올라도 유물 레벨을 빠뜨리지 않는다.
function gainLevels() {
    const out = { levels: [], artifacts: [] };
    const maxLevel = getMaxLevel();
    while (player.level < maxLevel && player.exp >= expToNext()) {
        player.exp -= expToNext();
        player.level++;
        recalcAllStats();
        out.levels.push(player.level);
        if (ARTIFACT_LEVELS.includes(player.level)) {
            const pick = rollArtifact();
            if (pick) out.artifacts.push(pick);
        }
    }
    if (player.level >= maxLevel) player.exp = 0;
    return out;
}

// 마을로 돌아오면 전투의 흔적을 지우고 HP/MP를 회복한 뒤 자동 저장한다.
function returnToTown() {
    battle = null;
    currentEnemy = null;
    beats = [];
    buffs = { player: {}, enemy: {} };
    roseStack = 0;
    delete gameState.hiddenBossReserve;
    delete gameState.hiddenBossDead;
    if (player.charKey === 'rumi') player.dreamCrystals = 5;
    recalcAllStats();
    player.hp = player.maxHp;
    player.mp = player.maxMp;
    saveGame();
}

// ---------- Town ----------
function manaCost() { return gameState.manaLevel >= MANA_COSTS.length ? null : MANA_COSTS[gameState.manaLevel]; }
function upgradeMana() {
    const cost = manaCost();
    if (cost === null) return 'max';
    if (gameState.gold < cost) return 'gold';
    gameState.gold -= cost;
    gameState.manaLevel++;
    player.mpRegen = MANA_REGEN[player.charKey][gameState.manaLevel];
    saveGame();
    return '';
}
function equipCost(type) {
    const tier = type === 'weapon' ? gameState.equipWeapon : gameState.equipArmor;
    return tier >= EQUIP_COSTS.length ? null : EQUIP_COSTS[tier];
}
function buyEquip(type) {
    const cost = equipCost(type);
    if (cost === null) return 'max';
    if (gameState.gold < cost) return 'gold';
    gameState.gold -= cost;
    if (type === 'weapon') gameState.equipWeapon++;
    else gameState.equipArmor++;
    recalcAllStats();
    player.hp = player.maxHp;
    player.mp = player.maxMp;
    saveGame();
    return '';
}
function buySkill(key) {
    const skill = player.skills[key];
    if (!skill || gameState.learnedSkills.includes(key)) return 'owned';
    if (gameState.gold < skill.price) return 'gold';
    gameState.gold -= skill.price;
    gameState.learnedSkills.push(key);
    saveGame();
    return '';
}
const REROLL_COST = { normal: 20000, noble: 100000 };
function resetAllArtifacts(highQuality = false) {
    const cost = highQuality ? REROLL_COST.noble : REROLL_COST.normal;
    if (!player.artifacts.length) return { error: 'none' };
    if (gameState.gold < cost) return { error: 'gold' };
    gameState.gold -= cost;
    const count = player.artifacts.length;
    player.artifacts = [];
    const picks = [];
    for (let i = 0; i < count; i++) { const pick = rollArtifact(highQuality); if (pick) picks.push(pick); }
    recalcAllStats();
    player.hp = player.maxHp;
    player.mp = player.maxMp;
    saveGame();
    return { picks };
}

// ---------- Save ----------
function saveGame() {
    if (battle || !player || !player.charKey) return false;
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({ player, gameState, roseStack: 0, timestamp: Date.now(), dateStr: new Date().toLocaleString() }));
        return true;
    } catch { return false; }
}
function readSave() {
    try {
        const data = JSON.parse(localStorage.getItem(SAVE_KEY));
        return data && data.player && CHAR_DATA[data.player.charKey] && data.gameState ? data : null;
    } catch { return null; }
}
function loadGame() {
    const data = readSave();
    if (!data) return false;
    player = data.player;
    gameState = Object.assign(defaultGameState(), data.gameState);
    delete gameState.hiddenBossReserve;
    delete gameState.hiddenBossDead;
    // 스킬 정의는 언제나 현재 데이터에서 읽는다(예전 저장본의 복사본 대신).
    player.skills = clone(CHAR_DATA[player.charKey].skills);
    gameState.learnedSkills = (gameState.learnedSkills || ['basic']).filter(key => player.skills[key]);
    gameState.manaLevel = Math.min(gameState.manaLevel || 0, MANA_COSTS.length);
    player.mpRegen = MANA_REGEN[player.charKey][gameState.manaLevel];
    if (player.charKey === 'rumi') player.dreamCrystals = 5;
    roseStack = 0;
    buffs = { player: {}, enemy: {} };
    battle = null;
    currentEnemy = null;
    initArtifactsWithNGPlus();
    recalcAllStats();
    player.hp = player.maxHp;
    player.mp = player.maxMp;
    return true;
}
function wipeEverything() {
    localStorage.removeItem(SAVE_KEY);
    META_KEYS.forEach(key => localStorage.removeItem(key));
}

// ---------- AUTO ----------
// 반복 사냥용 자동 전투. 마무리 → 차지 발동 → 위험할 때 방어·회복 → 꺼진 강화 → 기대 피해가 가장 큰 공격 순서로 고른다.
function expectedDamage(skill) {
    if (!skill.power || skill.effect.startsWith('form_change_')) return 0;
    const isPhy = skill.type === 'phy';
    let atk = isPhy ? player.atk : player.matk;
    if (skill.effect === 'sage_hybrid_mana') atk = (player.atk + player.matk) / 2;
    if (skill.effect === 'charge_milkyway') atk = player.atk + player.matk;
    let power = skill.power;
    const lost = 1 - player.hp / player.maxHp;
    if (skill.effect === 'stack_dmg') power += buffs.player.absoluteStack || 0;
    if (skill.effect === 'rose_finisher') power = Math.min(11, power + roseStack * 0.4);
    if (skill.effect === 'hp_reverse') power = 3 + lost * 6;
    if (skill.effect === 'hp_reverse_mid') power = 1.2 + lost * 2.2;
    if (skill.effect === 'stack_ult_new') power = Math.min(5, (buffs.player.castleStack || 0) + 1) * 2;
    if (skill.effect === 'charge_divine') power += (buffs.player.divineStack || 0) * 0.3;
    if (skill.effect === 'miss_chance') power *= 0.7;
    if (skill.effect === 'sage_dream_ult') power = buffs.player.sageForm === 'moon' ? ((buffs.player.moonUltStack || 0) + 1) * 3.5 : buffs.player.sageForm === 'sun' ? 4 + (player.dreamCrystals || 0) * 1.5 : buffs.player.sageForm ? 4 : 2.5;
    const def = isPhy ? currentEnemy.def : currentEnemy.mdef;
    const crit = Math.min(1, skill.effect === 'guarantee_crit' ? 1 : player.baseCrit);
    return atk * power * (100 / (100 + def)) * (1 + crit * (player.baseCritDmg - 1));
}
// The big scripted hit that lands this turn, if the rules make it knowable: 'phy', 'mag' or null.
function enemyThreatNow() {
    const b = buffs.enemy, e = currentEnemy, t = turnCount;
    if (b.charging) return 'phy';
    if (b.forecastType && t === b.forecastTurn + 5) return b.forecastType === 'doom' ? 'phy' : b.forecastType === 'darkness' ? 'mag' : null;
    if (e.ai === 'mawang' && t % 5 === 0) return 'phy';
    if (e.ai === 'mashin' && t % 7 === 0) return 'phy';
    if (e.ai === 'goddess' && t === 2) return 'mag';
    if ((e.ai === 'iris_light' || e.ai === 'iris_curse') && [22, 44, 66].includes(t)) return 'phy';
    if ((e.ai === 'iris_light' || e.ai === 'iris_curse') && (t + 2) % 10 === 0) return 'mag';
    return null;
}
function autoSkill() {
    if (!battle || battle.over || buffs.player.stun) return null;
    const sk = k => player.skills[k];
    const usable = gameState.learnedSkills.filter(k => sk(k) && !skillBlocker(k));
    const has = effect => usable.find(k => sk(k).effect === effect);
    const charged = usable.find(k => isCharged(sk(k)));
    const hp = player.hp / player.maxHp;
    const foeHp = currentEnemy.hp / currentEnemy.maxHp;
    const immune = currentEnemy.ai === 'mashin' ? (turnCount % 2 ? 'phy' : 'mag') : null;
    const countered = !!buffs.enemy.counter;
    const threat = enemyThreatNow();
    const risk = s => (['self_stun', 'rose_2_self_stun'].includes(s.effect) ? 0.55 : s.effect === 'self_def_zero' ? 0.6 : s.effect === 'hp_cost' ? (hp > 0.5 ? 0.9 : 0.4) : s.effect === 'hp_cost_20' ? (hp > 0.6 ? 0.85 : 0.3) : 1);
    const attacks = usable.filter(k => {
        const s = sk(k);
        if (expectedDamage(s) <= 0 || (s.effect.startsWith('charge_') && !isCharged(s))) return false;
        if (immune && s.type === immune) return false;
        if (countered && s.type === 'phy') return false;
        if (s.effect === 'rose_finisher' && roseStack < 8) return false;
        if (s.effect === 'sage_dream_ult' && !buffs.player.sageForm) return false;
        return true;
    });
    const score = k => expectedDamage(sk(k)) * risk(sk(k));
    const best = list => list.slice().sort((a, b) => score(b) - score(a))[0];
    // 1. 이번 공격으로 끝낼 수 있으면 가장 센 공격(반동은 상관없다).
    const finisher = attacks.filter(k => expectedDamage(sk(k)) >= currentEnemy.hp).sort((a, b) => expectedDamage(sk(b)) - expectedDamage(sk(a)))[0];
    if (finisher) return finisher;
    if (charged) return charged;
    // 2. 큰 공격이 이번 턴에 온다: 맞는 종류를 막고, 막을 수 없으면 버틴다.
    if (threat) {
        const guard = (threat === 'phy' && has('null_phy')) || (threat === 'mag' && has('null_mag')) || has('perfect_eva') || has('guard_70') || has('sage_barrier') || has('dmg_red_50')
            || (hp < 0.5 && has('immortal')) || has('evasion_50') || (roseStack >= 3 && has('stun_rose_3'));
        if (guard) return guard;
    }
    if (hp < 0.45) {
        const heal = has('milkshake_heal') || has('reset_buff');
        if (heal) return heal;
    }
    if (buffs.enemy.charging && roseStack >= 3 && has('stun_rose_3')) return has('stun_rose_3');
    // 3. 꺼져 있는 강화(적이 아직 충분히 남아 있을 때만).
    if (foeHp > 0.35) {
        const buffsOff = [
            ['enchant_buff', !buffs.player.enchantTurns], ['divine_buff', !buffs.player.divineTurns], ['adrenaline', !buffs.player.adrenalineTurns],
            ['royal_bloom', !buffs.player.royalBloomTurns && roseStack >= 4], ['passive_boost', !buffs.player.gardenTurns && roseStack >= 6],
            ['add_rose_3', roseStack < 6], ['reflect', !buffs.player.sanctuaryTurns && hp < 0.75], ['mana_dress', !buffs.player.manaDress && player.mp < player.maxMp * 0.5]
        ];
        for (const [effect, off] of buffsOff) { const k = off && has(effect); if (k) return k; }
        if (player.charKey === 'rumi' && !buffs.player.sageForm && (player.dreamCrystals || 0) > 0) {
            const form = (player.matk >= player.atk ? has('form_change_moon') : null) || has('form_change_star');
            if (form) return form;
        }
    }
    // 4. 위험을 감안한 기대 피해가 가장 큰 공격.
    return best(attacks) || usable.find(k => k === 'basic') || usable[0] || null;
}

/* =========================================
   4. 그림 (SVG)
   캐릭터와 적은 카드 게임과 같은 3:5 일러스트를 쓴다(같은 폴더의 PNG).
   그림이 없을 때는 카드 게임처럼 카드 뒷면에 이름을 얹어 보여주고, 배경은 조용한 평면 벡터로 그린다.
   ========================================= */
const Art = (() => {
    const C = {
        navy: '#1B2A5E', navy2: '#2D4390', ink: '#1B2550', gold: '#F4C24F', goldD: '#B8860B',
        pink: '#FFC4DA', lemon: '#FFE9A6', sky: '#B4E8FF', white: '#FFFFFF', coral: '#F0566E', aqua: '#22B4D8'
    };
    let uid = 0;
    const id = name => `${name}${++uid}`;
    const rand = seed => () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    const hash = text => [...String(text)].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) % 2147483647, 7) || 7;
    const pts = list => list.map(p => p.map(n => Math.round(n * 10) / 10).join(',')).join(' ');
    const star = (x, y, r, fill, op = 1) => `<path d="M${x} ${y - r}L${x + r * 0.2} ${y - r * 0.2}L${x + r} ${y}L${x + r * 0.2} ${y + r * 0.2}L${x} ${y + r}L${x - r * 0.2} ${y + r * 0.2}L${x - r} ${y}L${x - r * 0.2} ${y - r * 0.2}Z" fill="${fill}" opacity="${op}"/>`;

    // Thin gold line glyphs, one per class, drawn in a 40x40 box.
    const GLYPH = {
        luna: '<path d="M24 6a14 14 0 1 0 10 24A12 12 0 1 1 24 6Z"/>',
        zeke: '<path d="M20 5L33 10V20C33 28 27 33 20 36C13 33 7 28 7 20V10Z"/><path d="M20 12V28M14 19H26"/>',
        jasmine: '<circle cx="20" cy="20" r="7"/><path d="M20 4V9M20 31V36M4 20H9M31 20H36M8.7 8.7L12.2 12.2M27.8 27.8L31.3 31.3M8.7 31.3L12.2 27.8M27.8 12.2L31.3 8.7"/>',
        queen: '<path d="M20 9L25 14L20 19L15 14Z"/><path d="M20 19L27 22L20 31L13 22Z"/><path d="M20 31V37M8 7L12 11M32 7L28 11"/>',
        rumi: '<path d="M20 4L23 17L36 20L23 23L20 36L17 23L4 20L17 17Z"/>',
        enemy: '<path d="M20 5L34 13V27L20 35L6 27V13Z"/><path d="M20 13L27 17V24L20 28L13 24V17Z"/>',
        boss: '<path d="M7 28L9 12L16 19L20 9L24 19L31 12L33 28Z"/><path d="M7 32H33"/>'
    };

    // 3:5 card back with the name: what a card shows when its illustration file is not beside the HTML.
    function cardBack({ name, glyph = 'enemy', seed = name }) {
        const g = id('cb'), r = rand(hash(seed));
        let field = '';
        for (let i = 0; i < 18; i++) field += star(20 + r() * 260, 20 + r() * 300, 1 + r() * 2.4, C.white, 0.25 + r() * 0.5);
        const label = String(name);
        const size = label.length > 7 ? 26 : label.length > 4 ? 32 : 38;
        return `<svg class="art-svg" viewBox="0 0 300 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <defs><linearGradient id="${g}" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="${C.navy2}"/><stop offset="1" stop-color="${C.navy}"/></linearGradient></defs>
            <rect width="300" height="500" fill="url(#${g})"/>${field}
            <rect x="14" y="14" width="272" height="472" fill="none" stroke="${C.gold}" stroke-opacity=".55"/>
            <rect x="20" y="20" width="260" height="460" fill="none" stroke="${C.gold}" stroke-opacity=".25"/>
            <circle cx="150" cy="200" r="74" fill="none" stroke="${C.gold}" stroke-opacity=".35"/>
            <circle cx="150" cy="200" r="92" fill="none" stroke="${C.white}" stroke-opacity=".12" stroke-dasharray="2 6"/>
            <g transform="translate(110 160) scale(2)" fill="none" stroke="${C.gold}" stroke-width="1.6" stroke-linejoin="round">${GLYPH[glyph] || GLYPH.enemy}</g>
            ${star(240, 70, 12, C.gold, 0.9)}${star(64, 330, 7, C.white, 0.7)}
            <path d="M0 380L300 340V430L0 470Z" fill="${C.white}" fill-opacity=".1"/>
            <text x="150" y="${420 + size * 0.1}" text-anchor="middle" font-size="${size}" font-weight="900" fill="${C.white}" font-family="inherit">${label}</text>
            <text x="150" y="452" text-anchor="middle" font-size="11" letter-spacing="4" fill="${C.gold}" fill-opacity=".85" font-family="inherit">LEGEND EDITION</text>
        </svg>`;
    }

    // Quiet flat scenery for the battle stage and dungeon rows: high key, low contrast, one motif per place.
    const THEMES = {
        town: ['#E3F4FC', '#FFF7E6'], title: ['#DDF1FF', '#FFE6F0'], cave: ['#DCEFFA', '#F4F9FD'], forest: ['#E1F3F5', '#FBF7E6'],
        castle: ['#F8E6EE', '#FDF6E5'], rift: ['#EEE5F7', '#E1F1FA'], glacier: ['#DDF2FC', '#F8FCFF'], heaven: ['#FFF4D8', '#FFFFFF'],
        dessert: ['#FFE6EF', '#FFF6DC'], magic: ['#E4ECFB', '#F7E9F4'], dragon: ['#FFF0D9', '#FBE5E8'], ruins: ['#FBF1DD', '#E5F2F8'],
        time: ['#E2EFFA', '#FBF4E0'], hidden: ['#FFF4D8', '#E6E3F0']
    };
    function motif(theme, r) {
        const line = `stroke="${C.navy}" stroke-opacity=".14" stroke-width="1.2"`;
        const solid = `fill="${C.white}" fill-opacity=".78" ${line}`;
        const ridge = (base, amp, step) => {
            const p = [[0, 240]];
            for (let x = 0; x <= 400; x += step) p.push([x, base - r() * amp]);
            p.push([400, 240]);
            return `<polygon points="${pts(p)}" ${solid}/>`;
        };
        let s = '';
        switch (theme) {
            case 'cave':
                for (let x = -10; x < 410; x += 28 + r() * 20) { const w = 14 + r() * 16, h = 26 + r() * 60; s += `<polygon points="${pts([[x, 0], [x + w, 0], [x + w / 2, h]])}" ${solid}/>`; }
                s += ridge(206, 24, 36); break;
            case 'forest':
                for (let row = 0; row < 2; row++) for (let x = -20; x < 420; x += 36 + r() * 22) { const base = 176 + row * 30, h = 46 + r() * 46, w = 18 + r() * 10; s += `<polygon points="${pts([[x, base], [x + w, base - h], [x + w * 2, base]])}" ${solid}/>`; }
                s += `<rect y="214" width="400" height="26" fill="${C.white}" fill-opacity=".8"/>`; break;
            case 'castle':
                for (const [x, top, w] of [[60, 80, 26], [118, 58, 34], [188, 36, 44], [262, 64, 30], [322, 86, 24]]) s += `<polygon points="${pts([[x, 214], [x, top + 22], [x + w / 2, top], [x + w, top + 22], [x + w, 214]])}" ${solid}/>`;
                s += `<rect x="40" y="176" width="320" height="40" ${solid}/>`; break;
            case 'rift':
                s += ridge(212, 18, 40);
                for (let i = 0; i < 8; i++) { const x = 30 + r() * 340, y = 30 + r() * 140, k = 6 + r() * 12; s += `<polygon points="${pts([[x, y - k], [x + k * 0.5, y], [x, y + k * 0.7], [x - k * 0.4, y]])}" fill="${i % 2 ? C.pink : C.sky}" opacity=".8"/>`; }
                break;
            case 'glacier': s += ridge(176, 56, 46) + ridge(208, 20, 30); break;
            case 'heaven':
                for (let i = 0; i < 6; i++) { const x = 50 + i * 56; s += `<polygon points="${pts([[x, 0], [x + 10, 0], [x + 60, 240], [x + 34, 240]])}" fill="${C.white}" opacity=".5"/>`; }
                for (let i = 0; i < 5; i++) s += `<rect x="${90 + i * 36}" y="${218 - i * 22}" width="${260 - i * 36}" height="9" ${solid}/>`;
                break;
            case 'dessert':
                for (let y = 18; y < 240; y += 26) for (let x = (y / 26) % 2 ? 14 : 0; x < 400; x += 28) s += `<circle cx="${x}" cy="${y}" r="2.2" fill="${C.white}" opacity=".9"/>`;
                break;
            case 'magic':
                for (const [cx, cy, rad] of [[110, 120, 70], [300, 90, 46]]) s += `<circle cx="${cx}" cy="${cy}" r="${rad}" fill="none" stroke="${C.white}" stroke-width="1.6"/><circle cx="${cx}" cy="${cy}" r="${rad * 0.78}" fill="none" ${line} stroke-dasharray="3 5"/>`;
                s += ridge(214, 12, 40); break;
            case 'dragon': s += ridge(150, 64, 60) + ridge(206, 18, 34); break;
            case 'ruins':
                s += `<polygon points="${pts([[90, 212], [170, 100], [250, 212]])}" ${solid}/><polygon points="${pts([[220, 212], [280, 128], [340, 212]])}" ${solid}/><rect y="208" width="400" height="32" ${solid}/>`; break;
            case 'time': {
                s += `<circle cx="200" cy="108" r="78" ${solid}/>`;
                for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2, k = i % 3 ? 7 : 13; s += `<line x1="${200 + Math.sin(a) * (78 - k)}" y1="${108 - Math.cos(a) * (78 - k)}" x2="${200 + Math.sin(a) * 78}" y2="${108 - Math.cos(a) * 78}" ${line}/>`; }
                break;
            }
            case 'hidden':
                s += `<polygon points="210,0 400,0 400,240 130,240" fill="${C.navy}" opacity=".16"/>`;
                for (let i = 0; i < 9; i++) { const a = -0.4 + i * 0.1; s += `<line x1="210" y1="0" x2="${210 + Math.sin(a) * 400}" y2="${Math.cos(a) * 400}" stroke="${C.white}" stroke-opacity=".6"/>`; }
                break;
            case 'title':
                for (let i = 0; i < 8; i++) { const x = -40 + i * 64; s += `<polygon points="${pts([[x, 0], [x + 10, 0], [x + 120, 240], [x + 96, 240]])}" fill="${C.white}" opacity=".45"/>`; }
                break;
            default:
                s += ridge(180, 26, 56);
                for (const [x, w, h] of [[40, 46, 40], [96, 38, 54], [146, 52, 36], [214, 40, 48], [264, 56, 40], [330, 40, 52]]) s += `<polygon points="${pts([[x, 214], [x, 214 - h], [x + w / 2, 214 - h - 18], [x + w, 214 - h], [x + w, 214]])}" ${solid}/>`;
                s += `<rect y="212" width="400" height="28" fill="${C.white}" fill-opacity=".85"/>`;
        }
        return s;
    }
    function scenery(theme, seed = theme) {
        const [top, bottom] = THEMES[theme] || THEMES.town;
        const g = id('sky'), r = rand(hash(seed));
        let sparkle = '';
        for (let i = 0; i < 6; i++) sparkle += star(20 + r() * 360, 14 + r() * 120, 2 + r() * 4, i % 2 ? C.white : C.gold, 0.8);
        return `<svg class="scenery" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bottom}"/></linearGradient></defs><rect width="400" height="240" fill="url(#${g})"/>${motif(theme, r)}${sparkle}</svg>`;
    }

    // Tries each file name in turn (luna.png, then 루나.png); a missing file is never requested twice.
    const missing = new Set();
    function withImage(box, sources, fallback) {
        const list = (Array.isArray(sources) ? sources : [sources]).filter(src => src && !missing.has(src));
        const token = list.join('|') || `-${fallback.length}`;
        if (box.dataset.src === token && box.firstElementChild) return;
        box.dataset.src = token;
        box.classList.remove('has-img');
        box.innerHTML = fallback;
        const next = i => {
            if (i >= list.length || box.dataset.src !== token) return;
            const img = new Image();
            img.decoding = 'async';
            img.alt = '';
            img.onload = () => { if (box.dataset.src === token) { box.replaceChildren(img); box.classList.add('has-img'); } };
            img.onerror = () => { missing.add(list[i]); next(i + 1); };
            img.src = list[i];
        };
        next(0);
    }
    function heroArt(box, key) {
        const data = CHAR_DATA[key];
        withImage(box, [`${key}.png`, `${data.name}.png`], cardBack({ name: data.name, glyph: key }));
    }
    function enemyArt(box, enemy) {
        withImage(box, [enemy.img, `${enemy.name}.png`], cardBack({ name: enemy.name, glyph: BOSS_AIS.includes(enemy.ai) ? 'boss' : 'enemy' }));
    }
    function typeIcon(type) {
        if (type === 'phy') return '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13L11 5M9 3L13 3L13 7M2 11L5 14" fill="none" stroke="currentColor" stroke-width="1.9"/></svg>';
        if (type === 'mag') return '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5L9.6 6.4L14.5 8L9.6 9.6L8 14.5L6.4 9.6L1.5 8L6.4 6.4Z" fill="currentColor"/></svg>';
        return '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5L13.5 3.5V8C13.5 11 11 13.3 8 14.5C5 13.3 2.5 11 2.5 8V3.5Z" fill="none" stroke="currentColor" stroke-width="1.9"/></svg>';
    }
    return { C, scenery, cardBack, withImage, heroArt, enemyArt, typeIcon, star };
})();

/* =========================================
   5. 소리 (WebAudio로 만든 음악과 효과음)
   파일 없이 화음 진행과 패턴으로 마을·전투·보스 곡을 만든다. 첫 터치 뒤에만 소리가 난다.
   ========================================= */
const Sound = (() => {
    const KEY = 'turnRpgSound';
    let settings = { music: true, sfx: true };
    try { settings = Object.assign(settings, JSON.parse(localStorage.getItem(KEY)) || {}); } catch { /* defaults */ }
    let ctx = null, master, musicBus, sfxBus, noise, timer = null, track = null, wanted = null, step = 0, nextTime = 0;

    const midi = n => 440 * Math.pow(2, (n - 69) / 12);
    // Chords are MIDI notes; bass is the root an octave down. 16 steps per bar.
    const TRACKS = {
        town: { bpm: 84, bars: [[62, 66, 69, 73], [59, 62, 66, 69], [55, 59, 62, 66], [57, 61, 64, 67]],
            arp: [0, 1, 2, 3, 2, 1, 2, 3, 0, 1, 2, 3, 4, 3, 2, 1], arpEvery: 2, bass: [0, 8], hat: false, pad: 0.06, lead: 0.05 },
        battle: { bpm: 132, bars: [[64, 67, 71, 74], [60, 64, 67, 71], [55, 59, 62, 67], [62, 66, 69, 74]],
            arp: [0, 2, 1, 3, 0, 2, 1, 3, 0, 2, 1, 3, 4, 3, 2, 1], arpEvery: 1, bass: [0, 3, 6, 8, 11, 14], hat: true, pad: 0.035, lead: 0.035 },
        boss: { bpm: 144, bars: [[62, 65, 69, 72], [58, 62, 65, 69], [55, 58, 62, 65], [57, 61, 64, 69]],
            arp: [0, 3, 2, 3, 1, 3, 2, 3, 0, 3, 2, 3, 4, 3, 2, 3], arpEvery: 1, bass: [0, 2, 4, 6, 8, 10, 12, 14], hat: true, pad: 0.04, lead: 0.03 }
    };

    function ensure() {
        if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return true; }
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        ctx = new AC();
        master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination);
        musicBus = ctx.createGain(); musicBus.connect(master);
        sfxBus = ctx.createGain(); sfxBus.connect(master);
        applySettings();
        noise = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
        const data = noise.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        return true;
    }
    function applySettings() {
        if (!ctx) return;
        musicBus.gain.setTargetAtTime(settings.music ? 0.9 : 0, ctx.currentTime, 0.05);
        sfxBus.gain.setTargetAtTime(settings.sfx ? 0.9 : 0, ctx.currentTime, 0.02);
    }
    function voice({ freq, at, dur, type = 'sine', gain = 0.1, attack = 0.01, release = 0.2, bus = musicBus, cutoff = 6000, detune = 0 }) {
        const osc = ctx.createOscillator(), amp = ctx.createGain(), filter = ctx.createBiquadFilter();
        osc.type = type; osc.frequency.value = freq; osc.detune.value = detune;
        filter.type = 'lowpass'; filter.frequency.value = cutoff;
        amp.gain.setValueAtTime(0.0001, at);
        amp.gain.exponentialRampToValueAtTime(gain, at + attack);
        amp.gain.setValueAtTime(gain, at + Math.max(attack, dur - release));
        amp.gain.exponentialRampToValueAtTime(0.0001, at + dur);
        osc.connect(filter); filter.connect(amp); amp.connect(bus);
        osc.start(at); osc.stop(at + dur + 0.05);
    }
    function hiss({ at, dur = 0.04, gain = 0.04, freq = 7000, bus = musicBus, type = 'highpass' }) {
        const src = ctx.createBufferSource(), amp = ctx.createGain(), filter = ctx.createBiquadFilter();
        src.buffer = noise; filter.type = type; filter.frequency.value = freq;
        amp.gain.setValueAtTime(gain, at); amp.gain.exponentialRampToValueAtTime(0.0001, at + dur);
        src.connect(filter); filter.connect(amp); amp.connect(bus);
        src.start(at); src.stop(at + dur + 0.02);
    }
    function schedule() {
        const t = TRACKS[track];
        if (!t) return;
        const sixteenth = 60 / t.bpm / 4;
        while (nextTime < ctx.currentTime + 0.25) {
            const bar = Math.floor(step / 16) % t.bars.length, s = step % 16, chord = t.bars[bar];
            if (s === 0) chord.forEach((n, i) => voice({ freq: midi(n - 12), at: nextTime, dur: sixteenth * 16, type: 'triangle', gain: t.pad, attack: 0.4, release: 0.6, cutoff: 1400, detune: i % 2 ? 6 : -6 }));
            if (s % t.arpEvery === 0) {
                const idx = t.arp[s], note = idx < 4 ? chord[idx] + 12 : chord[0] + 24;
                voice({ freq: midi(note), at: nextTime, dur: sixteenth * 1.8, type: 'sine', gain: t.lead, attack: 0.005, release: sixteenth * 1.5, cutoff: 5000 });
            }
            if (t.bass.includes(s)) voice({ freq: midi(chord[0] - 24), at: nextTime, dur: sixteenth * 1.6, type: 'triangle', gain: 0.11, attack: 0.005, release: sixteenth, cutoff: 900 });
            if (t.hat && s % 4 === 2) hiss({ at: nextTime, gain: 0.025 });
            if (t.hat && s % 8 === 4) hiss({ at: nextTime, dur: 0.12, gain: 0.05, freq: 1800, type: 'bandpass' });
            nextTime += sixteenth;
            step++;
        }
    }
    function startTrack(name) {
        if (!ctx || track === name) return;
        track = name; step = 0; nextTime = ctx.currentTime + 0.08;
        if (!timer) timer = setInterval(schedule, 60);
    }
    function play(name) {
        wanted = name;
        if (ctx && ctx.state !== 'suspended') startTrack(name);
    }
    function stop() { track = null; wanted = null; if (timer) { clearInterval(timer); timer = null; } }

    const SFX = {
        tap: at => voice({ freq: 1320, at, dur: 0.05, gain: 0.04, bus: sfxBus, release: 0.04 }),
        hit: at => { hiss({ at, dur: 0.09, gain: 0.12, freq: 1200, bus: sfxBus, type: 'bandpass' }); voice({ freq: 140, at, dur: 0.12, type: 'sine', gain: 0.2, bus: sfxBus, release: 0.1 }); },
        crit: at => { SFX.hit(at); voice({ freq: 1568, at: at + 0.02, dur: 0.22, gain: 0.08, bus: sfxBus, release: 0.18 }); voice({ freq: 2093, at: at + 0.06, dur: 0.24, gain: 0.06, bus: sfxBus, release: 0.2 }); },
        hurt: at => { hiss({ at, dur: 0.12, gain: 0.1, freq: 600, bus: sfxBus, type: 'lowpass' }); voice({ freq: 110, at, dur: 0.16, type: 'triangle', gain: 0.16, bus: sfxBus, release: 0.12 }); },
        heal: at => [72, 76, 79].forEach((n, i) => voice({ freq: midi(n + 12), at: at + i * 0.06, dur: 0.3, gain: 0.06, bus: sfxBus, release: 0.25 })),
        miss: at => hiss({ at, dur: 0.18, gain: 0.06, freq: 3000, bus: sfxBus, type: 'bandpass' }),
        win: at => [72, 76, 79, 84, 88].forEach((n, i) => voice({ freq: midi(n), at: at + i * 0.09, dur: 0.5, gain: 0.08, bus: sfxBus, release: 0.4 })),
        lose: at => [67, 63, 60, 55].forEach((n, i) => voice({ freq: midi(n), at: at + i * 0.14, dur: 0.5, type: 'triangle', gain: 0.07, bus: sfxBus, release: 0.4 })),
        level: at => [79, 84, 88, 91].forEach((n, i) => voice({ freq: midi(n), at: at + i * 0.07, dur: 0.35, gain: 0.07, bus: sfxBus, release: 0.3 }))
    };
    function sfx(name) {
        if (!ctx || !settings.sfx || ctx.state === 'suspended' || !SFX[name]) return;
        SFX[name](ctx.currentTime + 0.01);
    }
    // Browsers allow audio only after a user gesture.
    function unlock() {
        if (!ensure()) return;
        if (wanted && track !== wanted) startTrack(wanted);
    }
    window.addEventListener('pointerdown', unlock, { passive: true });
    window.addEventListener('keydown', unlock);
    document.addEventListener('visibilitychange', () => {
        if (!ctx) return;
        if (document.hidden) ctx.suspend(); else ctx.resume();
    });

    function set(key, value) {
        settings[key] = value;
        try { localStorage.setItem(KEY, JSON.stringify(settings)); } catch { /* session only */ }
        applySettings();
    }
    return { play, stop, sfx, set, get: key => settings[key] };
})();

/* =========================================
   6. 화면 (UI)
   규칙은 바꾸지 않고 상태를 그린다. 전투는 한 턴을 먼저 계산한 뒤 기록(beats)을 순서대로 재생한다.
   레퍼런스: 스텔라 소라(남색 위치 띠, 아쿠아 행동, 파스텔 엣지, 대각선 이름 띠의 획득 화면),
   블루 아카이브·붕괴: 스타레일(필살기 컷인, 큰 피해 숫자), 슬레이 더 스파이어·씨 오브 스타즈(적의 다음 행동 예고),
   포켓몬식 대각 구도(적은 오른쪽 위, 나는 왼쪽 아래, 정보판은 맞은편).
   ========================================= */
const UI = (() => {
    const $ = id => document.getElementById(id);
    const app = $('app');
    const fmt = n => Math.floor(Math.max(0, n)).toLocaleString('ko-KR');
    const pct = n => `${Math.round(n * 100)}%`;
    const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    const icon = (name, cls = '') => `<svg class="${cls}"><use href="#i-${name}"/></svg>`;
    const cleanLog = html => String(html).replace(/\sstyle="[^"]*"/g, '').replace(/<div class="log-turn">|<\/div>/g, '');
    const plain = html => String(html).replace(/<[^>]+>/g, '');

    const CLASS_INFO = {
        luna: { role: '암살자', en: 'Assassin', tags: ['회피', '치명타', '유리대포'], mech: '적에게 암흑을 쌓아 치명타를 키우고, 회피로 공격을 흘려 냅니다.' },
        zeke: { role: '기사단장', en: 'Knight Captain', tags: ['근성', '반격', '하이브리드 탱커'], mech: '체력이 낮을수록 강해지고, 맞으며 모은 디바인 스택을 한 번에 터뜨립니다.' },
        jasmine: { role: '마법사', en: 'Sorceress', tags: ['마나', '운영', '컨트롤'], mech: '넉넉한 마나로 큰 마법을 이어 쓰고, 무효화 마법으로 흐름을 잡습니다.' },
        queen: { role: '마법검사', en: 'Spellblade', tags: ['스택', '지속딜', '운영'], mech: '장미가 쌓일수록 매 턴 가시 피해가 커지고, 피날레로 한 번에 터뜨립니다.' },
        rumi: { role: '대현자', en: 'Grand Sage', tags: ['형태 변환', '하이브리드', '꿈의 결정'], mech: '꿈의 결정으로 별·달·태양의 형태를 바꿔 상황에 맞게 싸웁니다.' }
    };
    const CHAR_ORDER = ['luna', 'zeke', 'jasmine', 'queen', 'rumi'];
    const TYPE_NAME = { phy: '물리', mag: '마법', sup: '보조' };
    const RARITY = { epic: '에픽', legend: '전설' };
    const FORM_NAME = { star: '별의 형태', moon: '달의 형태', sun: '태양의 형태' };
    const PREF_KEY = 'turnRpgPrefs';
    let prefs = { speed: 1, auto: false, desc: false };
    try { prefs = Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY)) || {}); } catch { /* defaults */ }
    const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch { /* session only */ } };

    let tab = 'home', pickKey = 'luna', playing = false, skip = false, lastDungeon = null, pendingRun = null, autoTimer = null, repeatTimer = null;

    // ---------- Shell ----------
    function setScreen(name) {
        app.dataset.screen = name;
        renderBar();
        clearTimeout(autoTimer);
        if (name === 'battle') Sound.play(isBoss(currentEnemy) ? 'boss' : 'battle');
        else Sound.play('town');
    }
    function renderBar() {
        const screen = app.dataset.screen;
        const loc = $('loc');
        const cycle = getCycleCount() + 1 + (screen === 'select' && pendingRun && pendingRun.nextCycle ? 1 : 0);
        $('bar-gold').hidden = screen !== 'town';
        if (screen === 'town') $('bar-gold-num').textContent = fmt(gameState.gold);
        let button = '', title = '', en = '';
        if (screen === 'select') { button = `<button class="loc-btn" id="loc-btn" type="button" aria-label="타이틀로">${icon('back')}</button>`; title = '운명 선택'; en = `Destiny · ${cycle}회차`; }
        else if (screen === 'town') {
            const titles = { home: ['마을', 'Town'], explore: ['모험', 'Adventure'], forge: ['강화', 'Forge'], skills: ['스킬', 'Skill'], relics: ['유물', 'Relic'] };
            button = tab === 'home' ? `<span class="loc-btn" aria-hidden="true">${icon('home')}</span>` : `<button class="loc-btn" id="loc-btn" type="button" aria-label="마을로">${icon('back')}</button>`;
            [title, en] = titles[tab];
            en = `${en} · ${cycle}회차`;
        } else if (screen === 'battle' && battle) { button = `<span class="loc-btn" aria-hidden="true">${icon('star')}</span>`; title = battle.dungeon.name; en = `Turn ${turnCount}`; }
        loc.innerHTML = `${button}<span class="loc-text">${icon('pin')}<span class="loc-label"><b>${title}</b><span class="en">${en}</span></span></span>`;
        const back = $('loc-btn');
        if (back) back.onclick = () => {
            if (screen === 'select') { pendingRun = null; renderTitle(); setScreen('title'); }
            else { tab = 'home'; renderTown(); }
        };
    }
    function toast(message) {
        const el = $('toast');
        el.textContent = message;
        el.classList.add('show');
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => el.classList.remove('show'), 1800);
    }
    function overlay(inner, onEscape) {
        const veil = document.createElement('div');
        veil.className = 'veil';
        veil.innerHTML = inner;
        const previous = document.activeElement;
        const close = () => { veil.remove(); document.removeEventListener('keydown', onKey); if (previous && previous.focus) previous.focus({ preventScroll: true }); };
        const onKey = event => { if (event.key === 'Escape' && onEscape) { event.preventDefault(); onEscape(close); } };
        document.addEventListener('keydown', onKey);
        document.body.append(veil);
        const first = veil.querySelector('button');
        if (first) first.focus({ preventScroll: true });
        return { veil, close };
    }
    function ask({ title, body = '', ok = '확인', cancel = '취소', danger = false }) {
        return new Promise(resolve => {
            const { veil, close } = overlay(`<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-title"><div class="dialog-head"><h3 id="dlg-title">${title}</h3></div>${body ? `<p>${body}</p>` : ''}<div class="dialog-actions">${cancel ? `<button class="btn" data-v="0" type="button">${cancel}</button>` : ''}<button class="${danger ? 'btn danger' : 'cta'}" data-v="1" type="button">${ok}</button></div></div>`, done => { done(); resolve(false); });

        const again = availableDungeons().some(d => d.id === lastDungeon.id);
        const repeat = win && prefs.auto && again && !r.cleared;
        const actions = `<div class="result-actions"><button class="btn" type="button" data-go="town">마을로</button><button class="cta" type="button" data-go="again" ${again ? '' : 'disabled'}><span class="cta-text">다시 탐험<small>${lastDungeon.name}</small></span>${repeat ? '<i class="countdown" id="countdown">3</i>' : icon('go')}</button></div>`;
        const root = showAcquire({ word: win ? 'VICTORY' : 'DEFEAT', sub: win ? 'BATTLE CLEAR' : 'RETREAT TO TOWN', band: `${r.enemy}${win ? ' 격파' : '에게 패배'}`, bandSub: `${battle.dungeon.name} · ${turnCount}턴`, rows, lose: !win, actions });
        const go = where => {
            clearInterval(repeatTimer);
            root.innerHTML = '';
            returnToTown();
            if (where === 'again' && again) enterDungeon(dungeonById(lastDungeon.id));
            else { tab = 'home'; enterTown(); }
        };
        root.querySelectorAll('[data-go]').forEach(button => button.onclick = () => go(button.dataset.go));
        if (repeat) {
            let n = 3;
            repeatTimer = setInterval(() => {
                n--;
                const el = $('countdown');
                if (!el) return clearInterval(repeatTimer);
                if (n <= 0) go('again'); else el.textContent = n;
            }, 1000 * speed());
        }
    }

    // ---------- Settings ----------
    function openSettings() {
        const screen = app.dataset.screen;
        const inRun = screen === 'town' && player && player.charKey;
        const inBattle = screen === 'battle' && battle && !battle.over;
        const toggle = (key, label) => `<button class="row-toggle" type="button" role="switch" data-sound="${key}" aria-checked="${Sound.get(key)}">${label}<span class="switch-ui"></span></button>`;
        const clears = getClearHistory().length, unlocks = getBossArtifactUnlocks().length;
        const { veil, close } = overlay(`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="set-head">
            <div class="dialog-head"><h3 id="set-head">설정</h3></div>
            <div class="set-group"><span class="en">Sound · Screen</span>${toggle('music', '음악')}${toggle('sfx', '효과음')}
                ${canFull ? `<button class="row-toggle" type="button" role="switch" id="set-full" aria-checked="${isFull()}">전체화면<span class="switch-ui"></span></button>` : ''}</div>
            ${inBattle ? '<div class="set-group"><span class="en">Battle</span><div class="set-actions"><button class="btn wide danger" type="button" id="set-retreat">후퇴하고 마을로</button></div></div>' : ''}
            ${inRun ? `<div class="set-group"><span class="en">Journey</span><div class="set-actions"><button class="btn wide" type="button" id="set-restart">${gameState.clearedCreator ? '다음 회차로' : '처음부터 다시'}</button><button class="btn wide" type="button" id="set-title">타이틀로</button></div></div>` : ''}
            ${screen !== 'battle' ? '<div class="set-group"><span class="en">Data</span><div class="set-actions"><button class="btn wide danger" type="button" id="set-wipe">완전 초기화</button></div></div>' : ''}
            <p class="meta-line">${getCycleCount() + 1}회차 · 최대 Lv.${getMaxLevel()} · 전설 ${clears}/5 · 보스 유물 ${unlocks}</p>
            <div class="dialog-actions"><button class="cta" type="button" id="set-close">닫기</button></div></div>`, done => done());
        veil.querySelectorAll('[data-sound]').forEach(button => button.onclick = () => {
            const value = button.getAttribute('aria-checked') !== 'true';
            Sound.set(button.dataset.sound, value);
            button.setAttribute('aria-checked', String(value));
            syncSound();
        });
        const on = (id, fn) => { const el = veil.querySelector(`#${id}`); if (el) el.onclick = fn; };
        on('set-full', () => { toggleFull(); setTimeout(() => { const el = veil.querySelector('#set-full'); if (el) el.setAttribute('aria-checked', String(isFull())); }, 300); });
        on('set-close', close);
        on('set-retreat', async () => {
            close();
            if (!await ask({ title: '후퇴할까요?', body: '이번 전투는 패배로 끝나고 마을로 돌아갑니다. 잃는 것은 없습니다.', ok: '후퇴' })) return;
            if (playing || !battle || battle.over) return;
            prefs.auto = false; savePrefs(); syncToggles();
            beats = [];
            log('전투에서 물러났습니다.', 'info');
            finishBattle('lose');
            playBeats(beats.slice(), snap());
        });
        on('set-restart', async () => {
            close();
            if (gameState.clearedCreator) return nextCycle();
            if (!await ask({ title: '처음부터 다시 할까요?', body: `캐릭터·골드·보유 유물이 초기화됩니다.\n${getCycleCount() + 1}회차와 해금한 유물은 유지됩니다.`, ok: '다시 시작' })) return;
            pickKey = player.charKey || 'luna';
            openSelect({ nextCycle: false });
        });
        on('set-title', () => { close(); saveGame(); renderTitle(); setScreen('title'); });
        on('set-wipe', async () => {
            close();
            if (!await ask({ title: '모든 기록을 지울까요?', body: '저장된 여정, 회차, 전설 기록, 보스 유물 해금이 모두 사라집니다.\n되돌릴 수 없습니다.', ok: '완전 초기화', danger: true })) return;
            wipeEverything();
            player = {};
            gameState = defaultGameState();
            battle = null;
            renderTitle();
            setScreen('title');
            toast('모든 기록을 지웠습니다.');
        });
    }

    // ---------- Wiring ----------
    function syncToggles() {
        $('speed-toggle').setAttribute('aria-pressed', String(prefs.speed === 2));
        $('auto-toggle').setAttribute('aria-pressed', String(prefs.auto));
        $('desc-toggle').setAttribute('aria-pressed', String(prefs.desc));
        $('controls').classList.toggle('show-desc', prefs.desc);
    }
    function init() {
        $('btn-sound').onclick = () => {
            const on = !(Sound.get('music') || Sound.get('sfx'));
            Sound.set('music', on);
            Sound.set('sfx', on);
            syncSound();
        };
        $('btn-full').onclick = toggleFull;
        $('btn-menu').onclick = openSettings;
        $('btn-new').onclick = () => startNew(true);
        $('btn-pick').onclick = () => {
            beginNewRun(pendingRun || {});
            pendingRun = null;
            selectChar(pickKey);
            tab = 'home';
            enterTown();
        };
        document.querySelectorAll('#nav [data-tab]').forEach(button => button.onclick = () => {
            tab = button.dataset.tab;
            renderTown();
            const page = $(`page-${tab}`);
            if (page) page.scrollTop = 0;
        });
        $('desc-toggle').onclick = () => { prefs.desc = !prefs.desc; savePrefs(); syncToggles(); };
        $('speed-toggle').onclick = () => { prefs.speed = prefs.speed === 2 ? 1 : 2; savePrefs(); syncToggles(); };
        $('auto-toggle').onclick = () => {
            prefs.auto = !prefs.auto;
            savePrefs();
            syncToggles();
            if (prefs.auto && !playing && battle && !battle.over) act(autoSkill());
            if (!prefs.auto) clearTimeout(autoTimer);
        };
        $('log-toggle').onclick = () => {
            const box = $('log');
            const open = !box.classList.contains('open');
            box.classList.toggle('open', open);
            $('log-toggle').setAttribute('aria-expanded', String(open));
            $('log-toggle').innerHTML = icon(open ? 'close' : 'log');
            if (open) box.scrollTop = box.scrollHeight;
        };
        // 재생 중 무대를 누르면 이번 턴 연출을 건너뛴다.
        $('stage').addEventListener('click', () => { if (playing) { skip = true; if (cutin.cancel) cutin.cancel(); } });
        document.addEventListener('keydown', event => {
            if (app.dataset.screen !== 'battle' || document.querySelector('.veil') || $('result-root').firstElementChild) return;
            if (playing && (event.key === ' ' || event.key === 'Enter')) { skip = true; if (cutin.cancel) cutin.cancel(); event.preventDefault(); return; }
            const n = Number(event.key);
            if (n >= 1 && n <= 9) {
                const button = document.querySelectorAll('#skill-grid [data-skill], #skill-grid .pass')[n - 1];
                if (button && !button.disabled) button.click();
            }
        });
        document.addEventListener('fullscreenchange', syncFull);
        document.addEventListener('webkitfullscreenchange', syncFull);
        syncFull();
        syncSound();
        syncToggles();
        renderTitle();
        setScreen('title');
    }
    return { init, toast };
})();

UI.init();
</script>
</body>
</html>
