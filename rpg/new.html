<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F7">
<title>Turn RPG: Legend Edition</title>
<style>
/* =========================================
   Turn RPG: Legend Edition — 화면
   구조는 남색과 흰색, 행동은 아쿠아, 보상은 금색, 위험은 코랄.
   분홍·레몬·하늘 세 파스텔은 면을 채우지 않고 테두리의 빛(엣지)으로만 쓰고, 승리·획득·필살기처럼 중요한 순간에만 화면 전체로 번진다.
   캐릭터와 적의 그림은 카드 게임과 같은 3:5 일러스트이며, 모든 그림 틀은 3:5로 고정한다.
   ========================================= */
:root {
    --navy: #1B2A5E; --navy-2: #2D4390; --ink: #1B2550; --ink-2: #485176; --ink-3: #626A8E;
    --paper: #FFFFFF; --paper-2: #F7F8FC; --bg: #EEF1F7; --line: #DFE3EE; --line-2: #C6CCDD; --track: #E6E9F2;
    --aqua: linear-gradient(180deg, #5ADCEF 0%, #27B6DA 55%, #1898C2 100%); --aqua-edge: #0F7FA6; --aqua-solid: #22B4D8; --aqua-text: #0B7398;
    --coral: #F0566E; --coral-fill: #C8304C; --coral-text: #B42A45; --gold: #F4C24F; --gold-text: #865F05;
    --edge: linear-gradient(90deg, #FFB7D3 0%, #FFE59C 50%, #9EDFFF 100%);
    --edge-v: linear-gradient(180deg, #FFB7D3 0%, #FFE59C 50%, #9EDFFF 100%);
    --iris: linear-gradient(140deg, #FFD9E8 0%, #FFF3CC 42%, #D3EFFF 78%, #FFE3EF 100%);
    --hp: linear-gradient(90deg, #FF9AAE, #F0566E); --mp: linear-gradient(90deg, #8BE6F5, #22B4D8); --xp: linear-gradient(90deg, #FFE08A, #F4C24F);
    --slant: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
    --slant-l: polygon(14px 0, 100% 0, 100% 100%, 0 100%);
    --para: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
    --cut: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
    --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.3, 1.4, .5, 1);
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
    --bar-h: 54px; --nav-h: 64px;
    --shadow: 0 6px 16px rgba(27, 42, 94, .14);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #E3E7F0; color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--aqua-solid); outline-offset: 2px; }
svg { display: block; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
.en { display: block; font-size: 9.5px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; opacity: .78; }

/* ---------- Frame ---------- */
#app { position: relative; display: flex; flex-direction: column; width: 100%; max-width: 480px; height: 100vh; height: 100dvh; margin: 0 auto; background: var(--bg); overflow: hidden; box-shadow: 0 0 40px rgba(27, 42, 94, .12); }
#app::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(27, 42, 94, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(27, 42, 94, .035) 1px, transparent 1px); background-size: 14px 14px; pointer-events: none; }
main { position: relative; flex: 1; min-height: 0; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; min-height: 0; }
#app[data-screen=title] #scr-title, #app[data-screen=select] #scr-select, #app[data-screen=town] #scr-town, #app[data-screen=battle] #scr-battle { display: flex; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

/* ---------- Top bar (location band) ---------- */
.bar { position: relative; z-index: 20; display: flex; align-items: center; gap: 6px; height: calc(var(--bar-h) + var(--safe-t)); padding: var(--safe-t) 8px 0 0; flex-shrink: 0; }
#app[data-screen=title] .bar .loc, #app[data-screen=title] .bar .gold { display: none; }
.loc { position: relative; display: flex; align-items: center; height: 42px; min-width: 0; padding: 0 26px 0 52px; background: var(--navy); color: #fff; clip-path: var(--slant); }
.loc::after { content: ""; position: absolute; left: 0; right: 14px; bottom: 0; height: 3px; background: var(--edge); }
.loc-btn { position: absolute; z-index: 2; left: 6px; top: 3px; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: #fff; color: var(--navy); box-shadow: 0 0 0 2px var(--gold); }
.loc-btn svg { width: 19px; height: 19px; }
.loc-text { min-width: 0; display: flex; align-items: center; gap: 6px; }
.loc-text svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--gold); }
.loc-label { display: flex; flex-direction: column; min-width: 0; line-height: 1.1; }
.loc-label b { font-size: 15.5px; font-weight: 900; white-space: nowrap; }
.loc-label .en { margin-top: 2px; font-size: 8.5px; color: #CFE0FF; white-space: nowrap; }
.bar-gap { flex: 1; }
.gold { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 12px 0 6px; background: #fff; border: 1.5px solid var(--navy); color: var(--ink); font-weight: 900; font-size: 13px; border-radius: 15px; }
.gold svg { width: 18px; height: 18px; color: var(--gold); }
.tool { display: grid; place-items: center; width: 36px; height: 36px; background: #fff; color: var(--navy); border: 1.5px solid var(--line-2); border-radius: 8px; }
.tool svg { width: 19px; height: 19px; }
.tool:active { background: var(--track); }

/* ---------- Shared parts ---------- */
.band { position: relative; display: flex; align-items: center; gap: 8px; height: 36px; margin: 18px 0 10px -14px; padding: 0 26px 0 16px; width: max-content; max-width: calc(100% + 14px); background: var(--navy); color: #fff; clip-path: var(--slant); }
.band b { font-size: 15px; font-weight: 900; }
.band .en { color: #CFE0FF; }
.band svg { width: 14px; height: 14px; color: var(--gold); }
.band-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.band-row .note { margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--ink-3); text-align: right; }
.panel-card { position: relative; background: var(--paper); border: 1px solid var(--line); box-shadow: 0 2px 6px rgba(27, 42, 94, .06); }
/* Three-pastel edge light: a 2px gradient rim, never a fill. */
.edge::after { content: ""; position: absolute; inset: 0; padding: 2px; background: var(--edge); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); pointer-events: none; z-index: 2; }
.cta { position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 56px; padding: 6px 24px; background: var(--aqua); color: #fff; font-size: 17px; font-weight: 900; letter-spacing: .02em; text-shadow: 0 1px 0 rgba(6, 62, 92, .55), 0 0 6px rgba(6, 62, 92, .3); clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%); box-shadow: inset 0 -4px 0 var(--aqua-edge), inset 0 1px 0 rgba(255, 255, 255, .5); }
.cta small { display: block; font-size: 11.5px; font-weight: 800; opacity: .95; }
.cta .cta-text { text-align: center; line-height: 1.25; }
.cta svg { width: 20px; height: 20px; flex-shrink: 0; }
.cta:active { transform: translateY(1px); box-shadow: inset 0 -2px 0 var(--aqua-edge); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 6px 18px; background: #fff; color: var(--navy); border: 1.5px solid var(--navy); font-weight: 900; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
.btn.wide { width: 100%; }
.btn.danger { color: var(--coral-text); border-color: var(--coral); }
.btn:active { background: var(--track); }
.btn:disabled { color: var(--ink-3); border-color: var(--line-2); background: var(--paper-2); }
.price { flex-shrink: 0; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 92px; min-height: 46px; padding: 4px 14px; background: var(--aqua); color: #fff; font-weight: 900; font-size: 15px; line-height: 1.15; text-shadow: 0 1px 0 rgba(6, 62, 92, .55); clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); box-shadow: inset 0 -3px 0 var(--aqua-edge); }
.price small { font-size: 10.5px; font-weight: 800; }
.price .coin { display: inline-flex; align-items: center; gap: 3px; }
.price .coin svg { width: 15px; height: 15px; color: #FFE7A0; }
.price:disabled { background: var(--track); color: var(--ink-3); text-shadow: none; box-shadow: none; }
.price:disabled .coin svg { color: var(--ink-3); }
.price.done { min-width: 0; padding: 4px 6px; background: none; color: var(--aqua-text); text-shadow: none; box-shadow: none; clip-path: none; font-size: 12.5px; }
.price.done::before { content: ""; width: 18px; height: 18px; margin-bottom: 2px; background: var(--aqua-solid); clip-path: polygon(14% 52%, 0 66%, 38% 100%, 100% 22%, 86% 8%, 38% 72%); }
.tag { display: inline-flex; align-items: center; height: 18px; padding: 0 7px; font-size: 10px; font-weight: 900; letter-spacing: .04em; background: var(--track); color: var(--ink-2); clip-path: var(--para); white-space: nowrap; }
.tag.navy { background: var(--navy); color: #fff; }
.tag.coral { background: var(--coral-fill); color: #fff; }
.tag.gold { background: var(--gold); color: var(--ink); }
.tag.t-phy { background: #FFE1E7; color: var(--coral-text); } .tag.t-mag { background: #DDF5FB; color: var(--aqua-text); } .tag.t-sup { background: #FFF1CC; color: var(--gold-text); }
.gauge { position: relative; height: 10px; background: var(--track); overflow: hidden; transform: skewX(-18deg); box-shadow: inset 0 0 0 1px rgba(27, 42, 94, .08); }
.gauge > i, .gauge > b { position: absolute; inset: 0 auto 0 0; }
.gauge > b { width: var(--g, 100%); background: #fff; opacity: .9; transition: width .5s .3s var(--ease); }
.gauge > i { width: var(--v, 100%); background: var(--fill); transition: width .3s var(--ease); }
.gauge.hp { --fill: var(--hp); } .gauge.mp { --fill: var(--mp); } .gauge.xp { --fill: var(--xp); height: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; font-size: 11px; font-weight: 800; background: #fff; color: var(--ink); border: 1px solid var(--line-2); white-space: nowrap; }
.chip b { font-variant-numeric: tabular-nums; }
.chip.good { border-color: #8EDCEB; background: #EFFAFD; }
.chip.bad { border-color: #FFB4C1; background: #FFF2F4; }
.chip.gold { border-color: #F2D58A; background: #FFF9E8; }
.frame { position: relative; aspect-ratio: 3 / 5; background: var(--navy); box-shadow: 0 0 0 3px #fff, var(--shadow); }
.frame > img, .frame > .art-svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; }
.frame.edge::after { inset: -3px; padding: 3px; }

/* ---------- Title ---------- */
#scr-title { background: var(--iris); }
.title-bg { position: absolute; inset: calc(-1 * (var(--bar-h) + var(--safe-t))) 0 0; opacity: .85; }
.title-bg .scenery { width: 100%; height: 100%; }
.title-logo { position: relative; z-index: 2; margin: 1vh 22px 0; }
.title-logo .band { margin: 0 0 8px -22px; padding-left: 22px; height: 28px; }
.title-logo .band b { font-size: 11.5px; letter-spacing: .26em; }
.wordmark { margin: 0; font-size: clamp(48px, 15vw, 66px); font-weight: 900; font-style: italic; line-height: .92; letter-spacing: -.02em; color: var(--navy); }
.wordmark span { display: block; margin-top: 6px; font-size: 15px; font-style: normal; letter-spacing: .62em; color: var(--ink-2); }
.wordmark-edge { width: 160px; height: 4px; margin: 12px 0 8px; background: var(--edge); }
.title-line { margin: 0; font-size: 14px; font-weight: 800; color: var(--ink-2); }
.cast { position: relative; z-index: 1; flex: 1; min-height: 0; }
.cast .frame { position: absolute; bottom: var(--b); left: var(--x); height: min(var(--h), 100% - var(--b)); max-width: 46%; transform: translateX(-50%); animation: cast-in .7s var(--spring) both; animation-delay: var(--d); }
@keyframes cast-in { from { opacity: 0; transform: translate(-50%, 24px); } }
.cast-name { position: absolute; z-index: 3; left: -6px; right: -6px; bottom: 7%; padding: 2px 0; text-align: center; font-size: 12px; font-weight: 900; color: #fff; background: var(--navy); clip-path: var(--para); }
.title-dock { position: relative; z-index: 3; display: grid; gap: 10px; padding: 12px 22px calc(20px + var(--safe-b)); background: linear-gradient(rgba(255, 255, 255, 0), rgba(255, 255, 255, .88) 30%); }
.title-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }

/* ---------- Select ---------- */
#scr-select .scroll { padding: 6px 16px 12px; }
.pick { display: grid; grid-template-columns: 44% 1fr; gap: 16px; align-items: start; padding-top: 10px; }
.pick .frame { width: 100%; }
.pick-name { margin: 2px 0 0; font-size: 28px; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
.pick-role { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0 0; font-size: 12.5px; font-weight: 800; color: var(--ink-2); }
.pick-tags { margin-top: 10px; }
.pick-mech { margin: 10px 0 0; font-size: 13px; line-height: 1.55; color: var(--ink-2); }
.pick-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; margin-top: 16px; padding: 12px 14px; }
.pick-stat { display: grid; grid-template-columns: 40px 1fr 36px; align-items: center; gap: 8px; font-size: 11px; font-weight: 900; color: var(--ink-3); letter-spacing: .04em; }
.pick-stat b { text-align: right; font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; }
.pick-stat .gauge { height: 6px; --fill: var(--navy-2); }
.pick-skills { margin: 10px 2px 0; font-size: 12px; color: var(--ink-2); }
.pick-skills b { color: var(--ink); }
.rail { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 16px; padding: 0 2px; }
.rail button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; font-weight: 900; color: var(--ink-3); }
.rail .frame { width: 100%; box-shadow: 0 0 0 2px #fff, 0 2px 6px rgba(27, 42, 94, .12); filter: saturate(.55) brightness(1.06); opacity: .8; transition: transform .2s var(--ease), opacity .2s, filter .2s; }
.rail button[aria-checked=true] { color: var(--ink); }
.rail button[aria-checked=true] .frame { opacity: 1; filter: none; transform: translateY(-4px); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--navy), var(--shadow); }
.rail .star-mark { position: absolute; top: -6px; right: -6px; z-index: 3; width: 18px; height: 18px; color: var(--gold); filter: drop-shadow(0 1px 1px rgba(27, 42, 94, .4)); }
.dock { position: relative; z-index: 5; flex-shrink: 0; padding: 10px 16px calc(12px + var(--safe-b)); background: rgba(255, 255, 255, .94); border-top: 1px solid var(--line); }

/* ---------- Town ---------- */
.town-pages { position: relative; flex: 1; min-height: 0; }
.page { position: absolute; inset: 0; display: none; overflow-y: auto; padding: 0 14px 28px; overscroll-behavior: contain; }
#scr-town[data-tab=explore] #page-explore, #scr-town[data-tab=forge] #page-forge, #scr-town[data-tab=skills] #page-skills, #scr-town[data-tab=relics] #page-relics { display: block; }
#page-home { padding: 0; overflow: hidden; flex-direction: column; }
#scr-town[data-tab=home] #page-home { display: flex; }
.home-bg { position: absolute; inset: 0; }
.home-bg .scenery { width: 100%; height: 100%; }
.home-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(238, 241, 247, 0) 45%, rgba(238, 241, 247, .96) 72%); }
/* Lobby: the hero card takes whatever height is left, so the art fills the middle on every screen. */
.home { position: relative; z-index: 1; flex: 1; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto auto auto; gap: 10px; padding: 12px 14px 22px; }
.home-stage { position: relative; min-height: 0; display: flex; justify-content: center; }
.home-glow { position: absolute; left: 50%; top: 50%; width: 120%; aspect-ratio: 1; transform: translate(-50%, -50%); background: repeating-conic-gradient(from 0deg, rgba(255, 255, 255, .55) 0 6deg, transparent 6deg 18deg); -webkit-mask-image: radial-gradient(circle, #000 0, transparent 62%); mask-image: radial-gradient(circle, #000 0, transparent 62%); pointer-events: none; }
.home-card { position: relative; height: 100%; max-height: calc((min(100vw, 480px) - 28px) * 1.15); aspect-ratio: 3 / 5; }
.home-card .frame { width: 100%; height: 100%; }
.lv-medal { position: absolute; z-index: 3; top: -8px; right: -18px; display: grid; place-content: center; width: 60px; height: 60px; border-radius: 50%; text-align: center; background: #fff; color: var(--navy); box-shadow: 0 0 0 3px var(--gold), var(--shadow); }
.lv-medal small { font-size: 9px; font-weight: 900; letter-spacing: .22em; color: var(--ink-3); }
.lv-medal b { font-size: 23px; font-weight: 900; font-style: italic; line-height: 1; }
.hero-name { position: absolute; z-index: 3; left: -18px; bottom: 7%; display: flex; flex-direction: column; padding: 6px 26px 6px 18px; background: var(--navy); color: #fff; clip-path: var(--slant); }
.hero-name b { font-size: 21px; font-weight: 900; line-height: 1.1; }
.hero-name small { font-size: 11px; font-weight: 800; color: #CFE0FF; }
.home-stats { display: grid; gap: 8px; padding: 10px 12px; }
.xp-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; font-size: 11px; font-weight: 900; color: var(--ink-3); }
.xp-row .num { color: var(--ink-2); }
.stat6 { display: grid; grid-template-columns: repeat(6, 1fr); }
.stat6 div { padding: 0 2px; text-align: center; font-size: 9.5px; font-weight: 900; letter-spacing: .06em; color: var(--ink-3); border-left: 1px solid var(--line); }
.stat6 div:first-child { border-left: 0; }
.stat6 b { display: block; margin-top: 1px; font-size: 14.5px; letter-spacing: 0; color: var(--ink); font-variant-numeric: tabular-nums; }
.sub4 { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.notices { display: flex; flex-wrap: wrap; gap: 6px; }
.notice { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 4px 16px 4px 12px; background: #fff; border: 1.5px solid var(--line-2); font-size: 12.5px; font-weight: 900; color: var(--ink); clip-path: var(--para); }
.notice svg { width: 15px; height: 15px; color: var(--gold); }
.notice.go { border-color: var(--coral); }
.notice.go::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--coral); }
.notice b { color: var(--aqua-text); }
.sortie { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 8px 20px 8px 14px; text-align: left; }
.sortie .medal { display: grid; place-items: center; width: 50px; height: 50px; border-radius: 50%; background: #fff; color: var(--navy); font-size: 20px; font-weight: 900; font-style: italic; box-shadow: 0 0 0 3px var(--gold); text-shadow: none; }
.sortie .s-top { display: block; font-size: 10.5px; letter-spacing: .2em; opacity: .92; }
.sortie .s-main { display: block; font-size: 19px; line-height: 1.2; }
.sortie .s-sub { display: inline-flex; align-items: center; gap: 6px; margin-top: 3px; padding: 1px 10px 1px 8px; font-size: 11.5px; background: rgba(9, 45, 85, .5); clip-path: var(--para); text-shadow: none; }
.cycle-card { position: relative; display: grid; gap: 2px; width: 100%; padding: 12px 16px; background: #fff; text-align: left; }
.cycle-card b { font-size: 15px; font-weight: 900; }
.cycle-card span { font-size: 12px; color: var(--ink-2); }

.dungeon { position: relative; display: grid; grid-template-columns: 56px 1fr 76px; align-items: stretch; width: 100%; min-height: 88px; margin-bottom: 8px; text-align: left; background: #fff; border: 1px solid var(--line); box-shadow: 0 2px 6px rgba(27, 42, 94, .06); overflow: hidden; }
.dungeon-no { display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--navy); color: #fff; font-size: 22px; font-weight: 900; font-style: italic; line-height: 1; clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
.dungeon-no small { font-size: 8.5px; font-style: normal; letter-spacing: .16em; color: #CFE0FF; margin-bottom: 3px; }
.dungeon-info { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 8px 8px 8px 12px; }
.dungeon-name { font-size: 16px; font-weight: 900; line-height: 1.25; }
.dungeon-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 11.5px; font-weight: 800; color: var(--ink-3); }
.dungeon-art { position: relative; overflow: hidden; clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%); background: var(--navy); }
.dungeon-art > img, .dungeon-art > .art-svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; }
.dungeon.is-rec { border-color: var(--coral); box-shadow: 0 0 0 1px var(--coral), 0 4px 10px rgba(240, 86, 110, .14); }
.dungeon.is-rec .dungeon-no { background: var(--coral-fill); }
.dungeon.is-rec .dungeon-no small { color: #fff; }
.fit { font-size: 11px; font-weight: 900; }
.fit.ok { color: var(--aqua-text); } .fit.low { color: var(--coral-text); } .fit.easy { color: var(--ink-3); }
.dungeon .ribbon { position: absolute; top: 0; right: 0; z-index: 2; padding: 2px 10px 2px 14px; font-size: 9.5px; font-weight: 900; letter-spacing: .16em; background: var(--gold); color: var(--ink); clip-path: var(--slant-l); }

.item { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; margin-bottom: 8px; background: #fff; border: 1px solid var(--line); box-shadow: 0 2px 6px rgba(27, 42, 94, .05); }
.item-body { flex: 1; min-width: 0; }
.item-icon { flex-shrink: 0; display: grid; place-items: center; width: 44px; height: 44px; background: var(--navy); color: #fff; clip-path: var(--cut); }
.item-icon svg { width: 22px; height: 22px; }
.item-title { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 15px; font-weight: 900; line-height: 1.3; }
.item-sub { margin: 3px 0 0; font-size: 12.5px; line-height: 1.45; color: var(--ink-2); }
.item-sub b { color: var(--ink); }
.pips { display: flex; gap: 3px; margin: 7px 0 5px; }
.pips i { width: 16px; height: 6px; background: var(--track); transform: skewX(-24deg); }
.pips i.on { background: var(--aqua-solid); }
.item.is-ult { border-color: transparent; }
.item.r-epic { border-left: 4px solid #FF9DBE; }
.item.r-normal { border-left: 4px solid var(--navy); }
.item.r-legend { border-color: transparent; }
.gem { flex-shrink: 0; width: 34px; height: 34px; }
.empty { padding: 28px 14px; text-align: center; font-size: 13px; color: var(--ink-3); background: #fff; border: 1.5px dashed var(--line-2); }
.reroll { display: grid; gap: 8px; padding: 14px; }
.reroll p { margin: 0; font-size: 12.5px; color: var(--ink-2); }

.nav { position: relative; z-index: 20; display: grid; grid-template-columns: 1fr 1fr 1.1fr 1fr 1fr; height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b); flex-shrink: 0; background: #fff; border-top: 2px solid var(--navy); }
#app:not([data-screen=town]) .nav { display: none; }
.nav button { position: relative; z-index: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 11px; font-weight: 900; color: var(--ink-3); }
.nav button svg { width: 22px; height: 22px; }
.nav button .en { font-size: 7.5px; letter-spacing: .12em; opacity: .75; }
.nav button[aria-selected=true]:not(.medal-tab) { color: #fff; }
.nav button[aria-selected=true]:not(.medal-tab)::before { content: ""; position: absolute; inset: 6px 3px; z-index: -1; background: var(--navy); clip-path: var(--para); }
.medal-tab { color: var(--navy) !important; }
.medal-tab .disc { display: grid; place-items: center; width: 46px; height: 46px; margin-top: -14px; border-radius: 50%; background: var(--aqua); color: #fff; box-shadow: 0 0 0 4px #fff, 0 0 0 6px var(--navy), 0 6px 14px rgba(27, 42, 94, .3); }
.medal-tab .disc svg { width: 22px; height: 22px; }
.medal-tab[aria-selected=true] .disc { box-shadow: 0 0 0 4px #fff, 0 0 0 6px var(--gold), 0 6px 14px rgba(27, 42, 94, .3); }

/* ---------- Battle ---------- */
#scr-battle { background: #fff; }
.stage { --stage-h: clamp(228px, 37dvh, 330px); position: relative; flex-shrink: 0; height: var(--stage-h); overflow: hidden; }
.stage-bg { position: absolute; inset: 0; }
.stage-bg .scenery { width: 100%; height: 100%; }
.stage::before { content: ""; position: absolute; z-index: 1; left: -10%; right: -10%; top: 50%; height: 38px; background: linear-gradient(90deg, rgba(255, 183, 211, .5), rgba(255, 229, 156, .5), rgba(158, 223, 255, .5)); transform: rotate(-12deg); pointer-events: none; }
.foe-card { position: absolute; z-index: 2; right: 14px; top: 12px; height: calc(var(--stage-h) * .72); }
.me-card { position: absolute; z-index: 3; left: 14px; bottom: 12px; height: calc(var(--stage-h) * .54); }
.foe-card .frame, .me-card .frame { height: 100%; width: auto; }
.foe-card.is-boss .frame { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--gold), var(--shadow); }
.boss-tag { position: absolute; z-index: 4; left: -10px; top: 10px; padding: 2px 14px 2px 10px; font-size: 11px; font-weight: 900; letter-spacing: .16em; color: #fff; background: var(--coral-fill); clip-path: var(--slant); }
.plate { position: absolute; z-index: 4; padding: 8px 10px; background: rgba(255, 255, 255, .96); box-shadow: var(--shadow); }
.foe-plate { left: 12px; top: 12px; width: calc(100% - (var(--stage-h) * .72 * .6) - 38px); border-top: 3px solid var(--coral); }
.me-plate { right: 12px; bottom: 12px; width: calc(100% - (var(--stage-h) * .54 * .6) - 38px); border-bottom: 3px solid var(--aqua-solid); }
.plate-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 8px; }
.plate-name { font-size: 15.5px; font-weight: 900; line-height: 1.2; }
.plate-name small { margin-left: 4px; font-size: 11px; font-weight: 800; color: var(--ink-3); }
.plate-hp { font-size: 12px; font-weight: 900; font-variant-numeric: tabular-nums; }
.plate .gauge { margin-top: 5px; }
.plate-mp { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; margin-top: 5px; }
.plate-mp .gauge { margin: 0; height: 6px; }
.plate-mp b { font-size: 10.5px; font-weight: 900; color: var(--aqua-text); font-variant-numeric: tabular-nums; }
.plate .chips { margin-top: 6px; }
.intent { display: flex; align-items: center; gap: 6px; margin-top: 6px; padding: 3px 14px 3px 8px; background: var(--navy); color: #fff; font-size: 11.5px; font-weight: 900; clip-path: var(--slant); }
.intent svg { width: 13px; height: 13px; flex-shrink: 0; color: var(--gold); }
.intent.now { background: var(--coral-fill); }
.intent.now svg { color: #fff; }
.res { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 9px; font-size: 11px; font-weight: 900; background: var(--navy); color: #fff; clip-path: var(--para); }
.res i { width: 7px; height: 7px; background: rgba(255, 255, 255, .3); transform: rotate(45deg); }
.res i.on { background: var(--gold); }
.hit { animation: hit .34s linear; }
@keyframes hit { 0% { filter: brightness(2.4); } 20% { transform: translateX(-7px); } 45% { transform: translateX(6px); filter: brightness(1); } 70% { transform: translateX(-3px); } 100% { transform: none; } }
.lunge-r { animation: lunge-r .32s var(--ease); } .lunge-l { animation: lunge-l .32s var(--ease); }
@keyframes lunge-r { 40% { transform: translate(18px, -12px); } } @keyframes lunge-l { 40% { transform: translate(-18px, 12px); } }
.pops { position: absolute; inset: 0; z-index: 8; pointer-events: none; }
.pop { position: absolute; transform: translate(-50%, -50%); font-size: 30px; font-weight: 900; font-style: italic; color: #fff; white-space: nowrap; -webkit-text-stroke: 6px var(--navy); paint-order: stroke fill; animation: pop .95s var(--ease) forwards; }
.pop small { display: block; margin: 0 auto 2px; width: max-content; padding: 1px 8px; font-size: 11px; font-style: normal; letter-spacing: .22em; -webkit-text-stroke: 0; color: var(--ink); background: var(--gold); clip-path: var(--para); }
.pop.crit { font-size: 42px; color: #FFE7A0; }
.pop.heal { color: #C8F5FF; -webkit-text-stroke-color: var(--aqua-text); }
.pop.miss { font-size: 20px; letter-spacing: .14em; -webkit-text-stroke-color: var(--ink-3); }
.pop.me { color: #FFD9E0; -webkit-text-stroke-color: #9E2340; }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 16% { opacity: 1; transform: translate(-50%, -60%) scale(1.14); } 30% { transform: translate(-50%, -60%) scale(1); } 75% { opacity: 1; transform: translate(-50%, -76%); } 100% { opacity: 0; transform: translate(-50%, -92%); } }
.cutin { position: absolute; inset: 0; z-index: 12; pointer-events: none; overflow: hidden; --cut-t: 1.15s; }
.cutin::before { content: ""; position: absolute; inset: 0; background: rgba(255, 255, 255, .55); animation: veil var(--cut-t) linear forwards; }
@keyframes veil { 0%, 100% { opacity: 0; } 15%, 85% { opacity: 1; } }
.cutin-band { position: absolute; left: -12%; right: -12%; top: 50%; height: 44%; transform: translateY(-50%) skewY(-8deg); background: var(--navy); overflow: hidden; animation: band-in var(--cut-t) var(--ease) forwards; }
.cutin-band::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(100deg, transparent 0 22px, rgba(255, 255, 255, .06) 22px 24px); }
.cutin-edge { position: absolute; left: -12%; right: -12%; height: 4px; top: 50%; background: var(--edge); transform: skewY(-8deg); animation: band-in var(--cut-t) var(--ease) forwards; }
.cutin-edge.a { margin-top: calc(var(--stage-h) * -.22 - 8px); } .cutin-edge.b { margin-top: calc(var(--stage-h) * .22 + 4px); }
.cutin.foe .cutin-edge { background: var(--coral); }
.cutin-art { position: absolute; z-index: 1; top: 5%; bottom: 5%; left: 4%; aspect-ratio: 3 / 5; clip-path: polygon(14% 0, 100% 0, 86% 100%, 0 100%); background: var(--navy); animation: art-in var(--cut-t) var(--ease) forwards; }
.cutin.foe .cutin-art { left: auto; right: 4%; animation-name: art-in-r; }
.cutin-art > img, .cutin-art > .art-svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 14%; }
.cutin-text { position: absolute; z-index: 2; left: calc(4% + var(--stage-h) * .54); right: 5%; top: 50%; transform: translateY(-50%); text-align: left; color: #fff; animation: text-in var(--cut-t) var(--ease) forwards; }
.cutin.foe .cutin-text { left: 5%; right: calc(4% + var(--stage-h) * .54); text-align: right; }
.cutin-text small { display: block; margin-bottom: 4px; font-size: 11px; font-weight: 900; letter-spacing: .3em; color: var(--gold); }
.cutin-text b { display: block; font-size: clamp(22px, 7vw, 32px); font-weight: 900; font-style: italic; line-height: 1.12; word-break: keep-all; text-shadow: 0 2px 10px rgba(0, 0, 0, .3); }
@keyframes band-in { 0% { opacity: 0; clip-path: inset(0 100% 0 0); } 16% { opacity: 1; clip-path: inset(0 0 0 0); } 84% { opacity: 1; clip-path: inset(0 0 0 0); } 100% { opacity: 0; clip-path: inset(0 0 0 100%); } }
@keyframes art-in { 0% { transform: translateX(-60%); opacity: 0; } 20% { transform: none; opacity: 1; } 84% { transform: translateX(4%); opacity: 1; } 100% { transform: translateX(18%); opacity: 0; } }
@keyframes art-in-r { 0% { transform: translateX(60%); opacity: 0; } 20% { transform: none; opacity: 1; } 84% { transform: translateX(-4%); opacity: 1; } 100% { transform: translateX(-18%); opacity: 0; } }
@keyframes text-in { 0% { transform: translateY(-50%) translateX(30%); opacity: 0; } 26% { transform: translateY(-50%); opacity: 1; } 84% { opacity: 1; } 100% { transform: translateY(-50%) translateX(-10%); opacity: 0; } }
.log { position: relative; flex-shrink: 0; height: clamp(80px, 12dvh, 104px); padding: 6px 50px 6px 14px; overflow: hidden; background: var(--paper-2); border-top: 2px solid var(--navy); border-bottom: 1px solid var(--line); font-size: 12.5px; line-height: 19px; }
.log-lines { position: absolute; left: 14px; right: 50px; bottom: 6px; -webkit-mask-image: linear-gradient(transparent, #000 18%); mask-image: linear-gradient(transparent, #000 18%); }
.log.open { position: absolute; z-index: 30; inset: 0; height: auto; padding: 52px 16px 16px; overflow-y: auto; background: rgba(255, 255, 255, .98); }
.log.open .log-lines { position: static; -webkit-mask-image: none; mask-image: none; }
.log-line { color: var(--ink-2); }
.log-line b { color: var(--ink); }
.log-line .dmg { color: var(--coral-text); font-weight: 900; }
.log-line .heal { color: var(--aqua-text); font-weight: 900; }
.log-line.l-turn { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 9.5px; line-height: 15px; font-weight: 900; letter-spacing: .2em; color: var(--ink-3); }
.log-line.l-turn::after { content: ""; flex: 1; height: 1px; background: var(--line-2); }
.log-line.l-dmg, .log-line.l-rose, .log-line.l-lose { color: var(--coral-text); }
.log-line.l-heal, .log-line.l-star, .log-line.l-mag { color: var(--aqua-text); }
.log-line.l-holy, .log-line.l-fire, .log-line.l-win { color: var(--gold-text); }
.log-toggle { position: absolute; z-index: 2; right: 8px; top: 7px; display: grid; place-items: center; width: 34px; height: 34px; color: var(--navy); background: #fff; border: 1.5px solid var(--line-2); border-radius: 8px; }
.log.open .log-toggle { position: absolute; top: 10px; right: 12px; }
.log-toggle svg { width: 16px; height: 16px; }
.controls { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.ctl-head { display: flex; align-items: center; gap: 6px; padding: 8px 14px 6px; }
.ctl-head .label { flex: 1; font-size: 10.5px; font-weight: 900; letter-spacing: .22em; color: var(--ink-3); }
.toggle { min-width: 46px; height: 30px; padding: 0 12px; font-size: 12px; font-weight: 900; color: var(--navy); background: #fff; box-shadow: inset 0 0 0 1.5px var(--line-2); clip-path: var(--para); }
.toggle[aria-pressed=true] { color: #fff; background: var(--navy); box-shadow: none; }
.toggle.auto[aria-pressed=true] { background: var(--coral); }
.skill-grid { display: grid; grid-template-columns: 1fr 1fr; align-content: start; gap: 6px; padding: 2px 14px calc(14px + var(--safe-b)); overflow-y: auto; }
.sk { position: relative; display: flex; flex-direction: column; justify-content: center; min-height: 56px; padding: 6px 10px 6px 15px; text-align: left; background: #fff; border: 1px solid var(--line-2); box-shadow: 0 2px 0 var(--line); }
.sk::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--tone); }
.sk.t-phy { --tone: var(--coral); --tone-d: var(--coral-text); } .sk.t-mag { --tone: var(--aqua-solid); --tone-d: var(--aqua-text); } .sk.t-sup { --tone: var(--gold); --tone-d: var(--gold-text); }
.sk-top { display: flex; align-items: center; gap: 6px; }
.sk-top .ico { width: 15px; height: 15px; flex-shrink: 0; color: var(--tone-d); }
.sk-top .ico svg { width: 15px; height: 15px; }
.sk-name { flex: 1; min-width: 0; font-size: 14px; font-weight: 900; line-height: 1.2; word-break: keep-all; }
.sk-cost { flex-shrink: 0; padding: 1px 7px; font-size: 10.5px; font-weight: 900; color: var(--aqua-text); background: #E4F7FC; font-variant-numeric: tabular-nums; clip-path: var(--para); }
.sk-desc { display: none; margin-top: 3px; font-size: 11.5px; line-height: 1.35; color: var(--ink-2); }
.controls.show-desc .sk-desc { display: block; }
.sk.ult { grid-column: span 2; min-height: 58px; background: var(--navy); border-color: var(--navy); box-shadow: 0 2px 0 #0E1838; color: #fff; }
.sk.ult::before { background: var(--edge-v); }
.sk.ult .ico { color: var(--gold); }
.sk.ult .sk-cost { color: var(--ink); background: var(--gold); }
.sk.ult .sk-desc { color: #D5DEF7; }
.ult-mark { font-size: 9.5px; font-weight: 900; letter-spacing: .2em; color: var(--gold); }
.sk:disabled { background: var(--paper-2); border-color: var(--line); box-shadow: none; }
.sk:disabled .sk-name, .sk:disabled .sk-desc { color: var(--ink-3); }
.sk:disabled .sk-cost { color: var(--ink-3); background: var(--track); }
.sk:disabled .sk-cost.short { color: var(--coral-text); background: #FFE6EB; }
.sk.ult:disabled { background: #4A5683; border-color: #4A5683; }
.sk.ult:disabled .sk-name { color: #DCE3F7; }
.sk.ult:disabled .sk-cost.short { color: #fff; background: var(--coral-fill); }
.sk.ready { box-shadow: 0 0 0 2px var(--gold), 0 2px 0 var(--line); }
.sk:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
.pass { grid-column: span 2; min-height: 56px; background: #FFF2F4; border: 1.5px solid var(--coral); color: var(--coral-text); font-weight: 900; }
#scr-battle[aria-busy=true] .sk, #scr-battle[aria-busy=true] .pass { pointer-events: none; }

/* ---------- Result: the acquisition moment (full-bleed iris, diagonal navy band) ---------- */
.result { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; overflow: hidden; background: var(--iris); animation: fadein .3s var(--ease); }
.result.lose { background: linear-gradient(160deg, #F4F5FA, #E2E5EE); }
@keyframes fadein { from { opacity: 0; } }
.result-rays { position: absolute; inset: -30%; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255, 255, 255, .55) 0 5deg, transparent 5deg 15deg); -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0, transparent 60%); mask-image: radial-gradient(circle at 50% 50%, #000 0, transparent 60%); animation: spin 40s linear infinite; transform-origin: 50% 50%; left: -50%; top: -45%; width: 160%; height: 120%; }
.result.lose .result-rays { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.result-top { position: relative; flex: 1; min-height: 0; }
.result-art { position: absolute; left: 7%; top: calc(16px + var(--safe-t)); bottom: 54px; animation: art-rise .6s var(--spring); }
.result-art .frame { height: 100%; width: auto; max-width: 58vw; }
@keyframes art-rise { from { opacity: 0; transform: translateY(30px) scale(.94); } }
.result.lose .result-art .frame { filter: grayscale(.75) brightness(1.06); }
.result-word { position: absolute; z-index: 2; right: 14px; top: calc(24px + var(--safe-t)); margin: 0; font-size: clamp(40px, 13vw, 60px); font-weight: 900; font-style: italic; line-height: .9; text-align: right; color: var(--navy); -webkit-text-stroke: 7px #fff; paint-order: stroke fill; filter: drop-shadow(0 4px 10px rgba(27, 42, 94, .18)); animation: word-in .55s .1s var(--spring) both; }
.result-word small { display: inline-block; margin-top: 10px; padding: 2px 12px; font-size: 11px; font-style: normal; letter-spacing: .3em; color: #fff; background: var(--navy); -webkit-text-stroke: 0; clip-path: var(--para); }
@keyframes word-in { from { opacity: 0; transform: translateX(30px); } }
.result-spark { position: absolute; z-index: 2; color: var(--gold); animation: twinkle 1.6s ease-in-out infinite; }
.result-spark svg { width: 100%; height: 100%; }
@keyframes twinkle { 50% { transform: scale(.6); opacity: .6; } }
.result-band { position: absolute; z-index: 3; left: -4%; right: -4%; bottom: 18px; display: flex; flex-direction: column; align-items: flex-end; padding: 9px 24px 9px 40%; background: var(--navy); color: #fff; transform: skewY(-6deg); animation: band-rise .5s .15s var(--ease) both; }
.result-band::before, .result-band::after { content: ""; position: absolute; left: 0; right: 0; height: 4px; background: var(--edge); }
.result-band::before { top: -7px; } .result-band::after { bottom: -7px; }
.result-band > * { transform: skewY(6deg); }
.result-band b { font-size: 18px; font-weight: 900; }
.result-band span { font-size: 11.5px; font-weight: 800; color: #CFE0FF; }
.result.lose .result-band { background: #4A5683; }
.result.lose .result-band::before, .result.lose .result-band::after { background: #C6CCDD; }
@keyframes band-rise { from { opacity: 0; transform: skewY(-6deg) translateX(-30px); } }
.result-body { position: relative; z-index: 2; flex-shrink: 0; max-height: 48dvh; overflow-y: auto; padding: 4px 16px calc(16px + var(--safe-b)); }
.rewards { display: grid; gap: 1px; background: var(--line); box-shadow: var(--shadow); }
.reward { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; background: #fff; font-size: 13px; font-weight: 800; color: var(--ink-2); animation: row-in .4s var(--ease) both; animation-delay: calc(.35s + var(--i, 0) * .08s); }
@keyframes row-in { from { opacity: 0; transform: translateY(8px); } }
.reward b { font-size: 17px; font-weight: 900; font-style: italic; color: var(--ink); font-variant-numeric: tabular-nums; }
.reward.level { background: var(--navy); color: #CFE0FF; }
.reward.level b { color: var(--gold); }
.reward.art { display: block; position: relative; }
.reward.art .t { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; font-weight: 900; color: var(--ink); }
.reward.art small { display: block; margin-top: 2px; font-weight: 700; color: var(--ink-2); }
.result-actions { display: grid; grid-template-columns: 1fr 1.5fr; gap: 8px; margin-top: 12px; }
.countdown { display: inline-grid; place-items: center; min-width: 22px; height: 22px; margin-left: 4px; font-size: 12px; font-style: normal; background: rgba(9, 45, 85, .4); border-radius: 50%; text-shadow: none; }

/* ---------- Dialog & toast ---------- */
.veil { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px; background: rgba(27, 42, 94, .38); animation: fadein .2s; }
.dialog { position: relative; width: 100%; max-width: 360px; max-height: 86dvh; overflow-y: auto; padding: 0 18px 16px; background: #fff; box-shadow: 0 12px 30px rgba(27, 42, 94, .3); animation: rise .25s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.dialog-head { position: relative; margin: 0 -18px 14px; padding: 12px 18px; background: var(--navy); color: #fff; }
.dialog-head::after { content: ""; position: absolute; left: 0; right: 0; bottom: -3px; height: 3px; background: var(--edge); }
.dialog-head h3 { margin: 0; font-size: 16px; font-weight: 900; }
.dialog p { margin: 0 0 6px; font-size: 13.5px; color: var(--ink-2); white-space: pre-line; }
.dialog-actions { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; margin-top: 16px; }
.dialog .cta { min-height: 48px; font-size: 15px; }
.set-group { margin-top: 12px; }
.set-group > .en { margin-bottom: 4px; color: var(--ink-3); opacity: 1; }
.row-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 46px; font-size: 14px; font-weight: 800; border-bottom: 1px solid var(--line); }
.switch-ui { position: relative; width: 50px; height: 26px; background: var(--track); border-radius: 13px; box-shadow: inset 0 0 0 1.5px var(--line-2); transition: background .2s; }
.switch-ui::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(27, 42, 94, .35); transition: transform .2s var(--ease); }
[aria-checked=true] .switch-ui { background: var(--aqua-solid); box-shadow: none; }
[aria-checked=true] .switch-ui::after { transform: translateX(24px); }
.set-actions { display: grid; gap: 8px; margin-top: 8px; }
.meta-line { margin-top: 12px; font-size: 12px; color: var(--ink-3); }
#toast { position: fixed; z-index: 70; left: 50%; bottom: calc(92px + var(--safe-b)); max-width: 86%; padding: 9px 20px; background: var(--navy); color: #fff; font-size: 13px; font-weight: 800; clip-path: var(--para); opacity: 0; transform: translate(-50%, 10px); transition: opacity .2s, transform .25s var(--ease); pointer-events: none; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
    .result-rays { display: none; }
}

<script>
/* =========================================
   2. 전투 규칙 (Battle rules)
   예전 new.html의 계산을 그대로 옮겼다. 고친 곳에는 이유를 남겼다.
   ========================================= */
let player = {};
let gameState = { gold: 10000, learnedSkills: [], manaLevel: 0, equipWeapon: 0, equipArmor: 0, currentEventDungeon: null };
let currentEnemy = null;
let turnCount = 0;
let buffs = { player: {}, enemy: {} };
let roseStack = 0;

function checkHiddenUnlock() {
    const required = ['hestia', 'dream_choco', 'blue_moon', 'dragon_scale', 'pharaoh', 'dark_pendant'];
    const unlocks = getBossArtifactUnlocks();
    // 모든 필수 전설 유물이 unlock 되어있는지 확인
    return required.every(id => unlocks.includes(id));
}

function setupEventDungeon() {
    let cycle = getCycleCount();
    // 6회차(인덱스 5)부터는 등장하지 않음
    if(cycle >= 5) {
        gameState.currentEventDungeon = null;
        return;
    }

    let usedEvents = JSON.parse(localStorage.getItem('turnRpgUsedEvents') || '[]');
    const ALL_EVENTS = ['dessert', 'magic', 'dragon', 'ruins', 'time'];

    // 현재 회차에 이미 할당된 이벤트가 있는지 확인 (재시작 시 유지)
    // 하지만 usedEvents는 문자열 배열이므로, 순서대로 할당되었다고 가정하거나,
    // cycle 인덱스를 사용하여 매핑해야 함.
    // 단순하게: usedEvents의 길이는 현재 진행한 회차 수와 같아야 함 (0회차 -> 1개 할당)
    // 만약 usedEvents.length > cycle 이면 이미 할당된 것.
    // 만약 usedEvents.length <= cycle 이면 새로 할당해야 함.

    // [보정] 하드 리셋 시 usedEvents도 초기화해야 함 (triggerReset('hard')에서 처리 필요)

    if(usedEvents.length > cycle) {
        // 이미 할당됨
        gameState.currentEventDungeon = usedEvents[cycle];
    } else {
        // 새로 할당
        let available = ALL_EVENTS.filter(e => !usedEvents.includes(e));
        if(available.length > 0) {
            let pick = available[Math.floor(Math.random() * available.length)];
            usedEvents.push(pick);
            localStorage.setItem('turnRpgUsedEvents', JSON.stringify(usedEvents));
            gameState.currentEventDungeon = pick;
        } else {
            gameState.currentEventDungeon = null; // 남은 게 없음
        }
    }
}

function initArtifactsWithNGPlus() {
    // 기본 유물 목록으로 복구
    ARTIFACTS = JSON.parse(JSON.stringify(BASE_ARTIFACTS));

    // 클리어 기록 확인
    const clears = getClearHistory(); // ['zeke', 'luna', ...]

    // 1. 공통 유물 추가 (100% 확률)
    if(clears.length > 0) {
        clears.forEach(char => {
            if(NEW_ARTIFACTS[char]) {
                // 중복 방지 체크 (혹시 모르니)
                if(!ARTIFACTS.find(a => a.id === NEW_ARTIFACTS[char].id)) {
                    ARTIFACTS.push(NEW_ARTIFACTS[char]);
                }
            }
        });

        // 2. 전설 유물 강화 (클리어 시 100% 확률로 강화)
        clears.forEach(char => {
            upgradeLegendaryArtifact(char);
        });
    }

    // 3. 보스 드랍 유물 해금 목록 추가 (리롤 풀에 추가) - 클리어 여부와 무관하게 적용
    let bossUnlocks = getBossArtifactUnlocks();
    bossUnlocks.forEach(id => {
        // BOSS_DROP_ARTIFACTS에서 찾아서 추가
        let drop = null;
        for(let k in BOSS_DROP_ARTIFACTS) {
            if(BOSS_DROP_ARTIFACTS[k].id === id) drop = BOSS_DROP_ARTIFACTS[k];
        }
        if(drop && !ARTIFACTS.find(a => a.id === drop.id)) {
            ARTIFACTS.push(drop);
        }
    });

    // 4. 5회차(Run 6) 이상일 경우 특정 에픽 유물 진화 (마안, 얼음의심장)
    let cycle = getCycleCount();
    if(cycle >= 5) {
        // 마안 -> 진: 마안
        let eye = ARTIFACTS.find(a => a.id === 'demon_eye');
        if(eye) {
            eye.id = 'demon_eye_legend';
            eye.name = "진: 마안";
            eye.desc = "전투 개시 후 5턴간 물공/마공 +150%";
            eye.val = 1.5;
            eye.effect = 'demon_eye_legend';
            eye.rarity = 'legend';
        }
        // 얼음의심장 -> 진: 얼음의심장
        let heart = ARTIFACTS.find(a => a.id === 'heart_ice');
        if(heart) {
            heart.id = 'heart_ice_legend';
            heart.name = "진: 얼음의 심장";
            heart.desc = "체력 50% 미만에서 물방/마방 +150%";
            heart.val = 1.5;
            heart.effect = 'heart_ice_legend';
            heart.rarity = 'legend';
        }
    }
}

function getBossArtifactUnlocks() {
    let unlocks = localStorage.getItem('turnRpgBossDrops');
    return unlocks ? JSON.parse(unlocks) : [];
}

function unlockBossArtifact(id) {
    let unlocks = getBossArtifactUnlocks();
    if(!unlocks.includes(id)) {
        unlocks.push(id);
        localStorage.setItem('turnRpgBossDrops', JSON.stringify(unlocks));
    }
}

function upgradeLegendaryArtifact(char) {
    // 지크 -> 황금의태양
    if(char === 'zeke') {
        let art = ARTIFACTS.find(a => a.id === 'golden_sun');
        if(art) {
            art.name = "진: 황금의 태양";
            art.desc = "공/마공 +70%, 마법방어 -30%";
            art.val = 0.70; // recalcAllStats에서 별도 처리 필요하지만 val도 업데이트
            art.effect = 'golden_sun_legend'; // 효과 ID 변경
            art.rarity = 'legend';
        }
    }
    // 루나 -> 벨제뷔트
    if(char === 'luna') {
        let art = ARTIFACTS.find(a => a.id === 'beelzebub');
        if(art) {
            art.name = "진: 마신기 벨제뷔트";
            art.desc = "공격 +60% / 치명피해 +70%, 방어 -30%";
            art.val = 0.60;
            art.effect = 'beelzebub_legend';
            art.rarity = 'legend';
        }
    }
    // 자스민 -> 아이리스
    if(char === 'jasmine') {
        let art = ARTIFACTS.find(a => a.id === 'iris');
        if(art) {
            art.name = "진: 신기 아이리스";
            art.desc = "마공/마방 +70%";
            art.val = 0.70;
            art.effect = 'iris_legend';
            art.rarity = 'legend';
        }
    }
    // 여왕 -> 로열크라운
    if(char === 'queen') {
        let art = ARTIFACTS.find(a => a.id === 'royal_crown');
        if(art) {
            art.name = "진: 로열 크라운";
            art.desc = "올스탯 +30% (여왕: 시작시 장미+10)";
            art.val = 0.30;
            art.effect = 'royal_crown_legend';
            art.rarity = 'legend';
        }
    }
    // 루미 -> 수호천사의 깃털
    if(char === 'rumi') {
        let art = ARTIFACTS.find(a => a.id === 'guardian_angel');
        if(art) {
            art.name = "진: 수호천사의 깃털";
            art.desc = "사망 시 1회 부활 (HP 100%)";
            art.val = 1.0;
            art.effect = 'guardian_angel_legend';
            art.rarity = 'legend';
        }

}

function getClearHistory() {
    let history = localStorage.getItem('turnRpgClears');
    return history ? JSON.parse(history) : [];
}

function getCycleCount() {
    let cycle = localStorage.getItem('turnRpgCycle');
    return cycle ? parseInt(cycle) : 0;
}

function incrementCycle() {
    let cycle = getCycleCount();
    localStorage.setItem('turnRpgCycle', cycle + 1);
}

function getMaxLevel() {
    return Math.min(30, 25 + getCycleCount());
}

function saveClear(charKey) {
    let history = getClearHistory();
    if(!history.includes(charKey)) {
        history.push(charKey);
        localStorage.setItem('turnRpgClears', JSON.stringify(history));
    }
}

function recalcAllStats() {
    if(!player || !player.baseStats) return;

    let growth = 1.0 + (player.level - 1) * 0.1;

    // Base Calculation
    let baseMaxHp = Math.floor(player.baseStats.hp * growth);
    let baseMaxMp = player.fixedMp ? player.baseStats.mp : Math.floor(player.baseStats.mp * growth);
    let baseAtk = Math.floor(player.baseStats.atk * growth);
    let baseMatk = Math.floor(player.baseStats.matk * growth);
    let baseDef = Math.floor(player.baseStats.def * growth);
    let baseMdef = Math.floor(player.baseStats.mdef * growth);

    // Equipments
    for(let i=0; i<gameState.equipWeapon; i++) {
        let s = EQUIP_STATS[player.charKey].weapon[i];
        baseAtk += s.atk;
        baseMatk += s.matk;
    }
    for(let i=0; i<gameState.equipArmor; i++) {
        let s = EQUIP_STATS[player.charKey].armor[i];
        baseDef += s.def;
        baseMdef += s.mdef;
    }

    player.baseCrit = CHAR_DATA[player.charKey].baseCrit;
    player.baseEva = CHAR_DATA[player.charKey].baseEva;
    player.baseCritDmg = CHAR_DATA[player.charKey].baseCritDmg;

    // 대현자 히든 기믹
    if(player.charKey === 'rumi') {
        player.baseCrit += (player.level - 1) * 0.01;
    }
    // 루나 히든 패시브
    if(player.charKey === 'luna') {
        player.baseCritDmg += (player.level - 1) * 0.01;
    }

    // Additive Modifiers
    let hpPer = 0.0, mpPer = 0.0, atkPer = 0.0, matkPer = 0.0, defPer = 0.0, mdefPer = 0.0;

    // Artifacts
    player.artifacts.forEach(art => {
        if(art.effect === 'stat_hp') hpPer += art.val;
        if(art.effect === 'stat_mp') mpPer += art.val;
        if(art.effect === 'stat_atk') atkPer += art.val;
        if(art.effect === 'stat_matk') matkPer += art.val;
        if(art.effect === 'stat_def') defPer += art.val;
        if(art.effect === 'stat_mdef') mdefPer += art.val;

        if(art.effect === 'stat_crit') player.baseCrit += art.val;
        if(art.effect === 'stat_eva') player.baseEva += art.val;

        if(art.effect === 'stat_def_mdef') { defPer += art.val; mdefPer += art.val; }
        if(art.effect === 'crit_critdmg') { player.baseCrit += 0.1; player.baseCritDmg += 0.3; }
        if(art.effect === 'dark_pendant') { player.baseCrit += 0.1; player.baseCritDmg += 1.0; }
        if(art.effect === 'matk_mp') { matkPer += art.val; mpPer += art.val; }
        if(art.effect === 'atk_matk') { atkPer += art.val; matkPer += art.val; }
        if(art.effect === 'atk_hp') { atkPer += art.val; hpPer += art.val; }

        if(art.effect === 'dragon_heart') { hpPer += 0.4; atkPer += 0.2; }
        if(art.effect === 'ancient_book') { mpPer += 0.4; matkPer += 0.2; }

        if(art.effect === 'golden_sun') { atkPer += 0.40; matkPer += 0.40; mdefPer -= 0.2; }
        if(art.effect === 'golden_sun_legend') { atkPer += 0.70; matkPer += 0.70; mdefPer -= 0.3; }

        if(art.effect === 'beelzebub') { atkPer += 0.5; defPer -= 0.3; player.baseCritDmg += 0.5; }
        if(art.effect === 'beelzebub_legend') { atkPer += 0.6; defPer -= 0.3; player.baseCritDmg += 0.7; }

        if(art.effect === 'iris') { matkPer += 0.5; mdefPer += 0.5; }
        if(art.effect === 'iris_legend') { matkPer += 0.7; mdefPer += 0.7; }

        if(art.effect === 'all_stat') { hpPer+=0.2; mpPer+=0.2; atkPer+=0.2; matkPer+=0.2; defPer+=0.2; mdefPer+=0.2; }
        if(art.effect === 'royal_crown_legend') { hpPer+=0.3; mpPer+=0.3; atkPer+=0.3; matkPer+=0.3; defPer+=0.3; mdefPer+=0.3; }

        if(art.effect === 'blood_pact') { hpPer -= 0.2; atkPer += 0.3; matkPer += 0.3; }
        if(art.effect === 'reckless') { defPer -= 0.3; player.baseCritDmg += art.val; }

        // New Boss Artifacts
        // Description and value say +50%; the old code added +100%.
        if(art.effect === 'hestia') {
            hpPer += art.val; mpPer += art.val; atkPer += art.val; matkPer += art.val; defPer += art.val; mdefPer += art.val;
        }
        if(art.effect === 'legend_mark') {
            hpPer += art.val; mpPer += art.val; atkPer += art.val; matkPer += art.val; defPer += art.val; mdefPer += art.val;
        }
        if(art.effect === 'dragon_scale') { hpPer += art.val; defPer += art.val; mdefPer += art.val; }
        if(art.effect === 'dream_choco') {
            atkPer += 0.6; matkPer += 0.6;
        }
        if(art.effect === 'blue_moon') {
            mpPer += 0.2;
        }
    });

    // Buffs (Battle) - 이제 합연산으로 계산 및 상태창 반영
    if(buffs && buffs.player) {
        if(buffs.player.demonEyeTurns > 0) {
            atkPer += 1.0;
            matkPer += 1.0;
        }
        if(buffs.player.demonEyeLegendTurns > 0) {
            atkPer += 1.5;
            matkPer += 1.5;
        }
        if(buffs.player.royalBloomTurns > 0) { atkPer += 0.5; matkPer += 0.5; }

        // Sage Forms
        if(buffs.player.sageForm === 'star') { defPer += 0.5; mdefPer += 0.5; }
        else if(buffs.player.sageForm === 'moon') { matkPer += 0.5; atkPer -= 0.5; }
        else if(buffs.player.sageForm === 'sun') { atkPer += 1.0; defPer -= 0.5; mdefPer -= 0.5; }

        if(buffs.player.milkshakeTurns > 0) { defPer += 0.3; mdefPer += 0.3; }

        // Other Buffs
        if(buffs.player.goddessTurns > 0) { atkPer += 1.0; matkPer += 1.0; defPer += 1.0; mdefPer += 1.0; }
        if(buffs.player.goddessBlessing) { atkPer += 0.5; matkPer += 0.5; }
        if(buffs.player.undyingPowerTurns > 0) { atkPer += 1.0; }
        if(buffs.player.divineTurns > 0) { defPer += 0.3; mdefPer += 0.3; }
        if(buffs.player.castleDef100) { defPer += 1.0; }
    }

    // Apply Multipliers
    let finalMaxHp = Math.floor(baseMaxHp * (1 + hpPer));
    let finalMaxMp = Math.floor(baseMaxMp * (1 + mpPer));

    // Dynamic checks dependent on HP (Boss Artifacts & Passives)
    if(player.hp) {
         let ratio = player.hp / finalMaxHp;

         // Zeke Passive
         if(player.charKey === 'zeke') {
             if(ratio < 0.25) { atkPer += 0.3; defPer += 0.3; }
             else if(ratio < 0.5) { atkPer += 0.15; defPer += 0.15; }
         }

         // Heart of Ice (Ice Heart)
         if(ratio < 0.5) {
             if(hasArtifact('heart_ice')) {
                 defPer += 1.0;
                 mdefPer += 1.0;
             }
             if(hasArtifact('heart_ice_legend')) {
                 defPer += 1.5;
                 mdefPer += 1.5;
             }
         }
    }

    let finalAtk = Math.floor(baseAtk * (1 + atkPer));
    let finalMatk = Math.floor(baseMatk * (1 + matkPer));

    // 메디테이션 마공 50% 감소 반영 (UI 표기용)
    if(buffs && buffs.player && buffs.player.medi) {
        finalMatk = Math.floor(finalMatk * 0.5);
    }

    let finalDef = Math.floor(baseDef * (1 + defPer));
    let finalMdef = Math.floor(baseMdef * (1 + mdefPer));

    // 방어력이 0 미만으로 내려가지 않도록 보정 (벨제뷔트 등)
    finalDef = Math.max(0, finalDef);
    finalMdef = Math.max(0, finalMdef);

    if(buffs && buffs.player && buffs.player.defZero) {
        finalDef = 0;
    }

    player.maxHp = finalMaxHp;
    player.maxMp = finalMaxMp;
    player.atk = finalAtk;
    player.matk = finalMatk;
    player.def = finalDef;
    player.mdef = finalMdef;

    player.hp = Math.min(player.hp, player.maxHp);
    player.mp = Math.min(player.mp, player.maxMp);
}

function rollArtifact(highQuality=false) {
    // 1. NG+ 및 보스 해금 유물을 포함한 전체 ARTIFACTS 목록 갱신
    // (보스 드랍 유물이 해금되었는데 ARTIFACTS에 없는 경우를 방지)
    let bossUnlocks = getBossArtifactUnlocks();
    bossUnlocks.forEach(id => {
         let drop = null;
         for(let k in BOSS_DROP_ARTIFACTS) {
             if(BOSS_DROP_ARTIFACTS[k].id === id) drop = BOSS_DROP_ARTIFACTS[k];
         }
         if(drop && !ARTIFACTS.find(a => a.id === drop.id)) {
             ARTIFACTS.push(drop);
         }
    });

    let available = ARTIFACTS.filter(a => !hasArtifact(a.id));
    if(available.length === 0) return null;

    let pick;
    if(highQuality) {
        // Weighted random for High Quality
        let weighted = [];
        available.forEach(a => {
            let w = 1;
            if(a.rarity === 'epic') w = 3;
            if(a.rarity === 'legend') w = 3;
            for(let i=0; i<w; i++) weighted.push(a);
        });
        pick = weighted[Math.floor(Math.random() * weighted.length)];
    } else {
        // Uniform random
        pick = available[Math.floor(Math.random() * available.length)];
    }

    player.artifacts.push(pick);
    recalcAllStats();
    return pick;
}

function hasArtifact(key) {
    return player.artifacts && player.artifacts.some(a => a.id === key || a.effect === key);
}

function playerAttack(skill) {
    if(currentEnemy.name === "마신") {
        if(turnCount % 2 !== 0 && skill.type === 'phy') { log("마신은 홀수 턴에 물리 공격에 면역입니다!", 'info'); return true; }
        if(turnCount % 2 === 0 && skill.type === 'mag') { log("마신은 짝수 턴에 마법 공격에 면역입니다!", 'info'); return true; }
    }

    if(currentEnemy.ai === 'artificial_god') {
        if(skill.type === 'phy') buffs.enemy.nextPhysDef = true;
        if(skill.type === 'mag') buffs.enemy.nextMagDef = true;
    }

    if(buffs.enemy.counter && skill.type === 'phy') {
        let counterDmg = Math.floor(currentEnemy.atk * 2.0);
        player.hp -= counterDmg;
        log(`${currentEnemy.name}의 카운터! <span class="dmg">${counterDmg}</span>의 피해를 입고 반격당했습니다!`, 'dmg');
        return true;
    }

    if(skill.effect === 'miss_chance' && Math.random() < 0.3) { log(`${skill.name}이(가) 빗나갔습니다!`, 'info', { miss: 'enemy' }); return true; }

    let multiplier = skill.power;

    if(skill.name === '더 홀리' && buffs.player.goddessTurns) {
        multiplier += 2.0;
        log("여신 강림의 힘으로 추가타가 발생합니다!", 'holy');
    }

    if(skill.effect === 'stack_dmg') {
        multiplier += (buffs.player.absoluteStack || 0);
        buffs.player.absoluteStack = Math.min(5.0, (buffs.player.absoluteStack || 0) + 1.0);
    }

    if(skill.effect === 'rose_finisher') {
        multiplier += (roseStack * 0.4);
        multiplier = Math.min(11.0, multiplier);
        roseStack = 0;
        log("피날레! 모든 장미가 폭발합니다!", 'rose');
    }

    if(skill.effect === 'hp_reverse') {
        let lostRatio = (player.maxHp - player.hp) / player.maxHp;
        multiplier = 3.0 + (lostRatio * 6.0);
    }
    if(skill.effect === 'hp_reverse_mid') {
        let lostRatio = (player.maxHp - player.hp) / player.maxHp;
        multiplier = 1.2 + (lostRatio * 2.2);
    }

    if(skill.effect === 'stack_ult_new') {
        buffs.player.castleStack = Math.min(5, (buffs.player.castleStack || 0) + 1);
        multiplier = buffs.player.castleStack * 2.0;
        buffs.player.castleDef100 = true;
    }
    if(skill.effect === 'charge_divine') {
        let stack = buffs.player.divineStack || 0;
        multiplier += (stack * 0.3);
        buffs.player.divineStack = 0;
        log(`디바인 블레이드! ${stack}스택 폭발!`, 'holy');
    }

    if(skill.effect === 'sage_silent' && buffs.player.sageForm === 'moon') multiplier += 0.4;
    if(skill.effect === 'sage_god_hand' && buffs.player.sageForm === 'sun') multiplier += 0.8;

    if(skill.effect === 'sage_dream_ult') {
        multiplier = 4.0;
        let activeForm = buffs.player.sageForm;

        if(activeForm) {
            delete buffs.player.sageForm;
            delete buffs.player.formTurns;
            recalcAllStats();
        }

        if(activeForm === 'star') {
            buffs.enemy.stun = true;
            log("[별의 꿈] 적을 기절시킵니다!", 'star');
        } else if(activeForm === 'moon') {
            buffs.player.moonUltStack = (buffs.player.moonUltStack || 0) + 1;
            let bonus = buffs.player.moonUltStack * 3.5;
            multiplier = bonus;
            log(`[달의 꿈] 누적된 카운트(${buffs.player.moonUltStack})로 위력 폭발! (+${bonus.toFixed(1)}배)`, 'star');
        } else if(activeForm === 'sun') {
            let crystals = player.dreamCrystals || 0;
            let bonus = crystals * 1.5;
            multiplier += bonus;
            log(`[태양의 꿈] 남은 결정(${crystals})만큼 위력 증가! (+${bonus.toFixed(1)}배)`, 'star');
        } else {
            multiplier = 2.5;
            log("형태 없이 사용하여 기본 위력으로 발동합니다.", 'info');
        }
    }

    let isPhy = skill.type === 'phy';
    let atkVal = isPhy ? player.atk : player.matk;

    if(skill.effect === 'sage_hybrid_mana' || skill.effect === 'charge_milkyway') {
        atkVal = (player.atk + player.matk);
        if(skill.effect === 'sage_hybrid_mana') atkVal /= 2;

        if(skill.effect === 'charge_milkyway') {
            log("은하수의 힘이 개방됩니다!", 'star');
        }
    }

    // Final Damage Artifacts (Additive)
    let finalDmgAdd = 0.0;
    if(hasArtifact('high_risk_dmg')) finalDmgAdd += 0.5;
    if(hasArtifact('high_risk_dmg_ex')) finalDmgAdd += 1.0;
    if(hasArtifact('pharaoh')) finalDmgAdd += 1.0;

    if(finalDmgAdd > 0) multiplier *= (1.0 + finalDmgAdd);

    if(buffs.player.undyingPowerTurns) log("죽음을 극복한 힘으로 공격력이 2배가 됩니다!", 'fire');

    let critChance = player.baseCrit;
    if(buffs.player.critBuff) {
    critChance += (player.charKey === 'rumi') ? 0.40 : 0.25;}
    if(skill.effect === 'guarantee_crit') critChance = 1.0;
    if(skill.name === '어쌔신 네일') critChance += (buffs.enemy.darkness || 0) * 0.3;


    let isCrit = Math.random() < critChance;
    if(isCrit) {
        let critDmg = player.baseCritDmg;
        if(buffs.player.adrenalineTurns) critDmg += 1.0;
        // 무모한 돌진 is already in baseCritDmg (+80%, as described); it used to be added twice.
        atkVal *= critDmg;
    }

    let defVal = isPhy ? currentEnemy.def : currentEnemy.mdef;

    // Enemy Def Reduction (Additive)
    let defRed = 0.0;
    if(skill.type === 'phy' && buffs.enemy.darkness) {
        defRed += 0.10 * buffs.enemy.darkness;
    }
    if(isPhy && buffs.enemy.defDownTurns > 0) defRed += 0.2;
    if(!isPhy && buffs.enemy.mdefDownTurns > 0) defRed += 0.2;

    if(isPhy && buffs.enemy.physDefBuff) defRed -= 0.5;
    if(!isPhy && buffs.enemy.magDefBuff) defRed -= 0.5;

    // Cap reduction? 100% means 0 def.
    defRed = Math.min(1.0, defRed);
    defVal *= (1 - defRed);
    defVal = Math.max(0, defVal);

    let dmg = atkVal * multiplier * (100 / (100 + defVal));
    dmg = Math.floor(dmg);
    dmg = Math.max(1, dmg);

    if(skill.effect === 'hp_cost') player.hp -= player.maxHp * 0.1;
    if(skill.effect === 'hp_cost_20') player.hp -= player.maxHp * 0.2;
    if(skill.effect === 'darkness' || skill.name === '다크 메테오') {
        let add = 0;
        if(skill.name === '크로스 컷' && isCrit) add = 3;
        else if(skill.name === '섀도우 볼') add = 1;
        else if(skill.name === '다크 메테오') add = 1;

        if(add > 0) {
            buffs.enemy.darkness = Math.min(5, (buffs.enemy.darkness || 0) + add);
            log(`암흑 스택이 ${add} 쌓였습니다! (현재: ${buffs.enemy.darkness})`, 'info');
        }
    }

    if(skill.effect === 'sage_hybrid_mana' && isCrit) {
        player.mp = Math.min(player.maxMp, player.mp + 40);
        log("트윙클 치명타! 마나 40 회복.", 'heal');
    }

    if(skill.effect === 'self_stun' || skill.effect === 'rose_2_self_stun') {
        buffs.player.nextTurnStun = true;
        log("무리한 행동으로 다음 턴에 움직일 수 없습니다!", 'info');
    }

    if(skill.effect === 'self_def_zero') buffs.player.defZeroNext = true;

    if(skill.effect === 'def_down') buffs.enemy.defDownTurns = 3;
    if(skill.effect === 'mdef_down') buffs.enemy.mdefDownTurns = 3;

    if(skill.effect === 'add_rose_1') roseStack = Math.min(15, roseStack + 1);
    if(skill.effect === 'rose_2_self_stun') roseStack = Math.min(15, roseStack + 2);
    if(skill.effect === 'crit_rose_6' && isCrit) { roseStack = Math.min(15, roseStack + 6); log("치명타! 장미가 급격히 피어납니다!", 'rose'); }

    let enchantDmg = 0;
    if(buffs.player.enchantTurns > 0 && isPhy) {
        let eMult = 0.8;
        if(skill.effect === 'fire_combo_new') eMult = 1.6;
        enchantDmg = Math.floor(player.matk * eMult * (100 / (100 + currentEnemy.mdef)));
        enchantDmg = Math.max(1, enchantDmg);
    }

    currentEnemy.hp -= dmg;
    buffs.enemy.tookDamageThisTurn = true;

    let critMsg = isCrit ? " <b>(치명타!)</b>" : "";
    log(`${skill.name}! 적에게 <span class="dmg">${dmg}${critMsg}</span> 피해.`, 'info', { crit: isCrit });

    if(enchantDmg > 0) {
        currentEnemy.hp -= enchantDmg;
        log(`파이어 인챈트 추가타! <span class="fire">${enchantDmg}</span> 마법 피해.`, 'fire');
    }

    if(hasArtifact('vampire')) {
        let heal = Math.floor((dmg + enchantDmg) * 0.05);
        player.hp = Math.min(player.maxHp, player.hp + heal);
    }

    if(skill.effect === 'multi_hit' && buffs.player.dodgeCount) {
        let hits = Math.min(4, buffs.player.dodgeCount);
        let extraDmg = dmg * hits;
        extraDmg = Math.max(1, extraDmg);
        currentEnemy.hp -= extraDmg;
        log(`댄싱 대거 추가 ${hits}타! <span class="dmg">${extraDmg}</span> 피해.`);
    }

    if(currentEnemy.ai === 'pharaoh' && buffs.enemy.pharaohStance) {
        log(`<b style="color:#8d6e63">파라오가 공격에 반응하여 고대의 저주를 발동합니다! (공/마공 +100%)</b>`, 'dmg');
        buffs.enemy.pharaohBuffTurns = 10;
        delete buffs.enemy.pharaohStance;
    }

    return currentEnemy.hp > 0;
}

function swapBoss() {
    if(!gameState.hiddenBossReserve || gameState.hiddenBossDead) return;

    log(`<b style="color:#ffd700">=== 보스 교대 ===</b>`, 'info');

    // 1. 현재 보스 상태 저장
    let currentData = JSON.parse(JSON.stringify(currentEnemy));
    gameState.hiddenBossReserve[currentData.ai] = currentData.hp;

    // 2. 예비 보스 로드
    let nextBossId = currentEnemy.ai === 'iris_light' ? 'iris_curse' : 'iris_light';
    let nextBoss = ENEMIES.find(e => e.ai === nextBossId);
    if(!nextBoss) return;

    // Deep Copy
    currentEnemy = JSON.parse(JSON.stringify(nextBoss));

    // HP 복원
    let savedHp = gameState.hiddenBossReserve[nextBossId];
    if(savedHp !== undefined) currentEnemy.hp = savedHp;
    else currentEnemy.hp = currentEnemy.maxHp;

    if(gameState.hiddenBossReserve.maxHp) currentEnemy.maxHp = gameState.hiddenBossReserve.maxHp;
    if(gameState.hiddenBossReserve.scaledStats) {
        let s = gameState.hiddenBossReserve.scaledStats;
        if(nextBossId === 'iris_light') {
            currentEnemy.atk = s.light.atk; currentEnemy.matk = s.light.matk;
            currentEnemy.def = s.light.def; currentEnemy.mdef = s.light.mdef;
        } else {
            currentEnemy.atk = s.curse.atk; currentEnemy.matk = s.curse.matk;
            currentEnemy.def = s.curse.def; currentEnemy.mdef = s.curse.mdef;
        }
    }

    // Reset buffs on swap
    buffs.enemy = {};

    log(`${currentEnemy.name} 등장!`, 'info');
}

function enemyTurn() {
    if(currentEnemy.name === "세계수") {
        currentEnemy.atk += 5;
        currentEnemy.matk += 5;
    }

    if(currentEnemy.ai === 'charge') {
        if(buffs.enemy.charging) {
            delete buffs.enemy.charging;
            log(`${currentEnemy.name}의 차지 어택 발사!`, 'dmg');
            return applyEnemyDamage(currentEnemy.atk * 2.5, 'phy');
        }
        if(Math.random() < 0.3) {
            log(`${currentEnemy.name}이(가) 기를 모으기 시작합니다...`, 'info');
            buffs.enemy.charging = true;
            return true;
        }
    }

    if(currentEnemy.ai === 'cream_maid') {
        if(Math.random() < 0.3) {
            log(`${currentEnemy.name}의 크림 익스플로전!`, 'mag');
            return applyEnemyDamage(currentEnemy.matk * 2.5, 'mag');
        } else {
            log(`${currentEnemy.name}의 공격`, 'phy');
            return applyEnemyDamage(currentEnemy.atk, 'phy');
        }
    }

    if(currentEnemy.ai === 'candy_boy') {
        let rand = Math.random();
        if(rand < 0.2) {
            log(`${currentEnemy.name}의 캔디 캐논!`, 'dmg');
            return applyEnemyDamage(currentEnemy.atk * 1.5, 'phy');
        } else if(rand < 0.4) {
            log(`${currentEnemy.name}의 크림 익스플로전!`, 'mag');
            return applyEnemyDamage(currentEnemy.matk * 2.5, 'mag');
        } else {
            log(`${currentEnemy.name}의 공격`, 'phy');
            return applyEnemyDamage(currentEnemy.atk, 'phy');
        }
    }

    if(currentEnemy.ai === 'pudding_princess') {
        // Form Change Logic
        if(turnCount === 1 || turnCount % 3 === 0) {
            let form = Math.random() < 0.5 ? 'milk' : 'choco';

            // Remove old buffs if any
            if(buffs.enemy.form === 'milk') { currentEnemy.atk -= 200; currentEnemy.def -= 500; }
            if(buffs.enemy.form === 'choco') { currentEnemy.matk -= 200; currentEnemy.mdef -= 500; }

            buffs.enemy.form = form;
            if(form === 'milk') {
                currentEnemy.atk += 200; currentEnemy.def += 500;
                log(`<b style="color:#fff59d">[밀크 푸딩 폼] 공격력/방어력 증가!</b>`, 'info');
            } else {
                currentEnemy.matk += 200; currentEnemy.mdef += 500;
                log(`<b style="color:#8d6e63">[초코 푸딩 폼] 마법공격력/마법방어력 증가!</b>`, 'info');
            }
        }

        let rand = Math.random();
        if(rand < 0.3) {
            log(`${currentEnemy.name}의 크림 익스플로전!`, 'mag');
            return applyEnemyDamage(currentEnemy.matk * 2.5, 'mag');
        } else if(rand < 0.4) {
            log(`<b style="color:#ffd700">${currentEnemy.name}의 파라다이스!</b>`, 'mag');
            return applyEnemyDamage(currentEnemy.matk * 4.0, 'mag');
        } else {
            log(`${currentEnemy.name}의 공격`, 'phy');
            return applyEnemyDamage(currentEnemy.atk, 'phy');
        }
    }

    if(currentEnemy.ai === 'flame_sage') {
        if(Math.random() < 0.3) {
            log(`${currentEnemy.name}의 익스플로전!`, 'mag');
            return applyEnemyDamage(currentEnemy.matk * 3.0, 'mag');
        }
        log(`${currentEnemy.name}의 공격`, 'phy');
        return applyEnemyDamage(currentEnemy.atk, 'phy');
    }

    if(currentEnemy.ai === 'lightning_sage') {
        let rand = Math.random();
        if(rand < 0.2) {
            log(`${currentEnemy.name}의 전광석화!`, 'dmg');
            return applyEnemyDamage(currentEnemy.atk * 2.0, 'phy');
        } else if(rand < 0.4) {
            log(`${currentEnemy.name}의 썬더 레인!`, 'mag');
            return applyEnemyDamage(currentEnemy.matk * 3.0, 'mag');
        }
        log(`${currentEnemy.name}의 공격`, 'phy');
        return applyEnemyDamage(currentEnemy.atk, 'phy');
    }

    if(currentEnemy.ai === 'artificial_god') {
        // Defensive Passive handled in playerAttack() via buffs.enemy.nextTurn...
        if(buffs.enemy.nextPhysDef) {
            buffs.enemy.physDefBuff = true;
            delete buffs.enemy.nextPhysDef;
            log(`[인조 마신] 물리 방어 프로토콜 가동 (물리 방어력 50% 증가)`, 'info');
        } else { delete buffs.enemy.physDefBuff; }

        if(buffs.enemy.nextMagDef) {
            buffs.enemy.magDefBuff = true;
            delete buffs.enemy.nextMagDef;
            log(`[인조 마신] 마법 방어 프로토콜 가동 (마법 방어력 50% 증가)`, 'info');
        } else { delete buffs.enemy.magDefBuff; }

        let isLowHp = currentEnemy.hp < currentEnemy.maxHp * 0.5;
        let rand = Math.random();

        if(rand < 0.2) {
            log(`${currentEnemy.name}의 전광석화!`, 'dmg');
            return applyEnemyDamage(currentEnemy.atk * 2.0, 'phy');
        } else if(rand < 0.4) {
            if(isLowHp) {
                log(`<b style="color:#ff5252">${currentEnemy.name}의 파괴의 형태!</b>`, 'mag');
                return applyEnemyDamage(currentEnemy.matk * 4.5, 'mag');
            } else {
                log(`${currentEnemy.name}의 익스플로전!`, 'mag');
                return applyEnemyDamage(currentEnemy.matk * 3.0, 'mag');
            }
        }
        log(`${currentEnemy.name}의 공격`, 'phy');
        return applyEnemyDamage(currentEnemy.atk, 'phy');
    }

    if(currentEnemy.ai === 'red_dragon') {
        let rand = Math.random();
        if(rand < 0.2) {
            log(`${currentEnemy.name}의 드래곤 크로! (물리)`, 'dmg');
            return applyEnemyDamage(currentEnemy.atk * 1.5, 'phy');
        } else if(rand < 0.4) {
            log(`${currentEnemy.name}의 드래곤 브레스! (마법)`, 'mag');
            return applyEnemyDamage(currentEnemy.matk * 2.5, 'mag');
        } else {
            log(`${currentEnemy.name}의 공격`, 'phy');
            return applyEnemyDamage(currentEnemy.atk, 'phy');
        }
    }

    if(currentEnemy.ai === 'gold_dragon') {
        buffs.enemy.goldDragonScale = (buffs.enemy.goldDragonScale || 0) + 1;

        if(turnCount % 6 === 0) {
            buffs.enemy.goldDragonScale = 0;
            log(`<b style="color:#ffd700">[골드 드래곤] 비늘이 약해지며 방어력이 초기화되었습니다!</b>`, 'info');
        } else {
            let boost = buffs.enemy.goldDragonScale * 10;
            log(`[골드 드래곤] 비늘이 단단해집니다. (방어/마방 +${boost}%)`, 'info');
        }

        if(!currentEnemy.baseDef) {
            currentEnemy.baseDef = currentEnemy.def;
            currentEnemy.baseMdef = currentEnemy.mdef;
        }

        let scaleStack = buffs.enemy.goldDragonScale;
        let multiplier = 1.0 + (scaleStack * 0.1);

        currentEnemy.def = Math.floor(currentEnemy.baseDef * multiplier);
        currentEnemy.mdef = Math.floor(currentEnemy.baseMdef * multiplier);

        if((turnCount + 1) % 6 === 0) {
            log(`<b style="color:#ff5252">${currentEnemy.name}의 드래곤 크로! (강력한 일격)</b>`, 'dmg');
            return applyEnemyDamage(currentEnemy.atk * 1.5, 'phy');
        }

        if(Math.random() < 0.3) {
            log(`${currentEnemy.name}의 드래곤 브레스!`, 'mag');
            return applyEnemyDamage(currentEnemy.matk * 2.5, 'mag');
        }

        log(`${currentEnemy.name}의 공격`, 'phy');
        return applyEnemyDamage(currentEnemy.atk, 'phy');
    }

    if(currentEnemy.ai === 'sphinx') {
        let rand = Math.random();
        if(rand < 0.2) {
             log(`${currentEnemy.name}의 강타!`, 'dmg');
             return applyEnemyDamage(currentEnemy.atk * 1.5, 'phy');
        } else if(rand < 0.4) {
             log(`${currentEnemy.name}의 샌드스톰!`, 'mag');
             return applyEnemyDamage(currentEnemy.matk * 2.0, 'mag');
        }

        log(`${currentEnemy.name}의 공격`, 'phy');
        return applyEnemyDamage(currentEnemy.atk, 'phy');
    }

    if(currentEnemy.ai === 'pharaoh') {
        // Turn 25: Full Heal
        if(turnCount === 25) {
            log(`<b style="color:#ffd700">[투탕카멘의 관] 파라오가 영면에서 깨어나 완전히 회복합니다!</b>`, 'heal');
            currentEnemy.hp = currentEnemy.maxHp;
            return true;
        }

        if(turnCount % 7 === 0) {
            log(`<b style="color:#8d6e63">[고대의 저주] 파라오가 저주를 영창합니다. (다음 턴 피격 시 능력치 상승)</b>`, 'info');
            buffs.enemy.pharaohStance = true;
            buffs.enemy.pharaohStanceTurn = turnCount;
            return true;
        }

        if(buffs.enemy.pharaohBuffTurns > 0) {
             buffs.enemy.pharaohBuffTurns--;
        }

        if(Math.random() < 0.3) {
            log(`${currentEnemy.name}의 샌드스톰!`, 'mag');
            let mult = 1.0;
            if(buffs.enemy.pharaohBuffTurns > 0) mult += 1.0;
            return applyEnemyDamage(currentEnemy.matk * 2.0 * mult, 'mag');
        }

        log(`${currentEnemy.name}의 공격`, 'phy');
        let mult = 1.0;
        if(buffs.enemy.pharaohBuffTurns > 0) mult += 1.0;
        return applyEnemyDamage(currentEnemy.atk * mult, 'phy');
    }

    if(currentEnemy.ai === 'silent_librarian') {
         if(Math.random() < 0.3) {
             log(`${currentEnemy.name}의 사일런트!`, 'mag');
             return applyEnemyDamage(currentEnemy.matk * 2.5, 'mag');
         }
         log(`${currentEnemy.name}의 공격`, 'phy');
         return applyEnemyDamage(currentEnemy.atk, 'phy');
    }

    if(currentEnemy.ai === 'night_rabbit') {
        let rand = Math.random();
        if(rand < 0.2) {
             log(`${currentEnemy.name}의 깡총깡총!`, 'phy');
             return applyEnemyDamage(currentEnemy.atk * 1.5, 'phy');
        } else if(rand < 0.4) {
             log(`${currentEnemy.name}의 사일런트!`, 'mag');
             return applyEnemyDamage(currentEnemy.matk * 2.5, 'mag');
        } else {
             log(`${currentEnemy.name}의 공격`, 'phy');
             return applyEnemyDamage(currentEnemy.atk, 'phy');
        }
    }

    if(currentEnemy.ai === 'time_ruler') {
         if(buffs.enemy.forecastTurn && turnCount === buffs.enemy.forecastTurn + 5) {
             let type = buffs.enemy.forecastType;
             delete buffs.enemy.forecastTurn;
             delete buffs.enemy.forecastType;

             if(type === 'drain') {
                  log(`<b style="color:#90caf9">소울 드레인! (플레이어 MP 0)</b>`, 'mag');
                  player.mp = 0;
                  return true;
             }
             if(type === 'darkness') {
                  let dmgMult = buffs.enemy.tookDamageThisTurn ? 4.5 : 1.5;
                  let msg = buffs.enemy.tookDamageThisTurn ? "섀도우 트위스트! (반격 폭발)" : "섀도우 트위스트!";
                  log(`<b style="color:#b39ddb">${msg}</b>`, 'mag');
                  return applyEnemyDamage(currentEnemy.matk * dmgMult, 'mag');
             }
             if(type === 'doom') {
