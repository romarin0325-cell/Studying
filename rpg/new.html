<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F4FA">
<title>Turn RPG: Legend Edition</title>
<style>
/* =========================================
   Turn RPG: Legend Edition — 화면
   세 가지 파스텔만 쓴다: 하늘(행동·MP·마법), 벚꽃(HP·물리·위험), 레몬(보상·보조·전설).
   글자는 남색 잉크, 바탕은 흰 종이. 모서리는 둥글리지 않고 잘라낸다.
   ========================================= */
:root {
    --sky: #9AD5F0; --sky-l: #E2F3FB; --sky-d: #2A7097;
    --pink: #F4AFC8; --pink-l: #FCE6EE; --pink-d: #AE3D6E;
    --lemon: #F3D683; --lemon-l: #FCF3D4; --lemon-d: #7E5F05;
    --ink: #262B4A; --ink-2: #4A5072; --ink-3: #61678A;
    --paper: #FFFFFF; --bg: #F5F4FA; --line: #E2E1EC; --line-2: #CFCEDD; --track: #ECEBF3;
    --tri: linear-gradient(100deg, var(--sky) 0%, var(--pink) 55%, var(--lemon) 100%);
    --cut: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
    --cut-2: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    --para: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
    --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
    --bar-h: 52px; --tab-h: 62px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
    background: var(--bg);
    background-image: repeating-linear-gradient(120deg, transparent 0 22px, rgba(38, 43, 74, .025) 22px 23px);
    color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    overflow: hidden; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: not-allowed; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--sky-d); outline-offset: 2px; }
svg { display: block; }
.num { font-variant-numeric: tabular-nums; }
.kicker { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 10.5px; font-weight: 800; letter-spacing: .18em; color: var(--ink-3); text-transform: uppercase; }
.kicker::before { content: ""; width: 14px; height: 3px; background: var(--tri); }
[hidden] { display: none !important; }

/* ---------- App frame ---------- */
#app { position: relative; display: flex; flex-direction: column; width: 100%; max-width: 480px; height: 100vh; height: 100dvh; margin: 0 auto; background: var(--bg); box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.bar { position: relative; z-index: 20; display: flex; align-items: center; gap: 8px; height: calc(var(--bar-h) + var(--safe-t)); padding: var(--safe-t) 10px 0 14px; flex-shrink: 0; background: rgba(255, 255, 255, .92); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); }
.bar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--tri); opacity: .9; }
#app[data-screen=title] .bar { background: transparent; border-color: transparent; backdrop-filter: none; }
#app[data-screen=title] .bar::after { display: none; }
.bar-left { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.bar-title { min-width: 0; }
.bar-title b { display: block; font-size: 15px; font-weight: 800; line-height: 1.2; }
.bar-title small { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .14em; color: var(--ink-3); }
.bar-right { display: flex; align-items: center; gap: 4px; }
.icon-btn { display: grid; place-items: center; width: 38px; height: 38px; color: var(--ink-2); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:active { background: var(--track); }
.gold { display: inline-flex; align-items: center; gap: 5px; height: 28px; margin-right: 4px; padding: 0 10px 0 6px; background: var(--lemon-l); border: 1px solid var(--lemon); font-weight: 800; font-size: 13px; clip-path: var(--para); }
.gold svg { width: 16px; height: 16px; color: var(--lemon-d); }
main { position: relative; flex: 1; min-height: 0; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; min-height: 0; }
#app[data-screen=title] #scr-title, #app[data-screen=select] #scr-select, #app[data-screen=town] #scr-town, #app[data-screen=battle] #scr-battle { display: flex; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

/* ---------- Buttons ---------- */
.cta { position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 54px; padding: 8px 22px; background: var(--tri); color: var(--ink); font-size: 16px; font-weight: 900; letter-spacing: .02em; clip-path: var(--cut-2); box-shadow: inset 0 -3px 0 rgba(38, 43, 74, .12); }
.cta small { display: block; font-size: 11.5px; font-weight: 700; color: var(--ink-2); letter-spacing: 0; }
.cta .cta-text { text-align: center; line-height: 1.25; }
.cta svg { width: 18px; height: 18px; }
.cta:active { filter: brightness(.96); transform: translateY(1px); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 16px; background: var(--paper); border: 1.5px solid var(--line-2); color: var(--ink); font-weight: 800; clip-path: var(--cut-2); }
.btn:active { background: var(--track); }
.btn.wide { width: 100%; }
.btn.danger { color: var(--pink-d); border-color: var(--pink); }
.btn:disabled { color: var(--ink-3); background: var(--track); border-color: var(--line); }
.buy { flex-shrink: 0; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; min-width: 88px; min-height: 44px; padding: 4px 12px; background: var(--sky); color: var(--ink); font-weight: 900; font-size: 13px; line-height: 1.2; clip-path: var(--para); }
.buy small { font-size: 10.5px; font-weight: 800; color: var(--ink-2); }
.buy:disabled { background: var(--track); color: var(--ink-3); }
.buy.owned { background: var(--sky-l); color: var(--sky-d); }

/* ---------- Gauges ---------- */
.gauge { position: relative; height: 10px; background: var(--track); overflow: hidden; }
.gauge > i { position: absolute; inset: 0 auto 0 0; width: var(--v, 100%); background: var(--fill); transition: width .35s var(--ease); }
.gauge > b { position: absolute; inset: 0 auto 0 0; width: var(--g, 100%); background: rgba(38, 43, 74, .16); transition: width .5s .35s var(--ease); }
.gauge.hp { --fill: linear-gradient(90deg, #F7C3D6, var(--pink)); }
.gauge.mp { --fill: linear-gradient(90deg, #C3E7F7, var(--sky)); }
.gauge.exp { --fill: linear-gradient(90deg, #FAE6AE, var(--lemon)); height: 6px; }
.gauge-row { display: flex; align-items: center; gap: 8px; }
.gauge-row > .gauge { flex: 1; }
.gauge-row > span { min-width: 82px; font-size: 12px; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
.gauge-row > em { width: 22px; font-style: normal; font-size: 10px; font-weight: 900; letter-spacing: .08em; color: var(--ink-3); }

/* ---------- Chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 4px; min-height: 20px; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; font-size: 11px; font-weight: 800; color: var(--ink); background: var(--sky-l); border-left: 3px solid var(--sky); white-space: nowrap; }
.chip.bad { background: var(--pink-l); border-color: var(--pink); }
.chip.gold { background: var(--lemon-l); border-color: var(--lemon); }
.chip.warn { background: var(--pink); border-color: var(--pink-d); }
.chip b { font-weight: 900; font-variant-numeric: tabular-nums; }

/* ---------- Title ---------- */
#scr-title { justify-content: flex-end; }
.title-bg { position: absolute; inset: calc(-1 * (var(--bar-h) + var(--safe-t))) 0 0; }
.title-bg .scenery { width: 100%; height: 100%; }
.title-mark { position: relative; margin: 0 24px auto; padding-top: 8vh; }
.title-mark .kicker { color: var(--ink-2); }
.wordmark { margin: 10px 0 0; font-size: 64px; font-weight: 900; line-height: .9; letter-spacing: -.02em; }
.wordmark span { display: block; margin-top: 8px; font-size: 18px; font-weight: 800; letter-spacing: .5em; color: var(--ink-2); }
.wordmark-line { width: 140px; height: 4px; margin: 16px 0 12px; background: var(--tri); }
.title-line { margin: 0; font-size: 14px; font-weight: 700; color: var(--ink-2); }
.title-cast { position: relative; display: flex; justify-content: center; gap: 8px; margin: 0 20px 6px; }
.title-cast span { width: 17%; max-width: 72px; aspect-ratio: 3 / 4; filter: drop-shadow(0 6px 10px rgba(38, 43, 74, .14)); }
.title-cast span:nth-child(1) { transform: translateY(18px); } .title-cast span:nth-child(2) { transform: translateY(6px); } .title-cast span:nth-child(3) { transform: translateY(-6px); } .title-cast span:nth-child(4) { transform: translateY(-18px); } .title-cast span:nth-child(5) { transform: translateY(-30px); }
.title-cast .crest, .title-cast img { width: 100%; height: 100%; object-fit: cover; }
.title-dock { position: relative; display: grid; gap: 10px; padding: 18px 20px calc(22px + var(--safe-b)); background: linear-gradient(transparent, rgba(255, 255, 255, .9) 30%); }
.title-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 4px; }

/* ---------- Character select ---------- */
#scr-select .scroll { padding: 16px 16px 8px; }
.pick { position: relative; display: grid; grid-template-columns: 132px 1fr; gap: 14px; padding: 14px; background: var(--paper); border: 1px solid var(--line); clip-path: var(--cut); }
.pick::after { content: ""; position: absolute; top: 0; right: 0; width: 12px; height: 12px; background: var(--tri); clip-path: polygon(0 0, 100% 100%, 100% 0); }
.pick-art { width: 132px; aspect-ratio: 3 / 4; }
.pick-art .crest, .pick-art img { width: 100%; height: 100%; object-fit: cover; }
.pick-name { margin: 2px 0 0; font-size: 24px; font-weight: 900; letter-spacing: -.02em; }
.pick-role { margin: 0; font-size: 12px; font-weight: 800; color: var(--ink-3); }
.pick-mech { margin: 8px 0 0; font-size: 13px; color: var(--ink-2); }
.pick-tags { margin-top: 8px; }
.pick-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin-top: 14px; padding: 12px 14px; background: var(--paper); border: 1px solid var(--line); }
.pick-stat { display: grid; grid-template-columns: 36px 1fr 34px; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; color: var(--ink-3); }
.pick-stat b { text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
.pick-stat .gauge { height: 6px; --fill: var(--sky); }
.pick-skills { margin: 12px 0 0; font-size: 12px; color: var(--ink-2); }
.pick-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 14px; }
.pick-opt { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0 4px; font-size: 12px; font-weight: 800; color: var(--ink-2); }
.pick-opt .face { width: 100%; aspect-ratio: 3 / 4; opacity: .55; transition: opacity .2s, transform .2s var(--ease); }
.pick-opt .face .crest, .pick-opt .face img { width: 100%; height: 100%; object-fit: cover; }
.pick-opt[aria-pressed=true] { color: var(--ink); }
.pick-opt[aria-pressed=true] .face { opacity: 1; transform: translateY(-3px); }
.pick-opt[aria-pressed=true]::after { content: ""; position: absolute; left: 20%; right: 20%; bottom: -4px; height: 3px; background: var(--ink); }
.pick-opt .cleared { position: absolute; top: 2px; right: 0; padding: 1px 5px; font-size: 9px; font-weight: 900; background: var(--lemon); color: var(--ink); }
.dock { flex-shrink: 0; padding: 10px 16px calc(12px + var(--safe-b)); background: rgba(255, 255, 255, .94); border-top: 1px solid var(--line); }

/* ---------- Town ---------- */
.hero { position: relative; flex-shrink: 0; display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 12px 14px; background: var(--paper); border-bottom: 1px solid var(--line); }
.hero-art { width: 64px; aspect-ratio: 3 / 4; align-self: start; }
.hero-art .crest, .hero-art img { width: 100%; height: 100%; object-fit: cover; }
.hero-head { display: flex; align-items: baseline; gap: 8px; }
.hero-head b { font-size: 18px; font-weight: 900; }
.hero-head span { font-size: 12px; font-weight: 800; color: var(--ink-3); }
.hero-lv { margin-left: auto; font-size: 13px !important; color: var(--ink) !important; font-variant-numeric: tabular-nums; }
.hero-exp { margin-top: 6px; }
.hero-exp .gauge-row > span { min-width: 0; font-size: 11px; color: var(--ink-3); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-top: 8px; background: var(--line); border: 1px solid var(--line); }
.stat { display: flex; align-items: baseline; justify-content: space-between; gap: 4px; padding: 4px 7px; background: var(--paper); font-size: 10.5px; font-weight: 800; color: var(--ink-3); }
.stat b { font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; }
.hero-extra { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; }
.panel { display: none; padding: 14px 14px 20px; }
#scr-town[data-tab=explore] #tab-explore, #scr-town[data-tab=forge] #tab-forge, #scr-town[data-tab=skills] #tab-skills, #scr-town[data-tab=relics] #tab-relics { display: block; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 10px; }
.section-head h2 { margin: 0; font-size: 17px; font-weight: 900; }
.section-head .note { font-size: 12px; font-weight: 700; color: var(--ink-3); }
.hint { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; padding: 8px 12px; background: var(--lemon-l); border-left: 3px solid var(--lemon); font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.hint b { color: var(--ink); }
.hint svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--lemon-d); }
.cycle-cta { margin: 0 0 14px; }

.dungeon { position: relative; display: flex; width: 100%; min-height: 96px; margin-bottom: 10px; text-align: left; background: var(--paper); border: 1px solid var(--line); clip-path: var(--cut); overflow: hidden; }
.dungeon:active { border-color: var(--line-2); }
.dungeon-art { position: absolute; inset: 0 0 0 46%; clip-path: polygon(22px 0, 100% 0, 100% 100%, 0 100%); }
.dungeon-art .scenery { width: 100%; height: 100%; }
.dungeon-info { position: relative; flex: 1; display: flex; flex-direction: column; gap: 2px; max-width: 62%; padding: 11px 0 11px 14px; }
.dungeon-info .kicker { font-size: 10px; }
.dungeon-name { font-size: 17px; font-weight: 900; line-height: 1.25; }
.dungeon-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ink-3); }
.dungeon-boss { font-size: 12px; font-weight: 700; color: var(--ink-2); }
.dungeon-go { position: absolute; right: 10px; bottom: 10px; display: grid; place-items: center; width: 34px; height: 34px; background: var(--paper); color: var(--ink); clip-path: var(--cut-2); }
.dungeon-go svg { width: 18px; height: 18px; }
.dungeon .ribbon { position: absolute; top: 8px; right: 12px; padding: 2px 9px; font-size: 10px; font-weight: 900; letter-spacing: .14em; background: var(--ink); color: var(--paper); clip-path: var(--para); }
.fit { padding: 0 6px; font-size: 11px; font-weight: 900; }
.fit.ok { background: var(--sky-l); color: var(--sky-d); }
.fit.low { background: var(--pink-l); color: var(--pink-d); }
.fit.easy { background: var(--track); color: var(--ink-3); }

.forge { display: grid; gap: 10px; }
.forge-item, .skill-item, .relic { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; background: var(--paper); border: 1px solid var(--line); }
.forge-item::before, .skill-item::before, .relic::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--tone, var(--sky)); }
.forge-body, .skill-body, .relic-body { flex: 1; min-width: 0; }
.forge-title { display: flex; align-items: baseline; gap: 8px; font-size: 15px; font-weight: 900; }
.forge-title span { font-size: 12px; font-weight: 800; color: var(--ink-3); }
.pips { display: flex; gap: 3px; margin: 6px 0; }
.pips i { width: 14px; height: 6px; background: var(--track); transform: skewX(-20deg); }
.pips i.on { background: var(--tone, var(--sky)); }
.forge-next { font-size: 12.5px; color: var(--ink-2); }
.forge-next b { color: var(--ink); }
.group-label { margin: 18px 0 8px; }
.skill-list { display: grid; gap: 8px; }
.skill-item.ult { --tone: var(--tri); }
.skill-name { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14.5px; font-weight: 900; }
.skill-name .ico { width: 16px; height: 16px; color: var(--tone-d, var(--sky-d)); }
.skill-name .ico svg { width: 16px; height: 16px; }
.tag { display: inline-block; padding: 0 6px; font-size: 10px; font-weight: 900; letter-spacing: .06em; line-height: 17px; background: var(--track); color: var(--ink-2); }
.tag.ult { background: var(--ink); color: var(--paper); }
.skill-desc { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-2); }
.t-phy { --tone: var(--pink); --tone-d: var(--pink-d); }
.t-mag { --tone: var(--sky); --tone-d: var(--sky-d); }
.t-sup { --tone: var(--lemon); --tone-d: var(--lemon-d); }
.relic { align-items: flex-start; }
.relic-name { font-size: 14.5px; font-weight: 900; }
.relic-desc { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-2); }
.r-normal { --tone: var(--sky); } .r-epic { --tone: var(--pink); } .r-legend { --tone: var(--lemon); }
.rarity { margin-left: 6px; font-size: 10px; font-weight: 900; letter-spacing: .08em; color: var(--ink-3); }
.empty { padding: 26px 12px; text-align: center; font-size: 13px; color: var(--ink-3); background: var(--paper); border: 1.5px dashed var(--line-2); }
.reroll { display: grid; gap: 8px; margin-top: 16px; padding: 14px; background: var(--paper); border: 1px solid var(--line); }
.reroll p { margin: 0; font-size: 12.5px; color: var(--ink-2); }

.tabbar { position: relative; z-index: 20; display: grid; grid-template-columns: repeat(4, 1fr); height: calc(var(--tab-h) + var(--safe-b)); padding-bottom: var(--safe-b); flex-shrink: 0; background: var(--paper); border-top: 1px solid var(--line); }
#app:not([data-screen=town]) .tabbar { display: none; }
.tabbar button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 800; color: var(--ink-3); }
.tabbar svg { width: 22px; height: 22px; }
.tabbar button[aria-selected=true] { color: var(--ink); }
.tabbar button[aria-selected=true]::before { content: ""; position: absolute; top: 0; left: 18%; right: 18%; height: 3px; background: var(--tri); }

/* ---------- Battle ---------- */
#scr-battle { background: var(--paper); }
.stage { position: relative; flex-shrink: 0; height: clamp(208px, 34dvh, 290px); overflow: hidden; }
.stage-bg { position: absolute; inset: 0; }
.stage-bg .scenery { width: 100%; height: 100%; }
.stage::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: linear-gradient(transparent, rgba(255, 255, 255, .7)); pointer-events: none; }
.foe-art { position: absolute; z-index: 1; left: 50%; top: 12px; bottom: 78px; aspect-ratio: 140 / 160; transform: translateX(-50%); filter: drop-shadow(0 8px 12px rgba(38, 43, 74, .2)); }
.foe-art .crest, .foe-art img { width: 100%; height: 100%; object-fit: contain; }
.foe-info { position: absolute; z-index: 2; left: 10px; right: 10px; bottom: 8px; padding: 7px 10px 7px; background: rgba(255, 255, 255, .95); border: 1px solid var(--line); clip-path: var(--cut); }
.foe-head { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.foe-name { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 900; line-height: 1.2; }
.foe-hp-num { font-size: 12px; font-weight: 800; }
.foe-info .gauge { height: 9px; }
.foe-info .chips { margin-top: 5px; min-height: 0; }
.me { position: relative; z-index: 3; flex-shrink: 0; display: grid; grid-template-columns: 48px 1fr; gap: 10px; padding: 8px 14px 8px; border-bottom: 1px solid var(--line); }
.me-art { width: 48px; aspect-ratio: 3 / 4; }
.me-art .crest, .me-art img { width: 100%; height: 100%; object-fit: cover; }
.me-name { display: flex; align-items: baseline; gap: 6px; margin-bottom: 3px; font-size: 14px; font-weight: 900; }
.me-name span { font-size: 11px; font-weight: 800; color: var(--ink-3); }
.me .gauge-row + .gauge-row { margin-top: 3px; }
.me .chips { margin-top: 5px; }
.resource { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; font-size: 11px; font-weight: 900; background: var(--ink); color: var(--paper); }
.resource i { display: inline-block; width: 7px; height: 7px; background: rgba(255, 255, 255, .28); transform: rotate(45deg); }
.resource i.on { background: var(--lemon); }
.shake { animation: shake .26s linear; }

.log { position: relative; flex-shrink: 0; height: 72px; padding: 6px 14px 4px; overflow: hidden; background: var(--bg); border-bottom: 1px solid var(--line); font-size: 12.5px; line-height: 20px; }

.skills { flex: 1; min-height: 0; display: flex; flex-direction: column; }

.skills-head .switch[aria-pressed=true] { color: var(--sky-d); }
.skill-grid { display: grid; grid-template-columns: 1fr 1fr; align-content: start; gap: 6px; padding: 4px 14px calc(14px + var(--safe-b)); overflow-y: auto; }
.sk { position: relative; display: flex; flex-direction: column; justify-content: center; min-height: 54px; padding: 6px 10px 6px 14px; text-align: left; background: var(--paper); border: 1px solid var(--line-2); clip-path: var(--cut-2); }
.sk::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--tone); }
.sk-top { display: flex; align-items: center; gap: 6px; }
.sk-top .ico { width: 15px; height: 15px; flex-shrink: 0; color: var(--tone-d); }
.sk-top .ico svg { width: 15px; height: 15px; }
.sk-name { flex: 1; min-width: 0; font-size: 14px; font-weight: 900; line-height: 1.2; }
.sk-cost { flex-shrink: 0; font-size: 11px; font-weight: 900; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.sk-desc { display: none; margin-top: 2px; font-size: 11.5px; line-height: 1.3; color: var(--ink-2); }
.skills.show-desc .sk-desc { display: block; }
.sk.ult { grid-column: span 2; background: linear-gradient(100deg, var(--sky-l), var(--pink-l) 55%, var(--lemon-l)); border-color: var(--line-2); }

.sk.ready .reason { color: var(--lemon-d); }
.sk:active:not(:disabled) { transform: translateY(1px); background: var(--bg); }
.pass { grid-column: span 2; min-height: 54px; background: var(--pink-l); border: 1.5px solid var(--pink); font-weight: 900; clip-path: var(--cut-2); }
#scr-battle[aria-busy=true] .sk, #scr-battle[aria-busy=true] .pass { pointer-events: none; }
.banner { position: absolute; z-index: 5; left: 0; top: 14px; max-width: 80%; padding: 6px 18px 6px 14px; background: var(--ink); color: var(--paper); font-size: 15px; font-weight: 900; clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%); opacity: 0; transform: translateX(-16px); transition: opacity .2s, transform .25s var(--ease); }

.banner.foe-side.show { transform: none; }
.banner.foe-side small { color: var(--pink-l); }

/* ---------- Result sheet & dialog ---------- */
.veil { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(38, 43, 74, .34); animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-width: 480px; max-height: 88dvh; overflow-y: auto; padding: 0 18px calc(18px + var(--safe-b)); background: var(--paper); clip-path: polygon(0 18px, 18px 0, 100% 0, 100% 100%, 0 100%); animation: rise .32s var(--ease); }

.dialog::before { content: ""; display: block; height: 3px; margin: -20px -18px 16px; background: var(--tri); }
.dialog h3 { margin: 0 0 8px; font-size: 17px; font-weight: 900; }
.dialog p { margin: 0 0 6px; font-size: 13.5px; color: var(--ink-2); white-space: pre-line; }
.dialog-actions { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; margin-top: 16px; }
.dialog .cta { min-height: 46px; font-size: 15px; }
.settings-group { margin-top: 14px; }
.settings-group .kicker { margin-bottom: 8px; }
.row-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 44px; padding: 0 2px; font-size: 14px; font-weight: 800; border-bottom: 1px solid var(--line); }
.switch-ui { position: relative; width: 48px; height: 26px; background: var(--track); box-shadow: inset 0 0 0 1.5px var(--line-2); transition: background .2s; }
.switch-ui::after { content: ""; position: absolute; top: 5px; left: 5px; width: 16px; height: 16px; background: var(--ink-3); transform: rotate(45deg) scale(.82); transition: transform .2s var(--ease), background .2s; }
[aria-checked=true] .switch-ui { background: var(--sky); box-shadow: inset 0 0 0 1.5px var(--sky-d); }
[aria-checked=true] .switch-ui::after { background: var(--ink); transform: translateX(22px) rotate(45deg) scale(.82); }
.settings-actions { display: grid; gap: 8px; }
.meta-line { font-size: 12px; color: var(--ink-3); }
#toast { position: fixed; z-index: 60; left: 50%; bottom: calc(86px + var(--safe-b)); max-width: 86%; padding: 9px 16px; background: var(--ink); color: var(--paper); font-size: 13px; font-weight: 800; clip-path: var(--para); opacity: 0; transform: translate(-50%, 10px); transition: opacity .2s, transform .25s var(--ease); pointer-events: none; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (min-width: 481px) { body { background-color: #ECEBF4; } }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

<script>
/* =========================================
   2. 전투 규칙 (Battle rules)
   예전 new.html의 계산을 그대로 옮겼다. 고친 곳에는 이유를 남겼다.
   ========================================= */
let player = {};
let gameState = { gold: 10000, learnedSkills: [], manaLevel: 0, equipWeapon: 0, equipArmor: 0, currentEventDungeon: null };
let currentEnemy = null;
let turnCount = 0;
let buffs = { player: {}, enemy: {} };
let roseStack = 0;

function checkHiddenUnlock() {
    const required = ['hestia', 'dream_choco', 'blue_moon', 'dragon_scale', 'pharaoh', 'dark_pendant'];
    const unlocks = getBossArtifactUnlocks();
    // 모든 필수 전설 유물이 unlock 되어있는지 확인
    return required.every(id => unlocks.includes(id));
}

function setupEventDungeon() {
    let cycle = getCycleCount();
    // 6회차(인덱스 5)부터는 등장하지 않음
    if(cycle >= 5) {
        gameState.currentEventDungeon = null;
        return;
    }

    let usedEvents = JSON.parse(localStorage.getItem('turnRpgUsedEvents') || '[]');
    const ALL_EVENTS = ['dessert', 'magic', 'dragon', 'ruins', 'time'];

    // 현재 회차에 이미 할당된 이벤트가 있는지 확인 (재시작 시 유지)
    // 하지만 usedEvents는 문자열 배열이므로, 순서대로 할당되었다고 가정하거나,
    // cycle 인덱스를 사용하여 매핑해야 함.
    // 단순하게: usedEvents의 길이는 현재 진행한 회차 수와 같아야 함 (0회차 -> 1개 할당)
    // 만약 usedEvents.length > cycle 이면 이미 할당된 것.
    // 만약 usedEvents.length <= cycle 이면 새로 할당해야 함.

    // [보정] 하드 리셋 시 usedEvents도 초기화해야 함 (triggerReset('hard')에서 처리 필요)

    if(usedEvents.length > cycle) {
        // 이미 할당됨
        gameState.currentEventDungeon = usedEvents[cycle];
    } else {
        // 새로 할당
        let available = ALL_EVENTS.filter(e => !usedEvents.includes(e));
        if(available.length > 0) {
            let pick = available[Math.floor(Math.random() * available.length)];
            usedEvents.push(pick);
            localStorage.setItem('turnRpgUsedEvents', JSON.stringify(usedEvents));
            gameState.currentEventDungeon = pick;
        } else {
            gameState.currentEventDungeon = null; // 남은 게 없음
        }
    }
}

function initArtifactsWithNGPlus() {
    // 기본 유물 목록으로 복구
    ARTIFACTS = JSON.parse(JSON.stringify(BASE_ARTIFACTS));

    // 클리어 기록 확인
    const clears = getClearHistory(); // ['zeke', 'luna', ...]

    // 1. 공통 유물 추가 (100% 확률)
    if(clears.length > 0) {
        clears.forEach(char => {
            if(NEW_ARTIFACTS[char]) {
                // 중복 방지 체크 (혹시 모르니)
                if(!ARTIFACTS.find(a => a.id === NEW_ARTIFACTS[char].id)) {
                    ARTIFACTS.push(NEW_ARTIFACTS[char]);
                }
            }
        });

        // 2. 전설 유물 강화 (클리어 시 100% 확률로 강화)
        clears.forEach(char => {
            upgradeLegendaryArtifact(char);
        });
    }

    // 3. 보스 드랍 유물 해금 목록 추가 (리롤 풀에 추가) - 클리어 여부와 무관하게 적용
    let bossUnlocks = getBossArtifactUnlocks();
    bossUnlocks.forEach(id => {
        // BOSS_DROP_ARTIFACTS에서 찾아서 추가
        let drop = null;
        for(let k in BOSS_DROP_ARTIFACTS) {
            if(BOSS_DROP_ARTIFACTS[k].id === id) drop = BOSS_DROP_ARTIFACTS[k];
        }
        if(drop && !ARTIFACTS.find(a => a.id === drop.id)) {
            ARTIFACTS.push(drop);
        }
    });

    // 4. 5회차(Run 6) 이상일 경우 특정 에픽 유물 진화 (마안, 얼음의심장)
    let cycle = getCycleCount();
    if(cycle >= 5) {
        // 마안 -> 진: 마안
        let eye = ARTIFACTS.find(a => a.id === 'demon_eye');
        if(eye) {
            eye.id = 'demon_eye_legend';
            eye.name = "진: 마안";
            eye.desc = "전투 개시 후 5턴간 물공/마공 +150%";
            eye.val = 1.5;
            eye.effect = 'demon_eye_legend';
            eye.rarity = 'legend';
        }
        // 얼음의심장 -> 진: 얼음의심장
        let heart = ARTIFACTS.find(a => a.id === 'heart_ice');
        if(heart) {
            heart.id = 'heart_ice_legend';
            heart.name = "진: 얼음의 심장";
            heart.desc = "체력 50% 미만에서 물방/마방 +150%";
            heart.val = 1.5;
            heart.effect = 'heart_ice_legend';
            heart.rarity = 'legend';
        }
    }
}

function getBossArtifactUnlocks() {
    let unlocks = localStorage.getItem('turnRpgBossDrops');
    return unlocks ? JSON.parse(unlocks) : [];
}

function unlockBossArtifact(id) {
    let unlocks = getBossArtifactUnlocks();
    if(!unlocks.includes(id)) {
        unlocks.push(id);
        localStorage.setItem('turnRpgBossDrops', JSON.stringify(unlocks));
    }
}

function upgradeLegendaryArtifact(char) {
    // 지크 -> 황금의태양
    if(char === 'zeke') {
        let art = ARTIFACTS.find(a => a.id === 'golden_sun');
        if(art) {
            art.name = "진: 황금의 태양";
            art.desc = "공/마공 +70%, 마법방어 -30%";
            art.val = 0.70; // recalcAllStats에서 별도 처리 필요하지만 val도 업데이트
            art.effect = 'golden_sun_legend'; // 효과 ID 변경
            art.rarity = 'legend';
        }
    }
    // 루나 -> 벨제뷔트
    if(char === 'luna') {
        let art = ARTIFACTS.find(a => a.id === 'beelzebub');
        if(art) {
            art.name = "진: 마신기 벨제뷔트";
            art.desc = "공격 +60% / 치명피해 +70%, 방어 -30%";
            art.val = 0.60;
            art.effect = 'beelzebub_legend';
            art.rarity = 'legend';
        }
    }
    // 자스민 -> 아이리스
    if(char === 'jasmine') {
        let art = ARTIFACTS.find(a => a.id === 'iris');
        if(art) {
            art.name = "진: 신기 아이리스";
            art.desc = "마공/마방 +70%";
            art.val = 0.70;
            art.effect = 'iris_legend';
            art.rarity = 'legend';
        }
    }
    // 여왕 -> 로열크라운
    if(char === 'queen') {
        let art = ARTIFACTS.find(a => a.id === 'royal_crown');
        if(art) {
            art.name = "진: 로열 크라운";
            art.desc = "올스탯 +30% (여왕: 시작시 장미+10)";
            art.val = 0.30;
            art.effect = 'royal_crown_legend';
            art.rarity = 'legend';
        }
    }
    // 루미 -> 수호천사의 깃털
    if(char === 'rumi') {
        let art = ARTIFACTS.find(a => a.id === 'guardian_angel');
        if(art) {
            art.name = "진: 수호천사의 깃털";
            art.desc = "사망 시 1회 부활 (HP 100%)";
            art.val = 1.0;
            art.effect = 'guardian_angel_legend';
            art.rarity = 'legend';
        }
    }
}

function getClearHistory() {
    let history = localStorage.getItem('turnRpgClears');
    return history ? JSON.parse(history) : [];
}

function getCycleCount() {
    let cycle = localStorage.getItem('turnRpgCycle');
    return cycle ? parseInt(cycle) : 0;
}

function incrementCycle() {
    let cycle = getCycleCount();
    localStorage.setItem('turnRpgCycle', cycle + 1);
}

function getMaxLevel() {
    return Math.min(30, 25 + getCycleCount());
}

function saveClear(charKey) {
    let history = getClearHistory();
    if(!history.includes(charKey)) {
        history.push(charKey);
        localStorage.setItem('turnRpgClears', JSON.stringify(history));
    }
}

function recalcAllStats() {
    if(!player || !player.baseStats) return;

    let growth = 1.0 + (player.level - 1) * 0.1;

    // Base Calculation
    let baseMaxHp = Math.floor(player.baseStats.hp * growth);
    let baseMaxMp = player.fixedMp ? player.baseStats.mp : Math.floor(player.baseStats.mp * growth);
    let baseAtk = Math.floor(player.baseStats.atk * growth);
    let baseMatk = Math.floor(player.baseStats.matk * growth);
    let baseDef = Math.floor(player.baseStats.def * growth);
    let baseMdef = Math.floor(player.baseStats.mdef * growth);

    // Equipments
    for(let i=0; i<gameState.equipWeapon; i++) {
        let s = EQUIP_STATS[player.charKey].weapon[i];
        baseAtk += s.atk;
        baseMatk += s.matk;
    }
    for(let i=0; i<gameState.equipArmor; i++) {
        let s = EQUIP_STATS[player.charKey].armor[i];
        baseDef += s.def;
        baseMdef += s.mdef;
    }

    player.baseCrit = CHAR_DATA[player.charKey].baseCrit;
    player.baseEva = CHAR_DATA[player.charKey].baseEva;
    player.baseCritDmg = CHAR_DATA[player.charKey].baseCritDmg;

    // 대현자 히든 기믹
    if(player.charKey === 'rumi') {
        player.baseCrit += (player.level - 1) * 0.01;
    }
    // 루나 히든 패시브
    if(player.charKey === 'luna') {
        player.baseCritDmg += (player.level - 1) * 0.01;
    }

    // Additive Modifiers
    let hpPer = 0.0, mpPer = 0.0, atkPer = 0.0, matkPer = 0.0, defPer = 0.0, mdefPer = 0.0;

    // Artifacts
    player.artifacts.forEach(art => {
        if(art.effect === 'stat_hp') hpPer += art.val;
        if(art.effect === 'stat_mp') mpPer += art.val;
        if(art.effect === 'stat_atk') atkPer += art.val;
        if(art.effect === 'stat_matk') matkPer += art.val;
        if(art.effect === 'stat_def') defPer += art.val;
        if(art.effect === 'stat_mdef') mdefPer += art.val;

        if(art.effect === 'stat_crit') player.baseCrit += art.val;
        if(art.effect === 'stat_eva') player.baseEva += art.val;

        if(art.effect === 'stat_def_mdef') { defPer += art.val; mdefPer += art.val; }
        if(art.effect === 'crit_critdmg') { player.baseCrit += 0.1; player.baseCritDmg += 0.3; }
        if(art.effect === 'dark_pendant') { player.baseCrit += 0.1; player.baseCritDmg += 1.0; }
        if(art.effect === 'matk_mp') { matkPer += art.val; mpPer += art.val; }
        if(art.effect === 'atk_matk') { atkPer += art.val; matkPer += art.val; }
        if(art.effect === 'atk_hp') { atkPer += art.val; hpPer += art.val; }

        if(art.effect === 'dragon_heart') { hpPer += 0.4; atkPer += 0.2; }
        if(art.effect === 'ancient_book') { mpPer += 0.4; matkPer += 0.2; }

        if(art.effect === 'golden_sun') { atkPer += 0.40; matkPer += 0.40; mdefPer -= 0.2; }
        if(art.effect === 'golden_sun_legend') { atkPer += 0.70; matkPer += 0.70; mdefPer -= 0.3; }

        if(art.effect === 'beelzebub') { atkPer += 0.5; defPer -= 0.3; player.baseCritDmg += 0.5; }
        if(art.effect === 'beelzebub_legend') { atkPer += 0.6; defPer -= 0.3; player.baseCritDmg += 0.7; }

        if(art.effect === 'iris') { matkPer += 0.5; mdefPer += 0.5; }
        if(art.effect === 'iris_legend') { matkPer += 0.7; mdefPer += 0.7; }

        if(art.effect === 'all_stat') { hpPer+=0.2; mpPer+=0.2; atkPer+=0.2; matkPer+=0.2; defPer+=0.2; mdefPer+=0.2; }
        if(art.effect === 'royal_crown_legend') { hpPer+=0.3; mpPer+=0.3; atkPer+=0.3; matkPer+=0.3; defPer+=0.3; mdefPer+=0.3; }

        if(art.effect === 'blood_pact') { hpPer -= 0.2; atkPer += 0.3; matkPer += 0.3; }
        if(art.effect === 'reckless') { defPer -= 0.3; player.baseCritDmg += art.val; }

        // New Boss Artifacts
        // Description and value say +50%; the old code added +100%.
        if(art.effect === 'hestia') {
            hpPer += art.val; mpPer += art.val; atkPer += art.val; matkPer += art.val; defPer += art.val; mdefPer += art.val;
        }
        if(art.effect === 'legend_mark') {
            hpPer += art.val; mpPer += art.val; atkPer += art.val; matkPer += art.val; defPer += art.val; mdefPer += art.val;
        }
        if(art.effect === 'dragon_scale') { hpPer += art.val; defPer += art.val; mdefPer += art.val; }
        if(art.effect === 'dream_choco') {
            atkPer += 0.6; matkPer += 0.6;
        }
        if(art.effect === 'blue_moon') {
            mpPer += 0.2;
        }
    });

    // Buffs (Battle) - 이제 합연산으로 계산 및 상태창 반영
    if(buffs && buffs.player) {
        if(buffs.player.demonEyeTurns > 0) {
            atkPer += 1.0;
            matkPer += 1.0;
        }
        if(buffs.player.demonEyeLegendTurns > 0) {
            atkPer += 1.5;
            matkPer += 1.5;
        }
        if(buffs.player.royalBloomTurns > 0) { atkPer += 0.5; matkPer += 0.5; }

        // Sage Forms
        if(buffs.player.sageForm === 'star') { defPer += 0.5; mdefPer += 0.5; }
        else if(buffs.player.sageForm === 'moon') { matkPer += 0.5; atkPer -= 0.5; }
        else if(buffs.player.sageForm === 'sun') { atkPer += 1.0; defPer -= 0.5; mdefPer -= 0.5; }

        if(buffs.player.milkshakeTurns > 0) { defPer += 0.3; mdefPer += 0.3; }

        // Other Buffs
        if(buffs.player.goddessTurns > 0) { atkPer += 1.0; matkPer += 1.0; defPer += 1.0; mdefPer += 1.0; }
        if(buffs.player.goddessBlessing) { atkPer += 0.5; matkPer += 0.5; }
        if(buffs.player.undyingPowerTurns > 0) { atkPer += 1.0; }
        if(buffs.player.divineTurns > 0) { defPer += 0.3; mdefPer += 0.3; }
        if(buffs.player.castleDef100) { defPer += 1.0; }
    }

    // Apply Multipliers
    let finalMaxHp = Math.floor(baseMaxHp * (1 + hpPer));
    let finalMaxMp = Math.floor(baseMaxMp * (1 + mpPer));

    // Dynamic checks dependent on HP (Boss Artifacts & Passives)
    if(player.hp) {
         let ratio = player.hp / finalMaxHp;

         // Zeke Passive
         if(player.charKey === 'zeke') {
             if(ratio < 0.25) { atkPer += 0.3; defPer += 0.3; }
             else if(ratio < 0.5) { atkPer += 0.15; defPer += 0.15; }
         }

         // Heart of Ice (Ice Heart)
         if(ratio < 0.5) {
             if(hasArtifact('heart_ice')) {
                 defPer += 1.0;
                 mdefPer += 1.0;
             }
             if(hasArtifact('heart_ice_legend')) {
                 defPer += 1.5;
                 mdefPer += 1.5;
             }
         }
    }

    let finalAtk = Math.floor(baseAtk * (1 + atkPer));
    let finalMatk = Math.floor(baseMatk * (1 + matkPer));

    // 메디테이션 마공 50% 감소 반영 (UI 표기용)
    if(buffs && buffs.player && buffs.player.medi) {
        finalMatk = Math.floor(finalMatk * 0.5);
    }

    let finalDef = Math.floor(baseDef * (1 + defPer));
    let finalMdef = Math.floor(baseMdef * (1 + mdefPer));

    // 방어력이 0 미만으로 내려가지 않도록 보정 (벨제뷔트 등)
    finalDef = Math.max(0, finalDef);
    finalMdef = Math.max(0, finalMdef);

    if(buffs && buffs.player && buffs.player.defZero) {
        finalDef = 0;
    }

    player.maxHp = finalMaxHp;
    player.maxMp = finalMaxMp;
    player.atk = finalAtk;
    player.matk = finalMatk;
    player.def = finalDef;
    player.mdef = finalMdef;

    player.hp = Math.min(player.hp, player.maxHp);
    player.mp = Math.min(player.mp, player.maxMp);
}

function rollArtifact(highQuality=false) {
    // 1. NG+ 및 보스 해금 유물을 포함한 전체 ARTIFACTS 목록 갱신
    // (보스 드랍 유물이 해금되었는데 ARTIFACTS에 없는 경우를 방지)
    let bossUnlocks = getBossArtifactUnlocks();
    bossUnlocks.forEach(id => {
         let drop = null;
         for(let k in BOSS_DROP_ARTIFACTS) {
             if(BOSS_DROP_ARTIFACTS[k].id === id) drop = BOSS_DROP_ARTIFACTS[k];
         }
         if(drop && !ARTIFACTS.find(a => a.id === drop.id)) {
             ARTIFACTS.push(drop);
         }
    });

    let available = ARTIFACTS.filter(a => !hasArtifact(a.id));
    if(available.length === 0) return null;

    let pick;
    if(highQuality) {
        // Weighted random for High Quality
        let weighted = [];
        available.forEach(a => {
            let w = 1;
            if(a.rarity === 'epic') w = 3;
            if(a.rarity === 'legend') w = 3;
            for(let i=0; i<w; i++) weighted.push(a);
        });
        pick = weighted[Math.floor(Math.random() * weighted.length)];
    } else {
        // Uniform random
        pick = available[Math.floor(Math.random() * available.length)];
    }

    player.artifacts.push(pick);
    recalcAllStats();
    return pick;
}

function hasArtifact(key) {
    return player.artifacts && player.artifacts.some(a => a.id === key || a.effect === key);
}

    if(skill.effect === 'reset_buff') {

    recalcAllStats();
}

function playerAttack(skill) {
    if(currentEnemy.name === "마신") {
        if(turnCount % 2 !== 0 && skill.type === 'phy') { log("마신은 홀수 턴에 물리 공격에 면역입니다!", 'info'); return true; }
        if(turnCount % 2 === 0 && skill.type === 'mag') { log("마신은 짝수 턴에 마법 공격에 면역입니다!", 'info'); return true; }
    }

    if(currentEnemy.ai === 'artificial_god') {
        if(skill.type === 'phy') buffs.enemy.nextPhysDef = true;
        if(skill.type === 'mag') buffs.enemy.nextMagDef = true;
    }

    if(buffs.enemy.counter && skill.type === 'phy') {
        let counterDmg = Math.floor(currentEnemy.atk * 2.0);
        player.hp -= counterDmg;
        log(`${currentEnemy.name}의 카운터! <span class="dmg">${counterDmg}</span>의 피해를 입고 반격당했습니다!`, 'dmg');
        return true;
    }

    if(skill.effect === 'miss_chance' && Math.random() < 0.3) { log(`${skill.name}이(가) 빗나갔습니다!`, 'info', { miss: 'enemy' }); return true; }

    let multiplier = skill.power;

    if(skill.name === '더 홀리' && buffs.player.goddessTurns) {
        multiplier += 2.0;
        log("여신 강림의 힘으로 추가타가 발생합니다!", 'holy');
    }

    if(skill.effect === 'stack_dmg') {
        multiplier += (buffs.player.absoluteStack || 0);
        buffs.player.absoluteStack = Math.min(5.0, (buffs.player.absoluteStack || 0) + 1.0);
    }

    if(skill.effect === 'rose_finisher') {
        multiplier += (roseStack * 0.4);
        multiplier = Math.min(11.0, multiplier);
        roseStack = 0;
        log("피날레! 모든 장미가 폭발합니다!", 'rose');
    }

    if(skill.effect === 'hp_reverse') {
        let lostRatio = (player.maxHp - player.hp) / player.maxHp;
        multiplier = 3.0 + (lostRatio * 6.0);
    }
    if(skill.effect === 'hp_reverse_mid') {
        let lostRatio = (player.maxHp - player.hp) / player.maxHp;
        multiplier = 1.2 + (lostRatio * 2.2);
    }

    if(skill.effect === 'stack_ult_new') {
        buffs.player.castleStack = Math.min(5, (buffs.player.castleStack || 0) + 1);
        multiplier = buffs.player.castleStack * 2.0;
        buffs.player.castleDef100 = true;
    }
    if(skill.effect === 'charge_divine') {
        let stack = buffs.player.divineStack || 0;
        multiplier += (stack * 0.3);
        buffs.player.divineStack = 0;
        log(`디바인 블레이드! ${stack}스택 폭발!`, 'holy');
    }

    if(skill.effect === 'sage_silent' && buffs.player.sageForm === 'moon') multiplier += 0.4;
    if(skill.effect === 'sage_god_hand' && buffs.player.sageForm === 'sun') multiplier += 0.8;

    if(skill.effect === 'sage_dream_ult') {
        multiplier = 4.0;
        let activeForm = buffs.player.sageForm;

        if(activeForm) {
            delete buffs.player.sageForm;
            delete buffs.player.formTurns;
            recalcAllStats();
        }

        if(activeForm === 'star') {
            buffs.enemy.stun = true;
            log("[별의 꿈] 적을 기절시킵니다!", 'star');
        } else if(activeForm === 'moon') {
            buffs.player.moonUltStack = (buffs.player.moonUltStack || 0) + 1;
            let bonus = buffs.player.moonUltStack * 3.5;
            multiplier = bonus;
            log(`[달의 꿈] 누적된 카운트(${buffs.player.moonUltStack})로 위력 폭발! (+${bonus.toFixed(1)}배)`, 'star');
        } else if(activeForm === 'sun') {
            let crystals = player.dreamCrystals || 0;
            let bonus = crystals * 1.5;
            multiplier += bonus;
            log(`[태양의 꿈] 남은 결정(${crystals})만큼 위력 증가! (+${bonus.toFixed(1)}배)`, 'star');
        } else {
            multiplier = 2.5;
            log("형태 없이 사용하여 기본 위력으로 발동합니다.", 'info');
        }
    }

    let isPhy = skill.type === 'phy';
    let atkVal = isPhy ? player.atk : player.matk;

    if(skill.effect === 'sage_hybrid_mana' || skill.effect === 'charge_milkyway') {
        atkVal = (player.atk + player.matk);
        if(skill.effect === 'sage_hybrid_mana') atkVal /= 2;

        if(skill.effect === 'charge_milkyway') {
            log("은하수의 힘이 개방됩니다!", 'star');
        }
    }

    // Final Damage Artifacts (Additive)
    let finalDmgAdd = 0.0;
    if(hasArtifact('high_risk_dmg')) finalDmgAdd += 0.5;
    if(hasArtifact('high_risk_dmg_ex')) finalDmgAdd += 1.0;
    if(hasArtifact('pharaoh')) finalDmgAdd += 1.0;

    if(finalDmgAdd > 0) multiplier *= (1.0 + finalDmgAdd);

    if(buffs.player.undyingPowerTurns) log("죽음을 극복한 힘으로 공격력이 2배가 됩니다!", 'fire');

    let critChance = player.baseCrit;
    if(buffs.player.critBuff) {
    critChance += (player.charKey === 'rumi') ? 0.40 : 0.25;}
    if(skill.effect === 'guarantee_crit') critChance = 1.0;
    if(skill.name === '어쌔신 네일') critChance += (buffs.enemy.darkness || 0) * 0.3;


    let isCrit = Math.random() < critChance;
    if(isCrit) {
        let critDmg = player.baseCritDmg;
        if(buffs.player.adrenalineTurns) critDmg += 1.0;
        // 무모한 돌진 is already in baseCritDmg (+80%, as described); it used to be added twice.
        atkVal *= critDmg;
    }

    let defVal = isPhy ? currentEnemy.def : currentEnemy.mdef;

    // Enemy Def Reduction (Additive)
    let defRed = 0.0;
    if(skill.type === 'phy' && buffs.enemy.darkness) {
        defRed += 0.10 * buffs.enemy.darkness;
    }
    if(isPhy && buffs.enemy.defDownTurns > 0) defRed += 0.2;
    if(!isPhy && buffs.enemy.mdefDownTurns > 0) defRed += 0.2;

    if(isPhy && buffs.enemy.physDefBuff) defRed -= 0.5;
    if(!isPhy && buffs.enemy.magDefBuff) defRed -= 0.5;

    // Cap reduction? 100% means 0 def.
    defRed = Math.min(1.0, defRed);
    defVal *= (1 - defRed);
    defVal = Math.max(0, defVal);

    let dmg = atkVal * multiplier * (100 / (100 + defVal));
    dmg = Math.floor(dmg);
    dmg = Math.max(1, dmg);

    if(skill.effect === 'hp_cost') player.hp -= player.maxHp * 0.1;
    if(skill.effect === 'hp_cost_20') player.hp -= player.maxHp * 0.2;
    if(skill.effect === 'darkness' || skill.name === '다크 메테오') {
        let add = 0;
        if(skill.name === '크로스 컷' && isCrit) add = 3;
        else if(skill.name === '섀도우 볼') add = 1;
        else if(skill.name === '다크 메테오') add = 1;

        if(add > 0) {
            buffs.enemy.darkness = Math.min(5, (buffs.enemy.darkness || 0) + add);
            log(`암흑 스택이 ${add} 쌓였습니다! (현재: ${buffs.enemy.darkness})`, 'info');
        }
    }

    if(skill.effect === 'sage_hybrid_mana' && isCrit) {
        player.mp = Math.min(player.maxMp, player.mp + 40);
        log("트윙클 치명타! 마나 40 회복.", 'heal');
    }

    if(skill.effect === 'self_stun' || skill.effect === 'rose_2_self_stun') {
        buffs.player.nextTurnStun = true;
        log("무리한 행동으로 다음 턴에 움직일 수 없습니다!", 'info');
    }

    if(skill.effect === 'self_def_zero') buffs.player.defZeroNext = true;

    if(skill.effect === 'def_down') buffs.enemy.defDownTurns = 3;
    if(skill.effect === 'mdef_down') buffs.enemy.mdefDownTurns = 3;

    if(skill.effect === 'add_rose_1') roseStack = Math.min(15, roseStack + 1);
    if(skill.effect === 'rose_2_self_stun') roseStack = Math.min(15, roseStack + 2);
    if(skill.effect === 'crit_rose_6' && isCrit) { roseStack = Math.min(15, roseStack + 6); log("치명타! 장미가 급격히 피어납니다!", 'rose'); }

    let enchantDmg = 0;
    if(buffs.player.enchantTurns > 0 && isPhy) {
        let eMult = 0.8;
        if(skill.effect === 'fire_combo_new') eMult = 1.6;
        enchantDmg = Math.floor(player.matk * eMult * (100 / (100 + currentEnemy.mdef)));
        enchantDmg = Math.max(1, enchantDmg);
    }

    currentEnemy.hp -= dmg;
    buffs.enemy.tookDamageThisTurn = true;

    let critMsg = isCrit ? " <b>(치명타!)</b>" : "";
    log(`${skill.name}! 적에게 <span class="dmg">${dmg}${critMsg}</span> 피해.`, 'info', { crit: isCrit });

    if(enchantDmg > 0) {
        currentEnemy.hp -= enchantDmg;
        log(`파이어 인챈트 추가타! <span class="fire">${enchantDmg}</span> 마법 피해.`, 'fire');
    }

    if(hasArtifact('vampire')) {
        let heal = Math.floor((dmg + enchantDmg) * 0.05);
        player.hp = Math.min(player.maxHp, player.hp + heal);
    }

    if(skill.effect === 'multi_hit' && buffs.player.dodgeCount) {
        let hits = Math.min(4, buffs.player.dodgeCount);
        let extraDmg = dmg * hits;
        extraDmg = Math.max(1, extraDmg);
        currentEnemy.hp -= extraDmg;
        log(`댄싱 대거 추가 ${hits}타! <span class="dmg">${extraDmg}</span> 피해.`);
    }

    if(currentEnemy.ai === 'pharaoh' && buffs.enemy.pharaohStance) {
        log(`<b style="color:#8d6e63">파라오가 공격에 반응하여 고대의 저주를 발동합니다! (공/마공 +100%)</b>`, 'dmg');
        buffs.enemy.pharaohBuffTurns = 10;
        delete buffs.enemy.pharaohStance;
    }

    return currentEnemy.hp > 0;
}

function swapBoss() {
    if(!gameState.hiddenBossReserve || gameState.hiddenBossDead) return;

    log(`<b style="color:#ffd700">=== 보스 교대 ===</b>`, 'info');

    // 1. 현재 보스 상태 저장
    let currentData = JSON.parse(JSON.stringify(currentEnemy));
    gameState.hiddenBossReserve[currentData.ai] = currentData.hp;

    // 2. 예비 보스 로드
    let nextBossId = currentEnemy.ai === 'iris_light' ? 'iris_curse' : 'iris_light';
    let nextBoss = ENEMIES.find(e => e.ai === nextBossId);
    if(!nextBoss) return;

    // Deep Copy
    currentEnemy = JSON.parse(JSON.stringify(nextBoss));

    // HP 복원
    let savedHp = gameState.hiddenBossReserve[nextBossId];
    if(savedHp !== undefined) currentEnemy.hp = savedHp;
    else currentEnemy.hp = currentEnemy.maxHp;

    if(gameState.hiddenBossReserve.maxHp) currentEnemy.maxHp = gameState.hiddenBossReserve.maxHp;
    if(gameState.hiddenBossReserve.scaledStats) {
        let s = gameState.hiddenBossReserve.scaledStats;
        if(nextBossId === 'iris_light') {
            currentEnemy.atk = s.light.atk; currentEnemy.matk = s.light.matk;
            currentEnemy.def = s.light.def; currentEnemy.mdef = s.light.mdef;
        } else {
            currentEnemy.atk = s.curse.atk; currentEnemy.matk = s.curse.matk;
            currentEnemy.def = s.curse.def; currentEnemy.mdef = s.curse.mdef;
        }
    }

    // Reset buffs on swap
    buffs.enemy = {};

    log(`${currentEnemy.name} 등장!`, 'info');
}
