<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#183d40">
  <title>ASTRA · 별빛 정원</title>
  <style>/*__STYLE__*/</style>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <button class="brand" data-nav="home" aria-label="별빛 정원 홈"><span class="brand-star">✦</span><span><b>ASTRA</b><small>별빛 정원</small></span></button>
      <div class="wallet" aria-label="보유 재화"><span><i class="crystal">◆</i><b id="dreams">600</b><small>꿈의결정</small></span><span><i class="dust">✧</i><b id="dust">180</b><small>별가루</small></span></div>
      <button class="icon-button" data-action="settings" aria-label="설정"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </header>
    <div id="save-warning" class="save-warning" role="alert" hidden></div>
    <main id="content" tabindex="-1" aria-live="off"></main>
    <nav id="navigation" class="bottom-nav" aria-label="주 메뉴"></nav>
  </div>
  <div id="overlay" class="overlay" hidden>
    <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
      <div class="sheet-top"><div><small id="sheet-kicker"></small><h2 id="sheet-title"></h2></div><button class="icon-button" data-action="close" aria-label="닫기">×</button></div>
      <div id="sheet-body" class="sheet-body"></div>
      <div id="sheet-footer" class="sheet-footer"></div>
    </section>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <input id="backup-input" type="file" accept="application/json,.json" hidden>
  <script>/*__ASSETS__*/</script>
  <script>/*__SCRIPT__*/</script>
</body>
</html>
