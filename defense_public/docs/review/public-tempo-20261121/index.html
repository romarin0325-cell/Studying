<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>공개판 템포 전후 비교</title>
<style>
:root{--bg:#0d1324;--panel:#16203a;--line:#2a3658;--ink:#eef2ff;--mute:#9aa6c8;--gold:#f2c76a;--teal:#62d6c4}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f3f6fb;--panel:#fff;--line:#d7deeb;--ink:#17203a;--mute:#5b6787;--gold:#b7811c;--teal:#13917f}}
:root[data-theme="light"]{--bg:#f3f6fb;--panel:#fff;--line:#d7deeb;--ink:#17203a;--mute:#5b6787;--gold:#b7811c;--teal:#13917f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:18px;margin:0 12px 0 0}.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:transparent;color:var(--mute);border:0;padding:7px 12px;font:inherit;cursor:pointer}.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:700}
main{max-width:1180px;margin:0 auto;padding:16px}
.note{color:var(--mute);margin:4px 0 16px}
.shot{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 18px}
.shot h2{font-size:16px;margin:0 0 4px}.shot p{margin:0 0 12px;color:var(--mute)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,390px));gap:16px;justify-content:center}
.pair figure{margin:0}.pair figcaption{font-size:13px;color:var(--mute);margin:0 0 6px;text-align:center}
.pair img{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--line);background:#000}
body.single .pair{grid-template-columns:minmax(0,390px)}body.single .pair figure.before{display:none}
body.single.show-before .pair figure.before{display:block}body.single.show-before .pair figure.after{display:none}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right}th:first-child,td:first-child{text-align:left}
.tablewrap{overflow-x:auto}
@media (max-width:820px){.pair{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
</style>
</head>
<body>
<header>
  <h1>공개판 템포 · 전후 비교</h1>
  <span class="seg" id="theme"><button data-v="night" aria-pressed="true">밤</button><button data-v="bright" aria-pressed="false">맑음</button></span>
  <span class="seg" id="view"><button data-v="pair" aria-pressed="true">나란히</button><button data-v="after" aria-pressed="false">공개판만</button><button data-v="before" aria-pressed="false">원본만</button></span>
</header>
<main>
<p class="note">왼쪽은 원본 <code>defense/</code>(origin/main), 오른쪽은 <code>defense_public/</code>. 같은 시각(2026-11-23 월 12:10 KST), 같은 계정(스테이지 30, 동료 18명)으로 Chrome 390×844에서 찍었다. 다시 찍기: <code>node defense_public/scripts/review-tempo.mjs</code>. 이 페이지는 정지 화면만 비교한다. 클릭 흐름은 <code>tests/browser.mjs</code>, 하루 진행은 <code>scripts/day-sim.mjs</code>가 확인한다.</p>
<div id="shots"></div>
</main>
<script>
const SHOTS=[
 ['lobby','로비','수호자 알약에 교대까지 남은 시간(4시간 주기). 원본은 월간 수호자.'],
 ['summon-normal','일반 소환','"이번 주 픽업" → "지금 픽업"과 2시간 교대 카운트다운. 10회 버튼 아래 "퀴즈 정답 시 UR 2배" → "행운 보너스 10%".'],
 ['rates','소환 확률','UR 0.2% → 0.4% 고정. 행운 보너스 규칙 한 줄. 픽업 교대 주기.'],
 ['summon-season','수호자 소환','"이달의 수호자" → "수호자 소환", 4시간 교대.'],
 ['draft','유성 드래프트','"주간 · 월요일 초기화" → "4시간마다 초기화", 보상 ×3(쉬움 완주 845 → 2,535).'],
 ['hunt','만월 토벌전','월간 → 8시간마다, 보상 ×3(쉬움 완주 1,247 → 3,741).'],
 ['event','이벤트(서약·쌍성)','격주 → 4시간마다 교대, 시즌 8시간, 구간 보상 ×3.'],
 ['garden','정원','파견 24시간 → 1시간(가속 퀴즈 버튼 없음). 선물 바구니 8칸(15분마다).'],
 ['library','별의 서재','강의·용어 탭과 오답 노트가 사라지고 갤러리만. "원정에서 이길 때마다 별 하나".'],
 ['settings','설정','루미 AI 해설(Gemini API 키 입력) 패널 삭제.'],
 ['sprout','새싹','"새싹 일주일"(접속일) → "새싹 일곱 걸음"(앞 단계 할 일을 마치면 다음 칸).'],
 ['result','메인 승리 결과','별가루, 편성 동료의 전투 인연(+8), 루미의 별 진행 줄 추가. 첫 클리어 보상은 레벨에 따라 최대 3배.'],
];
let theme='night',view='pair';
function render(){
  document.getElementById('shots').innerHTML=SHOTS.map(([id,name,text])=>`<section class="shot"><h2>${name}</h2><p>${text}</p><div class="pair"><figure class="before"><figcaption>원본</figcaption><img loading="lazy" src="before/${theme}/${id}.webp" alt="원본 ${name}"></figure><figure class="after"><figcaption>공개판</figcaption><img loading="lazy" src="after/${theme}/${id}.webp" alt="공개판 ${name}"></figure></div></section>`).join('');
  document.body.classList.toggle('single',view!=='pair');document.body.classList.toggle('show-before',view==='before');
  document.documentElement.dataset.theme=theme==='bright'?'light':'dark';
}
for(const [group,set] of [['theme',v=>theme=v],['view',v=>view=v]])document.getElementById(group).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;set(b.dataset.v);for(const x of b.parentElement.children)x.setAttribute('aria-pressed',x===b);render();});
render();
</script>
</body>
</html>
