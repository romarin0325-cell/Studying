<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../">
<title>ASTRA · 공격 가독성 검토</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#122936;color:#eee7d2;font:14px system-ui}main{max-width:720px;margin:auto}header,form,footer{padding:12px 16px}h1{font-size:18px;margin:0 0 8px}p{color:#c1cec9;line-height:1.5;margin:4px 0}form{display:flex;gap:10px;flex-wrap:wrap;background:#1c3845}label{display:flex;align-items:center;gap:6px}button,select,input{font:inherit}button,select{min-height:38px;background:#284956;border:1px solid #719093;border-radius:6px;color:#fff2d3;padding:6px 10px}button{cursor:pointer}canvas{display:block;width:100%;height:auto;aspect-ratio:720/780}#scrub{width:100%;margin:10px 0}#readout{font-variant-numeric:tabular-nums}a{color:#b3e6de}
</style></head><body><main>
<header><h1>공격 가독성 검토</h1><p>실제 전투 엔진·에셋·렌더러. 적은 검토용 고정 배치이며, 체력만 높였습니다. 저장된 원정에는 영향을 주지 않습니다.</p></header>
<form id="controls" onsubmit="return false">
<label>동료 <select id="hero" aria-label="검토 동료"></select></label>
<label>배치 <select id="layout" aria-label="검토 배치"><option value="solo">단독 · 위쪽</option><option value="right">단독 · 오른쪽</option><option value="left">단독 · 왼쪽</option><option value="bottom">단독 · 아래쪽</option><option value="dense">25명 · 18마리</option></select></label>
<label>배속 <select id="speed" aria-label="전투 배속"><option value="1">1×</option><option value="2">2×</option></select></label>
<label><input type="checkbox" id="reduced">효과 간소화</label><label><input type="checkbox" id="selected">선택 범위</label>
<button id="play" type="button">재생</button><button id="restart" type="button">처음</button><button id="skill" type="button">필살기</button>
</form>
<canvas id="review" aria-label="실제 전투 범위 검토"></canvas>
<footer><output id="readout"></output><input id="scrub" type="range" min="0" max="360" value="0" aria-label="검토 프레임"><p>슬라이더: 60Hz의 6초. 화면의 밝은 경계는 실제 명중 순간의 범위입니다. <a href="index.html">게임으로</a></p></footer>
<script type="module" src="tools/combat-review.js"></script>
</main></body></html>
