<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08111f" />
    <meta name="color-scheme" content="dark" />
    <title>Hero Core Defense</title>
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <div id="app" class="app-shell" aria-live="polite">
      <header class="app-header">
        <button id="back-button" class="icon-button is-hidden" type="button" aria-label="이전 화면">←</button>
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <div>
            <strong>HERO CORE DEFENSE</strong>
            <small id="scene-kicker">별빛 원정대</small>
          </div>
        </div>
        <button id="home-button" class="icon-button is-hidden" type="button" aria-label="메인 허브">⌂</button>
      </header>

      <div id="storage-warning" class="storage-warning is-hidden" role="alert">
        <strong>저장이 유지되지 않는 임시 실행입니다.</strong>
        <span>이 브라우저가 로컬 저장소를 차단했습니다. 새로고침하거나 창을 닫으면 진행이 사라지므로 다른 브라우저로 파일을 열어 주세요.</span>
      </div>

      <main id="scene-root" class="scene-root" tabindex="-1"></main>
    </div>

    <div id="modal-root" class="modal-root" aria-live="assertive"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="rotate-guard" class="rotate-guard" role="dialog" aria-modal="true" aria-labelledby="rotate-title">
      <div class="rotate-card">
        <span class="rotate-icon" aria-hidden="true">↻</span>
        <h2 id="rotate-title">기기를 가로로 돌려 주세요</h2>
        <p>전투는 넓은 전장을 한눈에 볼 수 있도록 가로 화면에서 진행됩니다.</p>
      </div>
    </div>

    <noscript>Hero Core Defense를 실행하려면 JavaScript가 필요합니다.</noscript>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
