name: Card
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: card-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      card: ${{ steps.scope.outputs.card }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo 'card=true' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" "$HEAD" | grep -E '^(card/|scripts/verify_card_|scripts/verify\.js$|package(-lock)?\.json$|\.github/workflows/card\.yml$)' >/dev/null; then
            echo 'card=true' >> "$GITHUB_OUTPUT"
          else
            echo 'card=false' >> "$GITHUB_OUTPUT"
          fi
  checks:
    needs: changes
    if: needs.changes.outputs.card == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint:card
      - run: npm run test:card:smoke
      - run: npm run test:card:browser
      - run: npm run verify:card
      - run: git diff --exit-code -- card/dist/DREAMWEAVER.html
  gate:
    name: Card release gate
    needs: [changes, checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          SCOPE: ${{ needs.changes.result }}
          CHANGED: ${{ needs.changes.outputs.card }}
          CHECKS: ${{ needs.checks.result }}
        run: |
          test "$SCOPE" = success
          if test "$CHANGED" = true; then test "$CHECKS" = success; fi
