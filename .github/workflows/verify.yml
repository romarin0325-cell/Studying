name: PR minimal verification
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: minimal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    name: Defense release gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERIFY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      VERIFY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        name: Select minimal verification
        run: node scripts/verify.js --plan --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.needs_install == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        if: steps.plan.outputs.needs_install == 'true'
        run: npm ci
      - name: Install Chromium
        if: steps.plan.outputs.needs_chromium == 'true'
        run: npx playwright install --with-deps chromium
      - name: Install WebKit
        if: steps.plan.outputs.needs_webkit == 'true'
        run: npx playwright install --with-deps webkit
      - name: Run selected verification
        if: steps.plan.outputs.has_commands == 'true'
        run: npm run verify
      - name: Record intentional no-runtime scope
        if: steps.plan.outputs.has_commands != 'true'
        run: echo "No runtime command is relevant to this diff; scope selection passed."
      - name: Preserve Star Garden review captures
        if: always() && hashFiles('defense_test/test-results/*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: defense-memorial-review
          path: |
            defense_test/test-results/*.png
            defense_test/test-results/*.json
          retention-days: 7
